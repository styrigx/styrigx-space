{{/* 2.3.14 首页锁屏：纯 JS 生成（渐进增强）。关了 JS 或搜索引擎抓取时，首页原内容不受影响。只在首页模板引入。 */}}
<script>
/* ===== 2.3.14 首页全屏锁屏 ===== */
(function(){
  var p=location.pathname;
  var isHome=(p==='/'||p==='/en'||p==='/en/');
  if(!isHome)return;
  var force=/(?:^|[?&])lock=1(?:&|$)/.test(location.search);
  var seen=false;
  try{seen=sessionStorage.getItem('sgx-lock-shown')==='1'}catch(e){}
  if(seen&&!force)return;

  var en=document.documentElement.lang==='en';
  var LOCK='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  var UNLOCK='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.9-1"/></svg>';

  /* 天气：和顶栏同一数据来源（localStorage sgx-weather 缓存），取不到就不显示 */
  function wxData(){
    try{
      if(localStorage.getItem('sgx-weather-show')==='0')return null;
      var c=JSON.parse(localStorage.getItem('sgx-weather')||'null');
      var d=c&&c.data;if(!d||!d.current)return null;
      var WXI={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️'};
      var unit=localStorage.getItem('sgx-temp-unit')==='f'?'f':'c';
      var t=d.current.temperature_2m;
      t=unit==='f'?Math.round(t*9/5+32):Math.round(t);
      return {icon:WXI[d.current.weather_code]||'☁️',temp:t+'°'};
    }catch(e){return null}
  }

  /* 头像：复用顶栏左侧头像图片 */
  var navImg=document.querySelector('#nav-brand img');
  var avatarSrc=navImg?navImg.src:'';

  var wx=wxData();
  var ov=document.createElement('div');
  ov.id='sgx-lock';
  ov.setAttribute('role','dialog');
  ov.setAttribute('aria-modal','true');
  ov.setAttribute('aria-label',en?'Lock screen':'锁屏');
  ov.innerHTML=
      '<div class="sgx-lock-top" id="sgx-lock-ic">'+LOCK+'</div>'
    + '<div class="sgx-lock-clockwrap"><div class="sgx-lock-clock" id="sgx-lock-clock">--:--</div>'
    + '<div class="sgx-lock-date"><span id="sgx-lock-date"></span>'
    + (wx?'<span class="sgx-lock-wx"><span aria-hidden="true">'+wx.icon+'</span><span>'+wx.temp+'</span></span>':'')
    + '</div></div>'
    + '<div class="sgx-lock-user"><button type="button" id="sgx-lock-avatar" aria-label="'+(en?'Unlock':'解锁进入首页')+'">'
    + '<span class="sgx-lock-halo" aria-hidden="true"></span>'
    + (avatarSrc?'<img src="'+avatarSrc+'" alt="Styrigx">':'<span class="sgx-lock-fb" aria-hidden="true">S</span>')
    + '</button><div class="sgx-lock-name">Styrigx</div></div>';
  document.body.appendChild(ov);
  document.body.classList.add('sgx-locked');
  document.documentElement.style.overflow='hidden';
  document.body.style.overflow='hidden';

  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var WDZH=['周日','周一','周二','周三','周四','周五','周六'];
  function tick(){
    var d=new Date();
    var c=document.getElementById('sgx-lock-clock');
    if(c)c.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    var de=document.getElementById('sgx-lock-date');
    if(de)de.textContent=en
      ?(MON[d.getMonth()]+' '+d.getDate()+', '+WD[d.getDay()])
      :((d.getMonth()+1)+'月'+d.getDate()+'日 '+WDZH[d.getDay()]);
  }
  tick();
  /* 每分钟整点刷新 */
  var _n=new Date();
  var _ms=(60-_n.getSeconds())*1000-_n.getMilliseconds();
  var _iv=null;
  setTimeout(function(){tick();_iv=setInterval(tick,60000)},_ms);

  var done=false;
  function reducedMotion(){
    return (window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        ||document.documentElement.classList.contains('reduced-motion');
  }
  function cleanup(){
    if(_iv)clearInterval(_iv);
    if(ov.parentNode)ov.parentNode.removeChild(ov);
    document.body.classList.remove('sgx-locked');
    document.documentElement.style.overflow='';
    document.body.style.overflow='';
  }
  function unlock(){
    if(done)return;done=true;
    try{sessionStorage.setItem('sgx-lock-shown','1')}catch(e){}
    var ic=document.getElementById('sgx-lock-ic');
    if(ic)ic.innerHTML=UNLOCK;
    if(reducedMotion()){
      ov.style.transition='opacity .25s ease';
      ov.style.opacity='0';
      setTimeout(cleanup,280);
    }else{
      document.body.classList.remove('sgx-locked');
      requestAnimationFrame(function(){requestAnimationFrame(function(){
        ov.classList.add('sgx-lock-out');
      })});
      setTimeout(cleanup,450);
    }
  }
  var av=document.getElementById('sgx-lock-avatar');
  if(av){
    av.addEventListener('click',function(e){e.stopPropagation();unlock()});
    try{av.focus({preventScroll:true})}catch(e){try{av.focus()}catch(_){}}
  }
  /* 电脑上回车/空格解锁；锁屏上其他位置点击无反应 */
  document.addEventListener('keydown',function(e){
    if(done||!document.getElementById('sgx-lock'))return;
    if(e.key==='Enter'||e.key===' '){
      var t=e.target;
      if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
      e.preventDefault();unlock();
    }
  });
})();
</script>

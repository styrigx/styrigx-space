name: styrigx · Setup Playwright (+ CJK fonts)
description: >-
  装 Playwright Chromium：浏览器按 lockfile 里 @playwright/test 的确切版本缓存，系统库每次照装（apt 命令不变；apt 下载的 .deb 留在缓存目录里跨运行复用）。
  cjk-fonts=true 时再装 fonts-noto-cjk（视觉基线用），缓存的是 apt 候选版本的 .deb 本身，渲染与直接 apt-get install 相同。
  前提：已 checkout、已 npm ci（npx playwright 用的是仓库自己锁定的版本）。
inputs:
  cjk-fonts:
    description: "'true' 时安装 Noto CJK 字体（视觉回归需要）"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Playwright version (package-lock)
      id: pw
      # 缓存 key：runner 系统 + 镜像（$ImageOS，如 ubuntu24；换 Ubuntu 大版本不复用旧镜像下的缓存）+ lockfile 里 @playwright/test 的确切版本
      #（它锁定同版本的 playwright-core，浏览器版本由它决定；升级 Playwright 就换 key）
      shell: bash
      run: |
        v="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
        if [ -z "$v" ] || [ "$v" = undefined ]; then echo "::error::@playwright/test not found in package-lock.json"; exit 1; fi
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
        # apt 安装包缓存按 ISO 周换 key：每周第一轮重存一次，跟上 Ubuntu 的包更新（周内有包更新只是那几个包照常现下，不会装错）
        echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}

    - name: Cache apt .debs (Playwright system deps)
      # 2026-11-06 CI 提速：install-deps 每次从 azure.archive.ubuntu.com 现下 16-18 MB 字体包，实测 17-47 kB/s、6-15 分钟。
      # 这里只缓存 apt 下载下来的 .deb；装什么、装哪个版本仍由下面原样的 install 命令和 apt 当场决定。
      # 缓存里的 .deb 对不上签名索引里的 sha256（旧版本、坏文件、别处塞进来的）apt 一律不用、照常下载：缓存只省下载，不改装的东西。
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pw-apt-debs
        key: pw-apt-debs-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-${{ steps.pw.outputs.week }}
        restore-keys: |
          pw-apt-debs-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-

    - name: Point apt's download dir at the cached dir
      # 只改 apt 存放下载包的目录（Dir::Cache::Archives）并保留下载的包；下面两条 install 命令一个字不改。
      # 目录不归 apt 的下载用户 _apt，apt 会提示「Download is performed unsandboxed as root」后照常下载，属正常。
      # 装完下一步就删掉这份配置，后面的步骤看到的 apt 和以前一样。
      shell: bash
      run: |
        d="$HOME/.cache/pw-apt-debs"
        mkdir -p "$d/partial"
        printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' "$d" | sudo tee /etc/apt/apt.conf.d/99sgx-deb-cache
        echo "restored .debs: $(find "$d" -maxdepth 1 -name '*.deb' | wc -l)"

    - name: Prefetch Playwright system deps (.deb, best effort)
      # 只提速：缓存没有的包先用 curl 并行下到上面那个目录，慢镜像（< 200 kB/s 持续 15 秒）就换 archive.ubuntu.com 再试。
      # 包清单 = install-deps 自己的 --dry-run（同一份 Playwright 包表，apt-get install -s 算出缺哪些）；URL / 哈希 = apt 的 --print-uris。
      # 下面的 install 命令照常运行，apt 按签名索引核对目录里每个 .deb，对不上就自己重新下载：预取成败都不改装的东西。
      # 这一步任何失败都不拦（脚本恒退出 0；拿不到清单就跳过）。
      shell: bash
      run: |
        d="$HOME/.cache/pw-apt-debs"
        sudo apt-get update -qq || { echo "::warning::apt-get update failed, skip prefetch"; exit 0; }
        missing="$(npx playwright install-deps --dry-run chromium 2>/dev/null | awk '/^  [a-z0-9]/{print $1}' || true)"
        if [ -z "$missing" ]; then echo "prefetch: nothing missing"; exit 0; fi
        # shellcheck disable=SC2086
        sudo apt-get install --print-uris -y --no-install-recommends $missing 2>/dev/null \
          | bash "${{ github.action_path }}/prefetch-debs.sh" "$d" || true

    - name: Install Playwright browser (cache miss)
      if: steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install chromium --with-deps

    - name: Install Playwright system deps (cache hit)
      # 浏览器本体来自缓存，系统库每次照装
      if: steps.pw-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium

    - name: Put apt's download dir back
      # 删掉上面那份 apt 配置；把缓存目录交还 runner 用户（apt 以 root 下载），job 结束时 actions/cache 才存得进去
      shell: bash
      run: |
        sudo rm -f /etc/apt/apt.conf.d/99sgx-deb-cache
        d="$HOME/.cache/pw-apt-debs"
        sudo rm -rf "$d/partial" "$d/lock"
        sudo chown -R "$(id -u):$(id -g)" "$d"
        echo "cached .debs: $(find "$d" -maxdepth 1 -name '*.deb' | wc -l)"

    - name: CJK font package version
      id: cjk
      if: inputs.cjk-fonts == 'true'
      # 版本取 apt 的候选版本（上一步 Playwright 装系统库时已 apt-get update，和「apt-get update && apt-get install fonts-noto-cjk」
      # 装的是同一个版本）；版本一变 key 就变，重新下载
      shell: bash
      run: |
        v="$(apt-cache policy fonts-noto-cjk | awk '/Candidate:/{print $2}')"
        if [ -z "$v" ] || [ "$v" = "(none)" ]; then echo "::error::fonts-noto-cjk has no apt candidate"; exit 1; fi
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Cache CJK font package (.deb)
      id: cjk-cache
      if: inputs.cjk-fonts == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/fonts-noto-cjk-deb
        key: fonts-noto-cjk-${{ runner.os }}-${{ steps.cjk.outputs.version }}

    - name: Download CJK font package (cache miss)
      if: inputs.cjk-fonts == 'true' && steps.cjk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CJK_VERSION: ${{ steps.cjk.outputs.version }}
      run: |
        # 先用预取脚本（慢镜像快速换源，见 prefetch-debs.sh）；没拿到再退回 apt-get download。装之前「Install CJK fonts」核对 SHA256
        mkdir -p ~/.cache/fonts-noto-cjk-deb
        apt-get download --print-uris "fonts-noto-cjk=$CJK_VERSION" | bash "${{ github.action_path }}/prefetch-debs.sh" ~/.cache/fonts-noto-cjk-deb || true
        if ! compgen -G "$HOME/.cache/fonts-noto-cjk-deb/fonts-noto-cjk_*.deb" > /dev/null; then
          cd ~/.cache/fonts-noto-cjk-deb
          apt-get download "fonts-noto-cjk=$CJK_VERSION"
        fi

    - name: Install CJK fonts (from the cached .deb)
      # 用 dpkg -i 装本地 .deb，不经 apt、不联网（2026-11-06 PR #279：apt-get install 本地 .deb 时，仓库里有同版本，
      # apt 照样去 azure.archive.ubuntu.com 下 61.2 MB，最慢一次 26 分 46 秒；锁诊断无进程占锁，不是等锁）。
      # 该包没有 Depends / Recommends（packages.ubuntu.com/noble/fonts-noto-cjk），dpkg -i 装上的和 apt 装的是同一个包。
      # 不经 apt 就没有 apt 的签名核对，所以先自己核：.deb 的 sha256 必须等于本机 apt 索引（Install system deps 那步 apt-get update 过）
      # 里这个版本的 SHA256，不等就红。装完核对版本；fontconfig 触发器照常重建字体缓存。
      # fc-list 先落到变量再 grep：composite 的 bash 带 pipefail，管道里 grep -q 提前退出会让 fc-list 吃 SIGPIPE
      if: inputs.cjk-fonts == 'true'
      shell: bash
      env:
        CJK_VERSION: ${{ steps.cjk.outputs.version }}
      run: |
        debs=(~/.cache/fonts-noto-cjk-deb/fonts-noto-cjk_*.deb)
        [ "${#debs[@]}" = 1 ] && [ -f "${debs[0]}" ] || { echo "::error::expected exactly one cached fonts-noto-cjk .deb, got: ${debs[*]}"; exit 1; }
        want="$(apt-cache show "fonts-noto-cjk=$CJK_VERSION" | awk '/^SHA256:/{print $2; exit}')"
        got="$(sha256sum "${debs[0]}" | cut -d' ' -f1)"
        [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::fonts-noto-cjk .deb sha256 $got does not match apt index ($want)"; exit 1; }
        sudo dpkg -i "${debs[0]}"
        test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = "$CJK_VERSION"
        fonts="$(fc-list)"
        grep -q "Noto Sans CJK" <<< "$fonts" || { echo "::error::Noto Sans CJK not visible to fontconfig"; exit 1; }

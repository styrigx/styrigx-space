# 临时检查 workflow（space #39 合并前删除）
# push 到 feat/2.8.0-cleanup 时触发（workflow_dispatch 在功能分支上点不了）
# 用途：在 Visual regression 红的时候，单独验证 PC layout、Lighthouse、技术名词三项
name: Adhoc checks (PC layout / Lighthouse / tech terms)

on:
  push:
    branches: [feat/2.8.0-cleanup]

env:
  HUGO_VERSION: 0.148.2

jobs:
  adhoc:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install test deps
        run: npm install --no-save @playwright/test stylelint postcss-scss @lhci/cli http-server && npx playwright install chromium --with-deps

      - name: Install CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Build CSS
        run: node scripts/build-css.cjs --minify

      - name: Build site (测试构建，锁屏禁用)
        run: |
          sed -i "s/0x4AAAAAAFSBhpWkAwZr1SMA/1x00000000000000000000AA/g" hugo.yaml
          hugo --minify
        env:
          SGX_TEST_NO_LOCK: "1"
          SGX_TEST_NO_WEATHER: "1"

      - name: PC layout assertions
        id: pc-layout
        continue-on-error: true
        run: npx playwright test --config=playwright.config.js pc-layout.spec.js

      - name: Lighthouse CI
        id: lighthouse
        continue-on-error: true
        run: |
          find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec gzip -k -9 {} \;
          npx lhci autorun --config=.lighthouserc.json

      - name: 前端技术名词检查
        id: tech-terms
        continue-on-error: true
        run: |
          if grep -rl "OWNER_KEY\|SESSION_SECRET\|TURNSTILE_SECRET" public/ --include="*.html"; then
            echo "FAIL: 技术变量名出现在 HTML 产物中"
            exit 1
          fi
          echo "OK: HTML 产物无技术变量名"

      - name: 汇总结果
        if: always()
        run: |
          echo "=== Adhoc checks 结果 ==="
          echo "PC layout: ${{ steps.pc-layout.outcome }}"
          echo "Lighthouse: ${{ steps.lighthouse.outcome }}"
          echo "Tech terms: ${{ steps.tech-terms.outcome }}"

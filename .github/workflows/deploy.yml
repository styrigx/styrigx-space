name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支推新提交时取消旧的 PR CI；main 的生产部署永不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: '0.167.0'

jobs:
  # 2.4.0 E：质量闸门 —— 视觉回归 + Lighthouse CI + stylelint，不达标不部署
  # Hark：PR 也跑 quality，变绿再合入 main；只有 main 的 push 才部署
  quality:
    # 2026-10-11：固定 ubuntu-24.04，ubuntu-latest 10-19 起切 Ubuntu 26，字体渲染可能变化
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install test deps
        run: npm install --no-save @playwright/test stylelint postcss-scss @lhci/cli http-server && npx playwright install chromium --with-deps

      - name: Install CJK fonts
        # 2.8.0：视觉回归对比中文截图；ubuntu-latest 默认中文字体与基线生成环境
        # （Noto Sans CJK）不一致会导致 1-2% 像素漂移。装 Noto Sans CJK 对齐。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Build CSS
        run: node scripts/build-css.cjs --minify

      - name: Session security unit tests (2.4.1)
        # 服务端安全逻辑：cookie 设置/清除统一、KV fail closed、session-epoch 503、
        # middleware 缺密钥 fail closed、过期/旧 epoch cookie 被拒、return 白名单
        run: node --test tests/kernel/session-security.test.mjs

      - name: Layer boundary check (SGX 3.0 分层规范)
        # L0-L6 依赖方向：lib 不得 import shell/apps；shell 不得 import apps；
        # 前端不得 import functions/；api/ 只能 import _kernel/；
        # 前端禁止 sgx-verified/sgx-lock-shown；禁止用 storage 存解锁状态
        run: node scripts/check-layers.mjs

      - name: Generate blog posts data (P0-2)
        # 从博客仓库读公开文章列表，生成 data/posts.json
        # BLOG_TOKEN: 只读 token（公开仓库可匿名，但配 token 更稳）
        # 失败、0 篇 → 脚本 exit 非 0 → 构建失败
        run: node scripts/gen-posts-json.mjs
        env:
          BLOG_TOKEN: ${{ secrets.BLOG_READ_TOKEN }}

      - name: Build site (生产构建，用于锁屏测试)
        run: hugo --minify

      - name: Assert posts in files-index.json (P0-2)
        # 断言：type=post > 0，中英各有，URL 合法；失败则 CI 失败
        run: node scripts/assert-posts.mjs

      - name: stylelint（禁止硬编码颜色）
        run: npx stylelint "assets/css/input.css"

      - name: Lock screen tests (Hark：生产构建，锁屏启用)
        # 锁屏行为测试（阻塞部署）；截图基线单独跑、仅报告
        run: |
          hugo --minify
          SGX_TEST_SUITE=lock npx playwright test --config=playwright.config.js --grep-invert "baseline screenshot"

      - name: Lock screen baseline screenshot
        # 2.8.0：基线已重新生成，改成阻塞（失败即 CI 红）
        run: |
          SGX_TEST_SUITE=lock npx playwright test --config=playwright.config.js --grep "baseline screenshot"

      - name: Lock flags test (owner-gate on, default build)
        # 2.8.0：legacy-lock-screen 已删除，只剩 owner-gate 开关；默认构建下锁屏正常出现
        run: |
          hugo --minify
          SGX_TEST_SUITE=lock npx playwright test --config=playwright.config.js lock-flags.spec.js

      - name: Lock flags test (owner-gate off)
        # owner-gate 关：锁屏完全不出现
        run: |
          SGX_TEST_OWNER_GATE=0 hugo --minify
          SGX_TEST_SUITE=lock SGX_TEST_FLAGS=gate-off npx playwright test --config=playwright.config.js lock-flags.spec.js

      - name: Upload lock test artifacts on failure
        # Hark：失败时上传，便于拿真实报错
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lock-test-results
          path: |
            test-results/
            playwright-report/

      - name: Rebuild for visual/Lighthouse (Hark：测试构建，锁屏禁用)
        # 视觉回归和 Lighthouse 用锁屏禁用的构建，避免锁屏干扰；
        # Turnstile 用 Cloudflare 官方测试 Key（sed 替换，不污染正式密钥）
        run: |
          sed -i "s/0x4AAAAAAFSBhpWkAwZr1SMA/1x00000000000000000000AA/g" hugo.yaml
          # P0-2：视觉测试用 Fixture 数据，保证和基线一致；正式构建用真实 posts.json
          cp data/posts.fixture.json data/posts.json
          hugo --minify
        env:
          SGX_TEST_NO_LOCK: "1"
          # Hark：测试构建禁用天气组件（天气依赖外网，CI 不稳定会导致
          # Lighthouse errors-in-console 误报）；生产构建绝不设置
          SGX_TEST_NO_WEATHER: "1"

      - name: Visual regression
        # 2.8.0：基线已重新生成（140 张页面截图），改成阻塞（失败即 CI 红）。
        # 注意：不要再被别的提交加回 continue-on-error（a8f4dffa 曾误删本行）。
        run: npx playwright test --config=playwright.config.js

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: PC layout assertions（2.5.0 栅格/Dock/顶栏对齐，阻塞）
        run: npx playwright test --config=playwright.config.js pc-layout.spec.js

      - name: Lighthouse CI
        # Hark：lhci 自己起服务（见 .lighthouserc.json 的 startServerCommand）。
        # gzip 模拟线上 Cloudflare 压缩。天气组件已在测试构建里禁用
        # （SGX_TEST_NO_WEATHER=1），无外网请求，errors-in-console 不会误报。
        run: |
          find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec gzip -k -9 {} \;
          npx lhci autorun --config=.lighthouserc.json

      - name: 前端技术名词检查（安全与隐私）
        # 用户可见文案不得出现 OWNER_KEY / SESSION_SECRET / TURNSTILE_SECRET；
        # 后端变量名只许出现在 functions/ 与注释里，不许进 public/ HTML。
        run: |
          if grep -rl "OWNER_KEY\|SESSION_SECRET\|TURNSTILE_SECRET" public/ --include="*.html"; then
            echo "FAIL: 技术变量名出现在 HTML 产物中"
            exit 1
          fi
          echo "OK: HTML 产物无技术变量名"

  passkey-e2e:
    # Hark P0：WebAuthn 虚拟认证器 E2E（注册→列表→解锁→删除→伪造 cookie）。
    # 在预览部署上跑真实 Workers；只能用测试 secret，绝不用生产 secret。
    # 需要 GitHub Secrets：PREVIEW_OWNER_KEY、PREVIEW_SESSION_SECRET（测试值）。
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npm install --no-save @playwright/test && npx playwright install chromium --with-deps

      - name: Build CSS
        run: node scripts/build-css.cjs --minify

      - name: Build site
        run: hugo --minify

      - name: Generate Ed25519 test key pair (CI only)
        # 2.4.1：middleware 缺 SGX_ED25519_PUBLIC 时 fail closed，解锁接口需要
        # SGX_ED25519_PRIVATE 才能签发会话 cookie。CI 在每次运行中临时生成一对
        # 测试密钥注入 preview 环境；绝不用生产密钥，密钥不进仓库、不留文件。
        run: |
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/ed25519-priv.pem"
          openssl pkey -in "$RUNNER_TEMP/ed25519-priv.pem" -pubout -out "$RUNNER_TEMP/ed25519-pub.pem"
          test -s "$RUNNER_TEMP/ed25519-priv.pem" && test -s "$RUNNER_TEMP/ed25519-pub.pem"
          echo "Ed25519 test key pair generated (preview only)"

      - name: Set preview test secrets (preview only)
        # 只写 preview 环境，绝不碰 production。
        # 用 PATCH deployment_configs.preview，只带 preview 字段。
        # 必须在部署之前写，否则新值要到下一次部署才生效。
        run: |
          python3 - <<'PYEOF'
          import json, sys, urllib.request, urllib.error
          ACCT = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TOKEN = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          with open("${{ runner.temp }}/ed25519-priv.pem") as f:
              ED_PRIV = f.read()
          with open("${{ runner.temp }}/ed25519-pub.pem") as f:
              ED_PUB = f.read()
          assert "PRIVATE KEY" in ED_PRIV and "PUBLIC KEY" in ED_PUB
          body = json.dumps({
              "deployment_configs": {
                  "preview": {
                      "env_vars": {
                          "OWNER_KEY": {"type": "secret_text", "value": "${{ secrets.PREVIEW_OWNER_KEY }}"},
                          "SESSION_SECRET": {"type": "secret_text", "value": "${{ secrets.PREVIEW_SESSION_SECRET }}"},
                          # 2.4.1：CI 临时生成的测试密钥对（每次运行新生成，非生产密钥）
                          "SGX_ED25519_PRIVATE": {"type": "secret_text", "value": ED_PRIV},
                          "SGX_ED25519_PUBLIC": {"type": "plain_text", "value": ED_PUB},
                          "SGX_SITE": {"type": "plain_text", "value": "space"},
                          # P0-3：预览的 RP_ID/ORIGIN（明文，CI 每次部署前写入）
                          "SGX_RP_ID": {"type": "plain_text", "value": "passkey-e2e.styrigx-space.pages.dev"},
                          "SGX_ORIGIN": {"type": "plain_text", "value": "https://passkey-e2e.styrigx-space.pages.dev"},
                      }
                  }
              }
          }).encode()
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{ACCT}/pages/projects/styrigx-space",
              data=body, method="PATCH",
              headers={"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"})
          try:
              r = json.load(urllib.request.urlopen(req, timeout=30))
          except urllib.error.HTTPError as e:
              print(f"FAIL: HTTP {e.code}", file=sys.stderr); sys.exit(1)
          if not r.get("success"):
              print("FAIL: success=false", file=sys.stderr); sys.exit(1)
          print("preview secrets updated")
          PYEOF

      - name: Deploy to preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=styrigx-space --branch=passkey-e2e --commit-dirty=true

      - name: Run WebAuthn E2E
        run: |
          SGX_TEST_BASE="https://passkey-e2e.styrigx-space.pages.dev" \
          SGX_TEST_OWNER_KEY="${{ secrets.PREVIEW_OWNER_KEY }}" \
          npx playwright test --config=playwright.config.js --grep "passkey e2e"
        env:
          SGX_TEST_SUITE: passkey

      - name: Guard - production vars unchanged
        # 守卫：确认 production 环境变量未被 CI 改动
        run: |
          python3 - <<'PYEOF'
          import json, sys, urllib.request
          ACCT = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TOKEN = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{ACCT}/pages/projects/styrigx-space",
              headers={"Authorization": f"Bearer {TOKEN}"})
          r = json.load(urllib.request.urlopen(req, timeout=30))
          prod = r["result"]["deployment_configs"]["production"]["env_vars"]
          names = sorted(prod.keys())
          print("production vars:", names)
          # production 必须有这些，且 CI 不应增删（2026-10-10：Gray 已配 SGX_SITE/密钥对，基线更新）
          expected = ["OWNER_KEY", "SESSION_SECRET", "SGX_ED25519_PRIVATE", "SGX_ED25519_PUBLIC", "SGX_ORIGIN", "SGX_RP_ID", "SGX_SITE", "TURNSTILE_SECRET"]
          assert names == expected, f"unexpected: {names}"
          print("guard OK: production untouched")
          PYEOF

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: passkey-test-results
          path: |
            test-results/
            playwright-report/

  build-and-deploy:
    # 部署条件：(push 或 workflow_dispatch) 且 ref 是 main；其他分支手动触发不部署。
    # 手动触发同样 needs: quality（先过 quality 和 guard，不跳过）。
    # 不加任何传密钥值的 input，密钥只在 Cloudflare 后台改。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build CSS
        run: node scripts/build-css.cjs --minify

      - name: Fetch music previews
        run: node scripts/music-previews.mjs
        continue-on-error: true

      - name: Generate blog posts data (P0-2)
        run: node scripts/gen-posts-json.mjs
        env:
          BLOG_TOKEN: ${{ secrets.BLOG_READ_TOKEN }}

      - name: Build site
        run: hugo --minify

      - name: Assert posts in files-index.json (P0-2)
        run: node scripts/assert-posts.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=styrigx-space --commit-dirty=true

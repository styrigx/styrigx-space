name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支推新提交时取消旧的 PR CI；main 的生产部署永不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN 默认只读；本工作流不推代码、不发评论、不建 release
permissions:
  contents: read

env:
  # Hugo 版本与 extended 只在 .github/actions/setup-hugo/action.yml 定义（子站按固定 tag 引用同一个 action）
  NODE_VERSION: '22'
  # 所有 wrangler（npx 和 wrangler-action）用同一个固定版本；升级时只改这里
  WRANGLER_VERSION: '4.152.0'

# 自动回滚（main 部署）：Pages 和 7 个 Worker 的 job 部署前记下线上版本（step id live），部署 / 冒烟 / 部署后核对失败
# 就退回那个版本（scripts/deploy-rollback.mjs；Worker 用 wrangler rollback，Pages 用回滚 API），job 照样红。
# 只用各 job 部署本来就用的那把 token，不加 secret、不加权限。第一次部署（没有旧版本）/ 记录失败 → 不回滚，同以前。
# 不回滚：D1 迁移（只进不退，迁移要写成兼容旧代码）、KV 数据（搜索索引）、Secrets Store、路由 / 自定义域名、已部署的其他 job。
# 回滚下限：scripts/deploy-rollback-floor.json。线上版本低于下限（网关 / 账号 Worker 是 #226 之前的 KV 版本）就不记、不自动回滚，
# 免得退回读旧 KV 的代码；以后存储改成旧代码读不懂的格式时在那里加一行。
# 健康闸门第二阶段（2026-10-28，scripts/health-gate.mjs）：search / chat 没有公开地址，第一阶段只能核对版本换上了。
# status 部署并核对后，等 styrigx-status 在部署之后跑的巡检（D1 styrigx-status 的 checks 表，经服务绑定测两者的 /healthz），
# 连续 2 次失败（部署前就在失败的不算）→ status job 红：status 自己按原样回滚，rollback-search-worker / rollback-chat-worker
# 用各自环境原有的 token 把出问题的那个退回部署前版本；网关 / Pages / 账号 / 分享都等 status，不会部署。
# 读 D1 用 status 部署本来就有的 token（D1 编辑），不经网关、不开免会话口子、不加 Worker / 子域名 / secret。

jobs:
  # 质量闸门：单元测试、打包检查、生成物同步、分层 / 前端守卫、锁屏 / 边缘 / 凭证接口 / 视觉 e2e、Lighthouse、stylelint。
  # PR 也跑，变绿再合入 main；只有 main 的 push（或 main 上手动触发）才部署。
  quality:
    # 固定 ubuntu-24.04：ubuntu-latest 换大版本时字体渲染会变，视觉基线跟着漂
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Assert no legacy secret / variable names
        # 旧名字（SGX_ED25519_* → SGX_LOCK_*，SGX_STEPUP_KEY 已删，OWNER_KEY → SGX_ROOT_KEY）不许回到代码里。
        # 不扫 tests/：改名守卫测试里会故意写旧名字。
        run: |
          if grep -rnE "SGX_ED25519_|SGX_STEPUP_KEY|OWNER_KEY" --include="*.js" --include="*.mjs" --include="*.cjs" --include="*.html" workers/ scripts/ web/assets/ web/layouts/; then
            echo "::error::legacy secret / variable name found (see above)"
            exit 1
          fi
          echo "OK: no legacy names."

      - name: Setup Hugo (shared action; version + extended defined only in .github/actions/setup-hugo)
        uses: ./.github/actions/setup-hugo

      - name: Setup Node + install dependencies (lockfile)
        # Node 22：D1 的真 SQL 测试要 node:sqlite（Node 20 上会整段跳过）。
        # 测试工具（Playwright、stylelint、Lighthouse CI、http-server）都在 devDependencies 里，按 lockfile npm ci
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Playwright Chromium + CJK fonts (shared action, cached)
        # 视觉回归对比中文截图；默认中文字体与基线生成环境（Noto Sans CJK）不一致会有 1-2% 像素漂移。
        # 浏览器按 lockfile 的 @playwright/test 版本缓存；字体缓存 apt 候选版本的 .deb，渲染与直接 apt 安装逐字节一致
        uses: ./.github/actions/setup-playwright
        with:
          cjk-fonts: 'true'

      - name: Build CSS
        run: node scripts/build-css.cjs --minify

      - name: Unit tests (workers + ui)
        # tests/workers/** 与 tests/web/ui 的全部单元测试；新加的测试文件自动纳入，不用再改这里。
        # 先确认 node:sqlite 可用：没有它 D1 的真 SQL 测试会静默跳过
        run: |
          node -e "require('node:sqlite')" || { echo "::error::node:sqlite unavailable, D1 SQL tests would be skipped"; exit 1; }
          node --test tests/workers/auth-gateway/*.test.mjs tests/workers/account/*.test.mjs tests/workers/share/*.test.mjs tests/workers/chat/*.test.mjs tests/workers/search-index/*.test.mjs tests/workers/status/*.test.mjs tests/workers/proxy-rules/*.test.mjs tests/web/ui/*.test.mjs

      - name: Auth Worker bundle check (styrigx-auth-gateway, dry-run)
        # 主站后端代码全在 workers/auth-gateway（src/ + functions/）；只打包不部署，import 断了 CI 就红
        working-directory: workers/auth-gateway
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-auth-gateway-dist

      - name: Account Worker bundle check (styrigx-account, dry-run)
        working-directory: workers/account
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-account-dist

      - name: Share Worker bundle check (styrigx-share, dry-run)
        working-directory: workers/share
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-share-dist

      - name: Chat Worker bundle check (styrigx-chat, dry-run)
        working-directory: workers/chat
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-chat-dist

      - name: Search Worker bundle check (styrigx-search-index, dry-run)
        working-directory: workers/search-index
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-search-dist

      - name: Status Worker bundle check (styrigx-status, dry-run)
        working-directory: workers/status
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-status-dist

      - name: Proxy rules Worker bundle check (styrigx-proxy-rules, dry-run)
        working-directory: workers/proxy-rules
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-proxy-rules-dist

      - name: Shared shell in sync (web/shared/shell ← palette-roles / input.css @shell / shell-nav)
        # 子站（blog / daymark）用 scripts/sync-shell.mjs 从这里同步外壳；改了源头忘了重新生成 → 红
        run: node scripts/gen-shell.mjs --check

      - name: Palettes in sync (input.css @gen-palettes ← palette 定义)
        run: node scripts/gen-palettes.mjs --check

      - name: UI cookie contract in sync (tests/fixtures/ui-cookie-contract.json)
        run: node scripts/gen-ui-cookie-contract.mjs --check

      - name: Layer boundary check (SGX 3.0 分层规范)
        # 依赖方向（docs/architecture.md）：前端 lib ← auth ← shell ← apps ← entries；lib 不含鉴权接口；
        # 网关 _kernel / api / _middleware 只 import _kernel，src 只 import src 和 _kernel（routes.js、index.js 例外）；
        # 相对 import 解析不到文件也算失败；前端禁止 sgx-lock-session（cookie 名）/sgx-lock-shown；禁止用 storage 存解锁状态
        run: node scripts/check-layers.mjs

      - name: Frontend guard (无原生弹窗 / 无废弃 token 变量)
        # assets/js/ 和 shared/shell/ 禁止 prompt/confirm/alert（裸调用、window./globalThis./self./top.、window['alert']），禁止独立 token 变量（已废弃的内存鉴权 token 机制）
        run: node scripts/check-frontend.mjs

      - name: Build site (生产构建，锁屏启用)
        # 这一份就是要上线的 Pages 产物（main 上传 artifact 给 build-and-deploy / deploy-search-worker 复用，不再各自重建），
        # 所以和以前 Pages job 一样带构建 SHA
        run: hugo --minify -s web
        env:
          SGX_BUILD_SHA: ${{ github.sha }}

      - name: CSP hashes in sync (内联脚本 sha256 ← 生产构建；web/static/_headers 安全头 ← security-headers.js)
        # 改了模板里的内联脚本就要重新生成：hugo --minify -s web && node scripts/gen-csp.mjs
        run: node scripts/gen-csp.mjs --check

      - name: 前端技术名词检查（生产构建的 HTML 里不许出现后端变量名）
        # 用户可见文案不得出现 OWNER_KEY / SESSION_SECRET / SGX_ROOT_KEY / SGX_PW_PEPPER / TURNSTILE_SECRET；
        # 后端变量名只许出现在 workers/ 与注释里，不许进 web/public/ HTML。
        run: |
          if grep -rl "OWNER_KEY\|SESSION_SECRET\|SGX_ROOT_KEY\|SGX_PW_PEPPER\|TURNSTILE_SECRET" web/public/ --include="*.html"; then
            echo "FAIL: 技术变量名出现在 HTML 产物中"
            exit 1
          fi
          echo "OK: HTML 产物无技术变量名"

      - name: Check production build artifacts (Pages 需要的产物都在)
        # 下面上传的就是这份；_worker.js（pages.dev → styrigx.com 跳转，不能带网关代码）、_headers（含 CSP）、_redirects
        run: |
          for f in _worker.js _headers _redirects index.html; do test -s "web/public/$f" || { echo "::error::web/public/$f missing"; exit 1; }; done
          grep -q "styrigx.com" web/public/_worker.js
          if grep -q "X-SGX-Runtime" web/public/_worker.js; then echo "::error::gateway bundle in production Pages build"; exit 1; fi
          grep -q "Content-Security-Policy" web/public/_headers

      - name: Build search index (site:space, from the production build)
        # PR 上也跑（不需密钥、几秒）：#217 只在 main 跑这步，输出目录不存在的问题合并后才暴露
        run: |
          node scripts/build-search-index.mjs --out "$RUNNER_TEMP/search-index/search-space.json"
          test -s "$RUNNER_TEMP/search-index/search-space.json"

      - name: Upload production site (for build-and-deploy)
        # 只在会部署的 main 运行上传；后面的锁测 / 预览 / 视觉步骤会重建 web/public，所以紧跟生产构建和检查之后上传
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-production
          path: web/public/
          if-no-files-found: error
          retention-days: 1

      - name: Upload search index (for deploy-search-worker)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: search-index-space
          path: ${{ runner.temp }}/search-index/search-space.json
          if-no-files-found: error
          retention-days: 1

      - name: Check worker routes (每个页面都过网关；头像 / 云同步 / 数字健康归账号 Worker，不抢网关的接口)
        run: node scripts/check-worker-routes.mjs

      - name: stylelint（禁止硬编码颜色）
        run: npx stylelint --config tests/config/stylelintrc.json "web/assets/css/input.css"

      - name: Lock screen tests (生产构建，锁屏启用；含 lock-flags 的 lock-gate 开)
        # 截图基线在下一步单独跑
        run: SGX_TEST_SUITE=lock npx playwright test --config=tests/config/playwright.config.js --grep-invert "baseline screenshot"

      - name: Edge flow e2e（真实网关 + 线上路由规则 + 真实域名 + 虚拟认证器）
        # 生产构建；本地 HTTPS 代理把 styrigx.com / blog / daymark 接到真实网关代码，路由按 wrangler.toml + 线上匹配规则
        run: SGX_TEST_SUITE=edge npx playwright test --config=tests/config/playwright.config.js

      - name: Lock screen baseline screenshot
        run: SGX_TEST_SUITE=lock npx playwright test --config=tests/config/playwright.config.js --grep "baseline screenshot"

      - name: Credential API e2e（真实 handler + 内存 D1，自带测试服务器）
        # 锁屏密码 / 锁屏通行密钥 / 账号密码 / 账号通行密钥的真请求；不需要 Hugo 构建
        run: SGX_TEST_SUITE=credential npx playwright test --config=tests/config/playwright.config.js

      - name: Lock flags test (lock-gate off)
        # lock-gate 关：锁屏完全不出现（要单独构建）
        run: |
          SGX_TEST_LOCK_GATE=0 hugo --minify -s web
          SGX_TEST_SUITE=lock SGX_TEST_FLAGS=gate-off npx playwright test --config=tests/config/playwright.config.js lock-flags.spec.js

      - name: Upload lock test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lock-test-results
          path: |
            test-results/
            playwright-report/

      - name: Rebuild for visual / Lighthouse (测试构建，锁屏禁用)
        # 视觉回归和 Lighthouse 用锁屏禁用的构建，避免锁屏干扰
        run: hugo --minify -s web
        env:
          SGX_TEST_NO_LOCK: "1"
          # 测试构建禁用天气组件（依赖外网，CI 不稳定会让 Lighthouse errors-in-console 误报）；生产构建绝不设置
          SGX_TEST_NO_WEATHER: "1"

      - name: Visual regression + layout assertions (默认组，阻塞)
        # 默认 testMatch 已含 visual / pc-layout / layout-292 等全部默认 spec，失败即 CI 红。
        # 不要再给这一步加 continue-on-error。
        run: npx playwright test --config=tests/config/playwright.config.js

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Lighthouse CI
        # lhci 自己起服务（见 tests/config/lighthouserc.json 的 startServerCommand）；gzip 模拟线上 Cloudflare 压缩
        run: |
          find web/public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec gzip -k -9 {} \;
          npx lhci autorun --config=tests/config/lighthouserc.json

  passkey-e2e:
    # WebAuthn 虚拟认证器 + 真实网关代码的 E2E（tests/web/e2e/passkey.spec.js、account-challenge.spec.js）。生产部署的所有 job 都等它通过。
    # 按事件分两条路（job 名不变：passkey-e2e 是分支保护的必需检查，结论就是这个 job 的结论）：
    # - pull_request：本地模拟器 tests/web/e2e/preview-emulator.cjs——同一份 workers/auth-gateway/src/index.js（SGX_ENV=preview），
    #   D1 是 node:sqlite 内存库（网关 2026-10-27 起不绑 KV）、Cloudflare D1 / KV REST 也由它在本机模拟；env.ASSETS 读本步骤构建的 web/public。
    #   不用任何 Cloudflare secret、不部署预览、不清预览 D1 / 不跑 D1 迁移。
    # - push 到 main、workflow_dispatch：真实预览部署 passkey-e2e.styrigx-space.pages.dev + 预览 D1（下面带
    #   github.event_name != 'pull_request' 的步骤，和改动前一样）。模拟器测不到真实 D1、Pages 打包和真实绑定，
    #   所以 PR 的通过不顶替真实预览：main 的每次 push（只改文档 / 样式的除外）照跑真实预览，不再复用 PR 运行的结果。
    # 两条路都只用每次运行在 runner 上现生成的测试凭证（RootKey、pepper；真实预览另加 Ed25519 钥匙对），绝不用生产 secret，也不存 GitHub Secrets。
    # 真实预览只用仓库级的 CLOUDFLARE_ACCOUNT_ID 与 STYRIGX_SPACE_PAGES_DEPLOY（部署预览、写预览 D1）。
    # 外部 fork 的 PR 不跑（同仓库分支的 PR 照跑）。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # 真实预览共用一个预览别名、一个预览 D1：main / 手动运行全仓库同时只跑一个，排队不取消。
    # PR 走本地模拟器，不碰共享预览，不用排进这个队（按 PR 的 ref 分组；同一 PR 的新提交由 workflow 级 concurrency 取消旧运行）。
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('passkey-e2e-emulator-{0}', github.ref) || 'passkey-e2e-preview' }}
      cancel-in-progress: false
    # 配额：2026-10-27 起网关和这组用例都不再用 KV（免费计划 KV 写 / 删 / 列各 1000 次 / 天、全账号共用，以前一次运行要花 ~90 写 ~50 删）；
    # D1 按行计、额度大得多（tests/web/e2e/preview-emulator.cjs 的 /__kv/stats d1 一栏可量）。仍然：
    # - PR 运行全部走本地模拟器，不碰 Cloudflare；
    # - 本次改动全部是文档 / 内容文字 / CSS / 视觉基线 / 图片，就不跑用例（也不部署预览），job 以成功结束（steps.scope）。
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Change scope (docs / content text / CSS / baselines only → skip the E2E)
        id: scope
        # 路径过滤做在步骤层，不用 workflow 级 paths：这个 job 照样启动、以成功结束，分支保护的必需检查不会一直挂着。
        # 反着写（denylist）：只有本次改动的文件「全部」属于下面几类才跳过，其余任何改动都照跑——
        #   *.md（文档、README；web/content 另算，见下）、*.css（web/assets/css/ 样式源等）、
        #   tests/**/*-snapshots/*.png（视觉基线）、图片（png / jpg / jpeg / webp / gif / avif / svg / ico）、
        #   web/content/*.md 只改 title / linkTitle / description / summary / keywords（这里的页面只有 front matter，
        #   url / layout 决定路由，E2E 正好走这些页面，改了就照跑；新增页面也照跑）。
        # 照跑名单优先于上面的跳过规则：.github/**（workflow 本身）、package.json、package-lock.json、web/shared/**、
        #   web/assets/js/**（含 shell/）、任何 _kernel/**。删除、类型变化也一律照跑。
        # PR 比 base...head（合并基点起 PR 自己的改动）；push 直接比 before 和 after 两棵树（快进时等同 before...after，
        # 强推时把被覆盖掉的改动也算进来）；before 全零（新分支）、workflow_dispatch、拿不到 SHA、fetch / diff 出错、空 diff 都照跑。
        # 本步意外报错也不拦：continue-on-error，拿不到 docs_only=true 就照跑。
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          # 结论写 docs_only=true|false；任何拿不准（事件不对、SHA 缺失 / 全零、fetch / diff 出错、空 diff）都按 false 照跑
          verdict() { echo "docs_only=$1" >> "$GITHUB_OUTPUT"; echo "docs_only=$1: $2"; exit 0; }
          zero='^0+$'
          case "$EVENT" in
            pull_request) a="$PR_BASE"; b="$PR_HEAD" ;;
            push) a="$PUSH_BEFORE"; b="$PUSH_AFTER" ;;
            *) verdict false "event $EVENT: always run" ;;
          esac
          if [ -z "$a" ] || [ -z "$b" ] || [[ "$a" =~ $zero ]] || [[ "$b" =~ $zero ]]; then
            verdict false "no usable base ($a...$b, e.g. a new branch): run"
          fi
          # 只要提交和目录树（blob:none），不下文件内容；web/content 要比对 front matter 时 git 按需补那几个文件
          # checkout 是 depth 1 的浅克隆：先补全历史（否则 base 或 head 正好是浅边界时找不到合并基点）
          deepen=(); [ "$(git rev-parse --is-shallow-repository)" = true ] && deepen=(--unshallow)
          git fetch --no-tags --quiet --filter=blob:none "${deepen[@]}" origin "$a" "$b" || verdict false "fetch $a / $b failed: run"
          if [ "$EVENT" = pull_request ]; then
            # PR：base...head，只看 PR 自己的改动（从合并基点起）
            from="$(git merge-base "$a" "$b")" || verdict false "no merge base: run"
          else
            # push：before 和 after 两棵树直接比（快进时等于 before...after；强推时把被覆盖掉的改动也算进来）
            from="$a"
          fi
          changes="$(git diff --name-status --no-renames "$from" "$b")" || verdict false "git diff failed: run"
          [ -n "$changes" ] || verdict false "empty diff: run"
          # front matter 去掉只影响显示文字的键（title / linkTitle / description / summary / keywords），剩下的（url、layout、aliases、type…）有变就照跑
          fm() {
            git show "$1:$2" | awk '
              NR == 1 { if ($0 != "---") { print "NO-YAML-FRONT-MATTER"; exit } next }
              $0 == "---" { exit }
              /^(title|linkTitle|description|summary|keywords):/ { next }
              { print }'
          }
          n=0
          while IFS=$'\t' read -r st f; do
            n=$((n + 1))
            case "$f" in
              # 照跑名单优先于下面的跳过规则（workflow 自身、依赖、共享外壳、前端 JS、网关内核）
              .github/* | package.json | package-lock.json | web/shared/* | web/assets/js/* | */_kernel/* | workers/shared/*)
                verdict false "$f: always run" ;;
            esac
            [ "$st" = M ] || [ "$st" = A ] || verdict false "$st $f (deleted / type change): run"
            case "$f" in
              web/content/*.md)
                [ "$st" = M ] || verdict false "A $f (new page / route): run"
                if ! old="$(fm "$from" "$f")" || ! new="$(fm "$b" "$f")"; then verdict false "$f: cannot read front matter: run"; fi
                if [ "$old" != "$new" ] || [ "$new" = NO-YAML-FRONT-MATTER ]; then
                  verdict false "$f: front matter beyond title / description changed: run"
                fi ;;
              tests/*-snapshots/*.png) ;;
              *.md | *.css) ;;
              *.png | *.jpg | *.jpeg | *.webp | *.gif | *.avif | *.svg | *.ico) ;;
              *) verdict false "$f: run" ;;
            esac
          done <<< "$changes"
          verdict true "all $n changed file(s) are docs / content text / CSS / baselines / images: skip passkey E2E"

      - name: Decide whether to run the E2E
        id: gate
        # 跑 = 不是「只改文档 / 样式」。下面的步骤都只认这一个输出（再按事件分模拟器 / 真实预览）。
        # 不再有「同一棵树的 PR 运行已通过就跳过 main」：PR 现在测的是本地模拟器，不能顶替 main 上的真实预览。
        env:
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "skip: docs / content text / CSS / baselines only"
          elif [ "$EVENT" = pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "run passkey-e2e on the local emulator (pull_request)"
          else echo "run=true" >> "$GITHUB_OUTPUT"; echo "run passkey-e2e on the real preview ($EVENT)"; fi

      - name: Require Cloudflare secrets
        # 只检查仓库级的 Cloudflare 账号 id 和 Pages 部署 token；缺了直接红，不许 e2e 整组静默跳过还算通过。
        # 预览测试凭证不是 secret，下面「Generate preview test credentials」每次现生成。
        # PR 走本地模拟器，不用 Cloudflare secret，不检查。
        if: github.event_name != 'pull_request'
        env:
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_PAGES_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY != '' }}
        run: |
          ok=0
          for v in HAS_ACCOUNT HAS_PAGES_TOKEN; do
            if [ "${!v}" != "true" ]; then echo "::error::missing secret for $v"; ok=1; fi
          done
          exit $ok

      - name: Setup Node
        # 提前到这里：下面的清预览 D1 用 node 跑 scripts/kv-budget.mjs（ESM）。
        # 模拟器的 D1 要 node:sqlite（Node 22 起有）
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Generate preview test credentials (CI only)
        if: steps.gate.outputs.run == 'true'
        # 预览站的测试 RootKey（SGX_ROOT_KEY）和密码 pepper（SGX_PW_PEPPER）：每次运行新生成，只给这次的预览（PR：本地模拟器）用，
        # 和下面的 Ed25519 测试钥匙对一样不进仓库、不存 GitHub Secrets。网关对 RootKey 只要求去空白后非空
        # （workers/shared/crypto.js normalizeRootKey），这里用 32 字节随机数的 hex（64 个字符，无空白、无特殊字符）。
        # 先 ::add-mask:: 再写进 $GITHUB_ENV，后面各步骤的日志里都打码。
        run: |
          root_key="$(openssl rand -hex 32)"
          pepper="$(openssl rand -hex 32)"
          test "${#root_key}" -eq 64 && test "${#pepper}" -eq 64
          echo "::add-mask::$root_key"
          echo "::add-mask::$pepper"
          {
            echo "PREVIEW_TEST_ROOT_KEY=$root_key"
            echo "PREVIEW_TEST_PW_PEPPER=$pepper"
          } >> "$GITHUB_ENV"
          echo "preview test RootKey / pepper generated (preview only)"

      - name: Reset preview D1 (state that would change this run)
        # 每次运行换了 RootKey、pepper 和 Ed25519 钥匙对。2026-10-27 起网关的认证状态全部在 D1（不再绑定 KV），
        # 开跑前只清预览 D1（styrigx-auth-gateway-preview）里会改变本次起始状态的表（scripts/kv-budget.mjs RESET_D1_TABLES）：
        # 密码、通行密钥（「锁屏 / 账号都未设置」）和输错计数（attempt_limit：会 429）。
        # 纪元、user handle、审计、challenge、临时钥匙、设备、重置开关不清：旧会话 / 票都是旧钥匙签的、验签先失败，
        # 其余只是过期就不认的行，不改变任何断言的前提（逐条理由见 scripts/kv-budget.mjs）。
        # 库 id 只认 web/wrangler.toml [env.preview] 的 D1_LOCK_AUTH，且断言它不是正式网关的库。D1 REST 要这个 token 有 D1 编辑。
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
        run: node scripts/kv-budget.mjs reset-preview

      - name: Setup Hugo (shared action; version + extended defined only in .github/actions/setup-hugo)
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-hugo

      - name: Install dependencies (lockfile)
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Playwright Chromium (shared action, browser cache keyed by lockfile version)
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Build CSS
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-css.cjs --minify

      - name: Build site
        if: steps.gate.outputs.run == 'true'
        run: hugo --minify -s web

      - name: Start local preview emulator (pull_request only)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        # tests/web/e2e/preview-emulator.cjs：仓库里的网关代码（不打包，直接 import workers/auth-gateway/src/index.js）+
        # node:sqlite 的 D1 + 本机的 Cloudflare D1 / KV REST；env.ASSETS 读上面构建的 web/public。Ed25519 钥匙对由它自己现生成。
        # RootKey / pepper 用本次生成的 PREVIEW_TEST_ROOT_KEY / PREVIEW_TEST_PW_PEPPER（已打码）。固定端口 8788，和下一步的 SGX_TEST_BASE 一致。
        # 后台跑到 job 结束（runner 收尾时回收）；日志写 emulator-log/，失败时随测试结果一起上传。
        run: |
          node -e "require('node:sqlite')" || { echo "::error::node:sqlite unavailable, the emulator's D1 needs it"; exit 1; }
          mkdir -p emulator-log
          log=emulator-log/preview-emulator.log
          nohup node tests/web/e2e/preview-emulator.cjs --port 8788 --root-key "$PREVIEW_TEST_ROOT_KEY" --pepper "$PREVIEW_TEST_PW_PEPPER" > "$log" 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8788/__kv/stats; then echo "preview emulator ready on http://localhost:8788 (pid $pid)"; exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; echo "::error::preview emulator exited before it was ready"; exit 1; fi
            sleep 1
          done
          cat "$log"
          echo "::error::preview emulator not ready after 60s"
          exit 1

      - name: Run WebAuthn E2E on local emulator (SGX_TEST_SUITE=passkey, pull_request only)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        # 和真实预览同一组用例、同一个 playwright 配置；变量按 preview-emulator.cjs 文件头。
        # SGX_TEST_CF_API 把测试进程的 Cloudflare D1 REST 指到模拟器；CF token / account / D1 id 是占位值，不是 secret。
        env:
          SGX_TEST_SUITE: passkey
          SGX_TEST_BASE: http://localhost:8788
          SGX_TEST_ROOT_KEY: ${{ env.PREVIEW_TEST_ROOT_KEY }}
          SGX_TEST_CF_API: http://127.0.0.1:8788/client/v4
          SGX_TEST_CF_TOKEN: x
          SGX_TEST_CF_ACCOUNT: x
          SGX_TEST_PREVIEW_D1_ID: local
          CI: '1'
        run: |
          npx playwright test --config=tests/config/playwright.config.js
          echo "emulator KV / D1 operations this run (not billed):"
          curl -fsS http://127.0.0.1:8788/__kv/stats | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);for(const k of ['app','rest','d1'])console.log(k,JSON.stringify(Object.fromEntries(Object.entries(j[k]).filter(([n])=>n!=='byPrefix'))))})" || true

      - name: Bundle auth gateway as the preview _worker.js
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # Pages 上已经没有后端代码。预览把网关的同一份代码打包成 Pages 的 _worker.js（覆盖静态的那个），
        # 在 passkey-e2e.styrigx-space.pages.dev 上跑：页面和默认头像读 env.ASSETS，接口连预览的 D1。
        # 只打包不部署 Worker，不需要 Worker 权限。
        run: |
          (cd workers/auth-gateway && npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir "$RUNNER_TEMP/gateway-dist")
          cp "$RUNNER_TEMP/gateway-dist/worker.js" web/public/_worker.js
          grep -q "X-SGX-Runtime" web/public/_worker.js

      - name: Generate Ed25519 test key pairs (CI only)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 锁屏域和账号域各一对，每次运行新生成，只给预览用；绝不用生产密钥，密钥不进仓库
        run: |
          for d in lock account; do
            openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/$d-priv.pem"
            openssl pkey -in "$RUNNER_TEMP/$d-priv.pem" -pubout -out "$RUNNER_TEMP/$d-pub.pem"
            test -s "$RUNNER_TEMP/$d-priv.pem" && test -s "$RUNNER_TEMP/$d-pub.pem"
          done
          echo "Ed25519 test key pairs generated (preview only)"

      - name: Put this run's public keys into web/wrangler.toml (runner copy only)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # web/wrangler.toml 是 Pages 的配置源：部署时它的 [env.preview.vars] 覆盖后台的明文变量。
        # 仓库里那份 SGX_LOCK_PUBLIC 是固定值，和本次生成的私钥对不上，所以部署前在 runner 里换成本次的公钥，
        # 并补上账号域公钥。不提交，只影响这次部署。
        run: |
          python3 - <<'PYEOF'
          import json, os, re, tomllib
          tmp = os.environ["RUNNER_TEMP"]
          lock_pub = open(f"{tmp}/lock-pub.pem").read()
          acct_pub = open(f"{tmp}/account-pub.pem").read()
          path = "web/wrangler.toml"
          s = open(path).read()
          pat = re.compile(r'^SGX_LOCK_PUBLIC = .*$', re.M)
          assert len(pat.findall(s)) == 1, "expected exactly one SGX_LOCK_PUBLIC line"
          assert "SGX_ACCOUNT_PUBLIC" not in s
          s = pat.sub(lambda m: "SGX_LOCK_PUBLIC = " + json.dumps(lock_pub) + "\nSGX_ACCOUNT_PUBLIC = " + json.dumps(acct_pub), s)
          open(path, "w").write(s)
          v = tomllib.loads(s)["env"]["preview"]["vars"]
          assert v["SGX_LOCK_PUBLIC"] == lock_pub and v["SGX_ACCOUNT_PUBLIC"] == acct_pub and v["SGX_ENV"] == "preview"
          print("preview public keys written to the runner copy of web/wrangler.toml")
          PYEOF

      - name: Set preview test secrets (preview only)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 只写 preview 环境（PATCH deployment_configs.preview），绝不碰 production。
        # 必须在部署之前写，否则新值要到下一次部署才生效。secret 都经 env 传进来，不拼进脚本；
        # SGX_ROOT_KEY / SGX_PW_PEPPER 用上面本次生成的 PREVIEW_TEST_ROOT_KEY / PREVIEW_TEST_PW_PEPPER（已打码）。
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, tomllib, urllib.request, urllib.error
          env = os.environ
          tmp = env["RUNNER_TEMP"]
          rd = lambda f: open(f"{tmp}/{f}").read()
          lock_priv, lock_pub = rd("lock-priv.pem"), rd("lock-pub.pem")
          acct_priv, acct_pub = rd("account-priv.pem"), rd("account-pub.pem")
          assert "PRIVATE KEY" in lock_priv and "PRIVATE KEY" in acct_priv
          root_key, pepper = env["PREVIEW_TEST_ROOT_KEY"], env["PREVIEW_TEST_PW_PEPPER"]
          assert len(root_key) == 64 and len(pepper) == 64
          pv = tomllib.load(open("web/wrangler.toml", "rb"))["env"]["preview"]["vars"]
          secret = lambda v: {"type": "secret_text", "value": v}
          plain = lambda v: {"type": "plain_text", "value": v}
          body = json.dumps({"deployment_configs": {"preview": {"env_vars": {
              "SGX_ROOT_KEY": secret(root_key),
              "SGX_PW_PEPPER": secret(pepper),
              "SGX_LOCK_PRIVATE": secret(lock_priv),
              "SGX_ACCOUNT_PRIVATE": secret(acct_priv),
              # 下面这些也在 web/wrangler.toml 里（部署时以它为准）；这里写同样的值，两边不会不一致
              "SGX_LOCK_PUBLIC": plain(lock_pub),
              "SGX_ACCOUNT_PUBLIC": plain(acct_pub),
              "SGX_SITE": plain(pv["SGX_SITE"]),
              "SGX_ENV": plain(pv["SGX_ENV"]),
              "SGX_RP_ID": plain(pv["SGX_RP_ID"]),
              "SGX_ORIGIN": plain(pv["SGX_ORIGIN"]),
          }}}}).encode()
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{env['CF_ACCOUNT_ID']}/pages/projects/styrigx-space",
              data=body, method="PATCH",
              headers={"Authorization": f"Bearer {env['CF_PAGES_TOKEN']}", "Content-Type": "application/json"})
          try:
              r = json.load(urllib.request.urlopen(req, timeout=30))
          except urllib.error.HTTPError as e:
              print(f"FAIL: HTTP {e.code}", file=sys.stderr); sys.exit(1)
          if not r.get("success"):
              print("FAIL: success=false", file=sys.stderr); sys.exit(1)
          print("preview secrets updated")
          PYEOF

      - name: Apply D1 migrations to preview
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 部署 preview 前对 styrigx-auth-gateway-preview 跑迁移（--env preview），绝不碰 production；失败要让 CI 红。
        # 跑完列一次已应用的迁移（d1_migrations 表）。
        working-directory: web
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply styrigx-auth-gateway-preview --remote --env preview
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute styrigx-auth-gateway-preview --remote --env preview --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to preview
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: web
          command: pages deploy public --project-name=styrigx-space --branch=passkey-e2e --commit-dirty=true

      - name: Run WebAuthn E2E (SGX_TEST_SUITE=passkey)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 跑 passkey 组的全部 describe（testMatch 已限定文件，不再 --grep）。
        # 预览地址和预览 D1 id 从 web/wrangler.toml 读，不在这里重复写。
        # SGX_TEST_ROOT_KEY 是本次生成、已写进预览 SGX_ROOT_KEY 的同一个值。
        # 测试进程写预览 D1（打开重置开关、清根凭证限速计数）用 Pages 部署 token（和上面清 D1 同一个）。
        # 测试 helper 尽量少写：缓存会话 / 进门票并用只读接口确认（tests/web/e2e/preview-helpers.cjs 文件头）。
        env:
          SGX_TEST_SUITE: passkey
          SGX_TEST_ROOT_KEY: ${{ env.PREVIEW_TEST_ROOT_KEY }}
          SGX_TEST_CF_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          SGX_TEST_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          eval "$(python3 - <<'PYEOF'
          import shlex, tomllib
          p = tomllib.load(open("web/wrangler.toml", "rb"))["env"]["preview"]
          d1 = [k["database_id"] for k in p["d1_databases"] if k["binding"] == "D1_LOCK_AUTH"][0]
          print("export SGX_TEST_BASE=" + shlex.quote(p["vars"]["SGX_ORIGIN"]))
          print("export SGX_TEST_PREVIEW_D1_ID=" + shlex.quote(d1))
          PYEOF
          )"
          echo "preview: $SGX_TEST_BASE"
          npx playwright test --config=tests/config/playwright.config.js

      - name: Guard - no private vars on Pages production
        # 私密值只在鉴权网关的 Secrets Store，Pages 生产环境上不许再有（防止有人加回去）。
        # 要用 Cloudflare secret 读 Pages 项目：PR 运行不碰 Cloudflare，只在 main / 手动运行查（只改文档 / 样式时也查）
        if: github.event_name != 'pull_request'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          env = os.environ
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{env['CF_ACCOUNT_ID']}/pages/projects/styrigx-space",
              headers={"Authorization": f"Bearer {env['CF_PAGES_TOKEN']}"})
          r = json.load(urllib.request.urlopen(req, timeout=30))
          # 生产不带任何变量时 API 返回 env_vars: null，按空处理
          prod = r["result"]["deployment_configs"]["production"].get("env_vars") or {}
          names = sorted(prod.keys())
          print("production vars:", names)
          # Pages 只放静态文件，会话检查全在网关；生产部署按 web/wrangler.toml 不带任何变量
          forbidden = ["SGX_LOCK_PRIVATE", "SGX_ACCOUNT_PRIVATE", "SGX_STEPUP_PRIVATE", "SGX_APP_PRIVATE", "SGX_ROOT_KEY", "SGX_PW_PEPPER", "TURNSTILE_SECRET", "OWNER_KEY"]
          present = [v for v in forbidden if v in names]
          assert not present, f"private vars must not be on Pages production: {present}"
          print("guard OK: no private vars on Pages production")
          PYEOF

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: passkey-test-results
          path: |
            test-results/
            playwright-report/
            emulator-log/

  build-and-deploy:
    # 部署条件：(push 或 workflow_dispatch) 且 ref 是 main；其他分支手动触发不部署。
    # 手动触发同样要先过 quality 和 passkey-e2e（不跳过）。
    # 不加任何传密钥值的 input，密钥只在 Cloudflare 后台改。
    # Pages 只放静态文件，会话检查全靠网关，所以等网关部署好、线上冒烟通过后再部署 Pages；网关失败就不部署 Pages。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-auth-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        # 只给 wrangler-action 用（不再 npm ci / 构建）
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download production site (built and checked in quality)
        # quality 的生产构建（带 SGX_BUILD_SHA）原样部署，不再重建：测过的就是上线的
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: site-production
          path: web/public

      - name: Assert static-only Pages build
        # 生产部署只能带静态的 _worker.js（只做 pages.dev → styrigx.com 跳转），不能带网关代码
        run: |
          for f in _headers _redirects index.html; do test -s "web/public/$f" || { echo "::error::web/public/$f missing"; exit 1; }; done
          grep -q "Content-Security-Policy" web/public/_headers
          test -f web/public/_worker.js
          grep -q "styrigx.com" web/public/_worker.js
          if grep -q "X-SGX-Runtime" web/public/_worker.js; then echo "::error::gateway bundle in production Pages build"; exit 1; fi

      - name: Record live Pages production deployment (rollback target)
        # 部署前记下生产当前的 deployment（项目的 canonical_deployment；scripts/deploy-rollback.mjs）。还没有生产部署 / 记录失败 → 空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（Cloudflare Pages 编辑，已有）
        id: live
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-rollback.mjs pages-snapshot --project styrigx-space

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: web
          command: pages deploy public --project-name=styrigx-space --commit-dirty=true

      - name: Smoke test Pages (pages.dev must redirect, pages still behind the gateway)
        # 只发不带 cookie 的只读请求。pages.dev 地址不经过网关，必须 301 回 styrigx.com（或被 Access 拦在登录页），否则能绕过锁屏。
        run: |
          set -u
          ok=1
          for i in 1 2 3 4 5 6; do
            hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://styrigx-space.pages.dev/settings/ | tr -d '\r' || true)
            code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
            loc=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="location"{print $2}')
            echo "pages.dev /settings/ -> $code $loc (try $i)"
            if [ "$code" = "301" ] && [ "$loc" = "https://styrigx.com/settings/" ]; then ok=0; break; fi
            # pages.dev 前面挂了 Cloudflare Access 时，请求先被 Access 302 到登录页，同样到不了页面，也算通过。
            case "$loc" in
              https://styrigx.cloudflareaccess.com/cdn-cgi/access/login/styrigx-space.pages.dev\?*)
                [ "$code" = "302" ] && { ok=0; break; } ;;
            esac
            sleep 5
          done
          [ $ok = 0 ] || { echo "::error::pages.dev neither redirected to styrigx.com nor sat behind Access"; exit 1; }
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://styrigx.com/settings/ | tr -d '\r')
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
          echo "styrigx.com /settings/ -> $code runtime=${rt:-none}"
          if [ "$code" != "302" ] || [ "$rt" != "worker" ]; then echo "::error::/settings/ not locked by the gateway"; exit 1; fi
          # 关键页：首页（未登录照常 200 锁屏，网关回源 Pages）带的是这次构建的短 SHA（<html data-sgx-build>，HTML 是 max-age=0）
          short="${GITHUB_SHA:0:7}"
          for i in $(seq 1 12); do
            code=$(curl -sS -o "$RUNNER_TEMP/home.html" -w '%{http_code}' https://styrigx.com/ || true)
            if [ "$code" = "200" ] && grep -Eq "data-sgx-build=\"?$short" "$RUNNER_TEMP/home.html"; then echo "/ -> 200, build $short (try $i)"; exit 0; fi
            echo "/ -> $code, build $(grep -Eo 'data-sgx-build="?[0-9a-z]+' "$RUNNER_TEMP/home.html" | head -1) (try $i)"
            sleep 5
          done
          echo "::error::styrigx.com/ does not serve build $short"; exit 1

      - name: Roll back Pages production (deploy or smoke failed)
        # 前面任何一步失败且记到了部署前的 deployment：生产已经不是它就调 Pages 回滚 API 退回去并核对；没变（上传就失败）什么都不做。job 照样红
        if: failure() && steps.live.outputs.deployment != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.deployment }}
        run: node scripts/deploy-rollback.mjs pages-rollback --project styrigx-space --to "$PREVIOUS"

  deploy-search-worker:
    # 全站搜索 styrigx-search-index（workers/search-index）：先于网关部署（网关的服务绑定 SEARCH 指向它，它不在就部署不了）。
    # 没有公开地址（workers_dev=false、没有路由），只能从网关 /api/search 进。
    # 部署后把主站索引写进 KV styrigx-search-index 的 site:space（scripts/build-search-index.mjs，要先构建网站）。
    # token：Cloudflare 上 styrigx-search-index-deploy = GitHub 环境 STYRIGX_SEARCH_INDEX_DEPLOY 里的同名密钥，
    # 权限 Workers Scripts 编辑 + Workers KV Storage 编辑 + Account Settings 读取；环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_SEARCH_INDEX_DEPLOY
    # 给 deploy-status-worker 的健康闸门：部署前记下的版本（闸门判失败时 rollback-search-worker 退回它）和开始部署的时刻（部署前基线）
    outputs:
      previous: ${{ steps.live.outputs.version }}
      started_at: ${{ steps.t0.outputs.at }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        # 只给 wrangler-action 用（索引在 quality 里由生产构建生成，这里不再构建 / npm ci）
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download search index (site:space, built in quality)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: search-index-space
          path: ${{ runner.temp }}

      - name: Check search index
        run: test -s "$RUNNER_TEMP/search-space.json"

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/search-index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SEARCH_INDEX_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Record deploy start (baseline for the status health gate)
        # 毫秒时间戳（UTC）：status 的健康闸门把这之前的最近一次巡检当「部署前」，部署前就在失败的不算这次弄坏的
        id: t0
        run: echo "at=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Deploy search Worker (styrigx-search-index)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SEARCH_INDEX_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/search-index
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Post-deploy check (no public address, so check the live version)
        # 这个 Worker 没有公开地址、冒烟打不到（只能经网关 + 会话进）：核对线上确实换成了一个吃 100% 流量的新版本。
        # 代码能不能起来由 Cloudflare 上传时校验（启动就抛错的脚本上传会被拒）
        working-directory: workers/search-index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SEARCH_INDEX_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Upload search index to KV
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SEARCH_INDEX_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/search-index
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: kv key put site:space --path=${{ runner.temp }}/search-space.json --binding=KV_SEARCH_INDEX --remote

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/search-index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SEARCH_INDEX_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-status-worker:
    # 站点监测 styrigx-status（workers/status）：先于网关部署（网关的服务绑定 STATUS 指向它，它不在就部署不了）。
    # 没有公开地址（workers_dev=false、没有路由），Cron 每分钟检查一轮；数据只能从网关 /api/status 进。
    # 先把 D1 styrigx-status 的表结构迁到最新（migrations/，已迁过的跳过），再部署。
    # token：Cloudflare 上 styrigx-status-deploy = GitHub 环境 STYRIGX_STATUS_DEPLOY 里的同名密钥，
    # 权限 Workers Scripts 编辑 + D1 编辑 + Account Settings 读取 + Secrets Store 编辑（PR3 起有 Secrets Store 绑定
    # SGX_CF_USAGE_TOKEN，部署必须 Edit，Read 报 10021，同鉴权网关）；环境只允许 main。
    # 迁移 migrations/0002_usage.sql（用量快照表）由下面的 d1 migrations apply 自动跑。
    # 2026-10-28 起有服务绑定 SEARCH / CHAT（每分钟测它们的 /healthz）：排在 search / chat 之后，
    # 免得新监测先上线、测到还没带 /healthz 的旧版本，误开故障。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-search-worker, deploy-chat-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_STATUS_DEPLOY
    # 健康闸门的结论（scripts/health-gate.mjs）：verdict = pass / fail / binding / timeout / error；failed = 确认失败的站（逗号分隔）
    outputs:
      health_verdict: ${{ steps.health.outputs.verdict }}
      health_failed: ${{ steps.health.outputs.failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (styrigx-status)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/status
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-status --remote

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy status Worker (styrigx-status)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/status
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Post-deploy check (no public address, so check the live version)
        # 这个 Worker 没有公开地址、冒烟打不到（只能经网关 + 会话进）：核对线上确实换成了一个吃 100% 流量的新版本。
        # 代码能不能起来由 Cloudflare 上传时校验（启动就抛错的脚本上传会被拒）
        working-directory: workers/status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Post-deploy health gate (status checks of search / chat after this deploy)
        # 健康闸门第二阶段（scripts/health-gate.mjs）：等新部署的 status 每分钟巡检（经服务绑定测 search / chat 的 /healthz）写进 D1 checks，
        # 只认部署之后的；连续 2 次失败 → 红。最多等 5 分钟（巡检不跑 = status 自己有问题，同样红）。
        # 红了：下面一步把 status 退回部署前版本；verdict = fail 时 rollback-search-worker / rollback-chat-worker 退回出问题的那个；
        # 网关 / Pages / 账号 / 分享都等这个 job，不会部署。部署前就在失败的站（比如聊天没配钥匙）只打 warning。
        # D1 REST 用 status 部署本来就有的 token（D1 编辑，同上面的 d1 migrations apply），不加 secret、不经网关。
        id: health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE_UNTIL: ${{ needs.deploy-search-worker.outputs.started_at }},${{ needs.deploy-chat-worker.outputs.started_at }}
        run: node scripts/health-gate.mjs --sites search,chat --baseline-until "$BASELINE_UNTIL"

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  rollback-search-worker:
    # 健康闸门（deploy-status-worker 的 Post-deploy health gate）确认 search 在部署后失败 → 退回 deploy-search-worker 记下的部署前版本。
    # 在 search 自己的环境里跑，只用它部署本来就用的 token（Workers Scripts 编辑），同 job 内的自动回滚（含回滚下限）。
    # 闸门没判 fail（pass / binding / timeout / error）或没记到部署前版本 → 跳过。
    if: ${{ always() && needs.deploy-status-worker.outputs.health_verdict == 'fail' && contains(format(',{0},', needs.deploy-status-worker.outputs.health_failed), ',search,') && needs.deploy-search-worker.outputs.previous != '' }}
    needs: [deploy-search-worker, deploy-status-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: STYRIGX_SEARCH_INDEX_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Roll back search Worker (health gate failed)
        # 只换代码版本；KV 里的索引（site:space）是这次上传的，不回滚（同 job 内回滚）
        working-directory: workers/search-index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SEARCH_INDEX_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ needs.deploy-search-worker.outputs.previous }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  rollback-chat-worker:
    # 同 rollback-search-worker：闸门确认 chat 在部署后失败 → 退回 deploy-chat-worker 记下的部署前版本（chat 环境原有的 token）。
    if: ${{ always() && needs.deploy-status-worker.outputs.health_verdict == 'fail' && contains(format(',{0},', needs.deploy-status-worker.outputs.health_failed), ',chat,') && needs.deploy-chat-worker.outputs.previous != '' }}
    needs: [deploy-chat-worker, deploy-status-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: STYRIGX_CHAT_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Roll back chat Worker (health gate failed)
        working-directory: workers/chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CHAT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ needs.deploy-chat-worker.outputs.previous }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-chat-worker:
    # 聊天 styrigx-chat（workers/chat，2026-10-22 从网关拆出来）：先于网关部署（网关的服务绑定 CHAT 指向它，它不在就部署不了）。
    # 没有公开地址（workers_dev=false、preview_urls=false、没有路由），只能从网关 /api/chat 进（网关先验同源 + 会话 + 只许管理员）。
    # 钥匙：Secrets Store 的 SGX_CHAT_API_KEY 只绑在这里（网关不绑）。Cloudflare 部署时会核对 Secrets Store 绑定，
    # 密钥还没建 → 第一步部署失败；这时退一步部署不带钥匙绑定的同一份代码（从第一个 [[secrets_store_secrets]] 删到文件末尾），
    # 聊天回 503 no_key，job 仍然成功，网关和 Pages 照常部署。建好密钥后下一次部署自动带上绑定。
    # 两步都失败（代码 / token 问题）→ job 红，网关不部署（它的服务绑定指向的 Worker 可能还不存在）。
    # token：Cloudflare 上 styrigx-chat-deploy = GitHub 环境 STYRIGX_CHAT_DEPLOY 里的同名环境密钥 STYRIGX_CHAT_DEPLOY，
    # 权限 Workers Scripts 编辑 + Secrets Store 编辑（带 Secrets Store 绑定部署必须 Edit，Read 报 10021，同鉴权网关）
    # + Account Settings 读取；没有路由，不需要 Workers Routes 权限。环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_CHAT_DEPLOY
    # 给 deploy-status-worker 的健康闸门：部署前记下的版本（闸门判失败时 rollback-chat-worker 退回它）和开始部署的时刻（部署前基线）
    outputs:
      previous: ${{ steps.live.outputs.version }}
      started_at: ${{ steps.t0.outputs.at }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CHAT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Record deploy start (baseline for the status health gate)
        # 毫秒时间戳（UTC）：没配钥匙时 /healthz 部署前后都是 503，基线里本来就失败，闸门不会因此回滚聊天
        id: t0
        run: echo "at=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Deploy chat Worker (styrigx-chat)
        id: deploy_chat
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_CHAT_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/chat
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Prepare keyless config (fallback)
        if: steps.deploy_chat.outcome == 'failure'
        working-directory: workers/chat
        run: |
          echo "::warning::styrigx-chat deploy failed (SGX_CHAT_API_KEY missing in Secrets Store?); deploying without the key binding, /api/chat will answer 503 no_key"
          sed '/^\[\[secrets_store_secrets\]\]/,$d' wrangler.toml > wrangler.nokey.toml
          if grep -q "secrets_store_secrets" wrangler.nokey.toml; then echo "::error::keyless config still has a Secrets Store binding"; exit 1; fi
          grep -q '^name = "styrigx-chat"$' wrangler.nokey.toml

      - name: Deploy chat Worker without key binding (fallback)
        if: steps.deploy_chat.outcome == 'failure'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_CHAT_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/chat
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --config wrangler.nokey.toml

      - name: Post-deploy check (no public address, so check the live version)
        # 这个 Worker 没有公开地址、冒烟打不到（只能经网关 + 会话进）：核对线上确实换成了一个吃 100% 流量的新版本。
        # 代码能不能起来由 Cloudflare 上传时校验（启动就抛错的脚本上传会被拒）
        working-directory: workers/chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CHAT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CHAT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-proxy-rules-worker:
    # 规则集反代 styrigx-proxy-rules（workers/proxy-rules）：独立部署，不等也不挡网关和 Pages。
    # 公开地址只有自定义域名 proxy-rules.styrigx.com（wrangler.toml 的 routes，custom_domain）。
    # token：Cloudflare 上 styrigx-proxy-rules-deploy = GitHub 环境 STYRIGX_PROXY_RULES_DEPLOY 里的同名密钥，
    # 权限 Workers Scripts 编辑 + Account Settings 读取 + styrigx.com 的 Workers Routes 编辑；环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_PROXY_RULES_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/proxy-rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_PROXY_RULES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy proxy rules Worker (styrigx-proxy-rules)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_PROXY_RULES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/proxy-rules
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Smoke test proxy-rules.styrigx.com
        # 只发只读请求。新域名第一次绑定要等证书签发，最多重试 12 次（约 2 分钟）。
        run: |
          set -u
          B=https://proxy-rules.styrigx.com
          check() { # 路径 期望状态码
            for i in $(seq 1 12); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$B$1" || true)
              echo "$1 -> $code (try $i)"
              [ "$code" = "$2" ] && return 0
              sleep 10
            done
            echo "::error::$1 expected $2"; return 1
          }
          ok=0
          check /healthz 200 || ok=1
          check /MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs 200 || ok=1
          check /MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs 200 || ok=1
          # 白名单外不转发
          check /MetaCubeX/meta-rules-dat/meta/README.md 404 || ok=1
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/proxy-rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_PROXY_RULES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-auth-worker:
    # 鉴权网关 styrigx-auth-gateway：main 上真部署。先于 Pages 部署（Pages 只放静态文件，靠网关验会话）。
    # 路由见 workers/auth-gateway/wrangler.toml（整站通配；/api/avatar*、/api/prefs*、/api/wellbeing*、/avatar/* 由账号 Worker 的更具体路由承接）；workers_dev=false。部署后自动冒烟检查线上。
    # Pages 部署（build-and-deploy）等这里成功后才开始。
    # 服务绑定指向的 Worker 要先在：needs 里的 deploy-search-worker / deploy-status-worker / deploy-chat-worker 先部署。
    # 密钥全在 Secrets Store，CI 不传任何密值。
    # 用专门的 token（GitHub 环境密钥 STYRIGX_AUTH_GATEWAY_DEPLOY，名字对应 Cloudflare 上的
    # styrigx-auth-gateway-deploy）：Workers Scripts 编辑 + Secrets Store 编辑（带 Secrets Store 绑定部署必须 Edit，Read 报 10021）
    # + Account Settings 读取 + styrigx.com 的 Workers Routes 编辑。Pages 的部署 token 不给 Worker 权限，互不影响。
    # 这把 token 放在 GitHub 环境 STYRIGX_AUTH_GATEWAY_DEPLOY（与密钥同名）的环境密钥里，该环境只允许 main 分支部署：
    # 其他分支即使改了工作流也拿不到它。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-search-worker, deploy-status-worker, deploy-chat-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_AUTH_GATEWAY_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/auth-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_AUTH_GATEWAY_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy auth Worker (styrigx-auth-gateway)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_AUTH_GATEWAY_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/auth-gateway
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Smoke test production /api/* and pages (must be served by the Worker)
        # passkey-e2e 只测预览，测不到生产这条路，所以部署后直接打线上。
        # 只发不带 cookie 的只读请求，不登录、不写数据。路由生效可能要几秒，最多重试 6 次。
        # 失败时网关自动退回部署前的版本（最后一步），Pages / 账号 / 分享不会部署（都等这个 job）；修好或 revert 后重新跑。
        run: |
          set -u
          check() { # 路径（可带子站域名） 期望状态码
            case "$1" in https://*) u="$1" ;; *) u="https://styrigx.com$1" ;; esac
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$u" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "worker" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 from worker"; return 1
          }
          ok=0
          check /api/geo 200 || ok=1
          check /api/lock-session-check 401 || ok=1
          # 全站搜索：没会话 401（网关先拦），子站同样
          check '/api/search?q=a' 401 || ok=1
          check 'https://blog.styrigx.com/api/search?q=a' 401 || ok=1
          # 站点监测：没会话 401
          check /api/status 401 || ok=1
          # 聊天：没会话 401（网关先拦，不进 styrigx-chat）
          check /api/chat 401 || ok=1
          # 未登录访问不存在的接口：middleware 先拦（默认拒绝），返回 401 而不是 404，这是预期。
          check /api/no-such-endpoint 401 || ok=1
          # 页面：网关验会话后回源 Pages。首页未登录照常 200（锁屏），内页未登录 302 到锁屏
          check / 200 || ok=1
          check /en/ 200 || ok=1
          check /settings/ 302 || ok=1
          check /browser/search/ 302 || ok=1
          # 头像 / 云同步 / 数字健康归账号 Worker styrigx-account（更具体的路由），冒烟在 deploy-account-worker 里
          # 子站：页面未登录 302 到主站锁屏、session-check 401，都由网关回答（子站 Pages 不持钥匙）
          check https://blog.styrigx.com/ 302 || ok=1
          check https://blog.styrigx.com/api/lock-session-check 401 || ok=1
          # 静态资源不过网关：不能带 worker 标记
          css=$(curl -sS -o /dev/null -D - https://styrigx.com/robots.txt | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
          echo "/robots.txt runtime=${css:-none}"
          if [ -n "$css" ]; then echo "::error::static file went through the Worker"; ok=1; fi
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/auth-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_AUTH_GATEWAY_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-account-worker:
    # 账号 Worker styrigx-account（workers/account，2026-10-24 从网关拆出来）：头像（KV_PROFILE）、设置云同步（D1_SETTINGS_SYNC，表 settings_sync）、数字健康（D1_WELLBEING）。
    # 2026-10-28 上线前用 scripts/migrate-prefs-kv-to-d1.mjs 把旧 KV 里的 account-prefs 导入过 D1（旧键 2026-10-29 已删）。
    # 路由见 workers/account/wrangler.toml（styrigx.com/api/avatar*、/api/prefs*、/api/wellbeing*、/avatar/*，比网关的 styrigx.com/* 更具体）；
    # workers_dev=false、preview_urls=false。会话问网关：服务绑定 AUTH → styrigx-auth-gateway 的 AuthVerifier（lockSession() / accountSession()），
    # 所以排在网关之后（要先有带 accountSession() 的网关）。不持任何钥匙，CI 不传任何密值。
    # 先把 D1 styrigx-account 的表结构迁到最新（migrations/，已迁过的跳过；失败要让 job 红，不 continue-on-error），再部署，再冒烟。
    # token：Cloudflare 上 styrigx-account-deploy = GitHub 环境 STYRIGX_ACCOUNT_DEPLOY 里的同名环境密钥 STYRIGX_ACCOUNT_DEPLOY，
    # 权限 Workers Scripts 编辑 + Workers KV Storage 编辑 + D1 编辑 + Account Settings 读取 + styrigx.com 的 Workers Routes 编辑；环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-auth-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_ACCOUNT_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (styrigx-account)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/account
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-account --remote

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy account Worker (styrigx-account)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/account
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Smoke test production (avatar / prefs / wellbeing must be served by styrigx-account)
        # 只发不带 cookie 的只读请求，不登录、不写数据。路由生效可能要几秒，最多重试 6 次。
        run: |
          set -u
          check() { # 路径 期望状态码 期望 X-SGX-Runtime
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "https://styrigx.com$1" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "$3" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 from $3"; return 1
          }
          ok=0
          # 头像：未登录也能拿（主人上传的在 KV_PROFILE）
          check /avatar/96.webp 200 account || ok=1
          check '/avatar/192.webp?v=smoke' 200 account || ok=1
          # 接口：没会话 401（门照网关 middleware）
          check /api/wellbeing 401 account || ok=1
          check '/api/wellbeing?d=2026-01-01' 401 account || ok=1
          check /api/prefs 401 account || ok=1
          check /api/avatar 401 account || ok=1
          # 网关的接口和页面没被抢走
          check /api/lock-session-check 401 worker || ok=1
          check /api/account 401 worker || ok=1
          check /settings/wellbeing/ 302 worker || ok=1
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-share-worker:
    # 分享短链 Worker styrigx-share（workers/share，2026-10-24）：https://styrigx.com/s/<码> + 管理员管理接口 /api/share，数据在 D1 styrigx-share（D1_SHARE_LINK）。
    # 路由见 workers/share/wrangler.toml（styrigx.com/s/*、styrigx.com/api/share*，比网关的 styrigx.com/* 更具体）；workers_dev=false、preview_urls=false。
    # 不持任何钥匙：会话问网关 AuthVerifier（服务绑定 AUTH），签 / 作废短链钥匙、给访客换会话问网关 ShareIssuer（服务绑定 ISSUER），
    # 所以排在网关之后（要先有带 ShareIssuer 的网关）。CI 不传任何密值。
    # 步骤：迁移 D1 styrigx-share（migrations/；失败要让 job 红，不 continue-on-error）
    # → 查 d1_migrations 和表，确认 0001_share_links.sql 真的在库里（只看到 No migrations to apply 不算数）→ 部署 → 冒烟。
    # token：Cloudflare 上 styrigx-share-deploy = GitHub 环境 STYRIGX_SHARE_DEPLOY 里的同名环境密钥 STYRIGX_SHARE_DEPLOY，
    # 权限 Workers Scripts 编辑 + D1 编辑 + Account Settings 读取 + styrigx.com 的 Workers Routes 编辑；环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-auth-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_SHARE_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (styrigx-share)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/share
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-share --remote

      - name: Confirm migrations are really in the database (styrigx-share)
        working-directory: workers/share
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          out=$(npx --yes "wrangler@$WRANGLER_VERSION" d1 execute styrigx-share --remote --json --command "SELECT name FROM d1_migrations UNION ALL SELECT 'table:' || name FROM sqlite_master WHERE type = 'table'")
          echo "$out"
          ok=0
          for need in '"0001_share_links.sql"' '"table:share_link"' '"table:share_fail"'; do
            if ! printf '%s' "$out" | grep -q "$need"; then echo "::error::D1 styrigx-share 里没有 $need"; ok=1; fi
          done
          exit $ok

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/share
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy share Worker (styrigx-share)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/share
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Smoke test production (/s/* and /api/share must be served by styrigx-share)
        # 只发不带 cookie 的只读请求，不登录、不写数据（随机码打不开，只算 1 次失败计数）。路由生效可能要几秒，最多重试 6 次。
        run: |
          set -u
          check() { # 路径 期望状态码 期望 X-SGX-Runtime [期望 Location]
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "https://styrigx.com$1" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              loc=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} location=${loc:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "$3" ] && { [ -z "${4:-}" ] || [ "$loc" = "$4" ]; }; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 from $3"; return 1
          }
          ok=0
          # 打不开的短链：统一 302 到锁屏
          check "/s/smoke$(date +%s)xxxxxxxxxxx" 302 share 'https://styrigx.com/?lock=1' || ok=1
          # 管理接口：没会话 401（门）
          check /api/share 401 share || ok=1
          # 网关的接口和页面没被抢走；账号 Worker 的也没有
          check /api/lock-session-check 401 worker || ok=1
          check /settings/ 302 worker || ok=1
          check /account/tempkeys/ 302 worker || ok=1
          check /api/wellbeing 401 account || ok=1
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/share
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

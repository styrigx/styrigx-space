name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 2.4.0 E：质量闸门 —— 视觉回归 + Lighthouse CI + stylelint，不达标不部署
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install test deps
        run: npm install --no-save @playwright/test stylelint postcss-scss @lhci/cli http-server && npx playwright install chromium --with-deps

      - name: Build CSS
        run: node scripts/build-css.cjs --minify

      - name: Build site (生产构建，用于锁屏测试)
        run: hugo --minify

      - name: stylelint（禁止硬编码颜色）
        run: npx stylelint "assets/css/input.css"

      - name: Lock screen tests (Hark：生产构建，锁屏启用)
        # 先跑锁屏专用测试：需要锁屏启用的构建
        run: |
          hugo --minify
          SGX_TEST_SUITE=lock npx playwright test --config=playwright.config.js

      - name: Rebuild for visual/Lighthouse (Hark：测试构建，锁屏禁用)
        # 视觉回归和 Lighthouse 用锁屏禁用的构建，避免锁屏干扰；
        # Turnstile 用 Cloudflare 官方测试 Key（sed 替换，不污染正式密钥）
        run: |
          sed -i "s/0x4AAAAAAFSBhpWkAwZr1SMA/1x00000000000000000000AA/g" hugo.yaml
          hugo --minify
        env:
          SGX_TEST_NO_LOCK: "1"

      - name: Visual regression
        run: npx playwright test --config=playwright.config.js

      - name: Lighthouse CI
        run: npx lhci autorun --config=.lighthouserc.json

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build CSS
        run: node scripts/build-css.cjs --minify

      - name: Fetch music previews
        run: node scripts/music-previews.mjs
        continue-on-error: true

      - name: Build site
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=styrigx-space --commit-dirty=true

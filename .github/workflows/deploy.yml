name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 2.4.0 E：质量闸门 —— 视觉回归 + Lighthouse CI + stylelint，不达标不部署
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install test deps
        run: npm install --no-save @playwright/test stylelint postcss-scss @lhci/cli http-server && npx playwright install chromium --with-deps

      - name: Build CSS
        run: node scripts/build-css.cjs --minify

      - name: Build site
        run: hugo --minify

      - name: stylelint（禁止硬编码颜色）
        run: npx stylelint "assets/css/input.css"

      - name: Visual regression
        # 像素对比对渲染环境敏感（CI/本地字体差异），仅报告不阻塞部署；
        # 严格对比在本地跑（npx playwright test）
        run: npx playwright test --config=playwright.config.js
        continue-on-error: true

      - name: Lighthouse CI
        run: npx lhci autorun --config=.lighthouserc.json

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build CSS
        run: node scripts/build-css.cjs --minify

      - name: Fetch music previews
        run: node scripts/music-previews.mjs
        continue-on-error: true

      - name: Build site
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=styrigx-space --commit-dirty=true

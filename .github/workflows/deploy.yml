    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-search-worker, deploy-ai-worker, deploy-status-worker, deploy-chat-worker, deploy-account-worker, deploy-share-worker, deploy-curio-core, deploy-daymark-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_AUTH_GATEWAY_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/auth-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_AUTH_GATEWAY_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy auth Worker (styrigx-auth-gateway)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_AUTH_GATEWAY_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/auth-gateway
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Smoke test production /api/* and pages (must be served by the Worker)
        # passkey-e2e 只测预览，测不到生产这条路，所以部署后直接打线上。
        # 只发不带 cookie 的只读请求，不登录、不写数据。路由生效可能要几秒，最多重试 6 次。
        # 失败时网关自动退回部署前的版本（最后一步），Pages 不会部署（等这个 job）；账号 / 短链已先部署，新代码对旧网关兼容。修好或 revert 后重新跑。
        run: |
          set -u
          check() { # 路径（可带子站域名） 期望状态码
            case "$1" in https://*) u="$1" ;; *) u="https://styrigx.com$1" ;; esac
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$u" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "worker" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 from worker"; return 1
          }
          ok=0
          check /api/geo 200 || ok=1
          check /api/lock-session-check 401 || ok=1
          # 全站搜索：没会话 401（网关先拦），子站同样
          check '/api/search?q=a' 401 || ok=1
          # 站点监测：没会话 401
          check /api/status 401 || ok=1
          # 聊天：没会话 401（网关先拦，不进 styrigx-chat）
          check /api/chat 401 || ok=1
          # 未登录访问不存在的接口：middleware 先拦（默认拒绝），返回 401 而不是 404，这是预期。
          check /api/no-such-endpoint 401 || ok=1
          # 页面：网关验会话后回源 Pages。首页未登录照常 200（锁屏），内页未登录 302 到锁屏
          check / 200 || ok=1
          check /en/ 200 || ok=1
          check /settings/ 302 || ok=1
          check /browser/search/ 302 || ok=1
          # 账号（账号拆分 PR3）：/api/account 没有账号 Worker 的旧路由，一定进网关——无会话 401；伪造身份头也一样 401（网关先剥头）
          check /api/account 401 || ok=1
          forged() { # 路径：带伪造的 X-Styrigx-Lock-* 头，必须 401 且由网关回答（不许 200、不许进账号 Worker 的接口）
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' -H 'X-Styrigx-Lock-Session: 1' -H 'X-Styrigx-Lock-By: password' "https://styrigx.com$1" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "forged $1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "401" ] && [ "$rt" = "worker" ]; then return 0; fi
              # 账号 Worker 的旧路由还没手动删（部署步骤 4）：直接进账号 Worker 的默认 fetch，一律 404，同样碰不到接口
              if [ "$code" = "404" ] && [ "$rt" = "account" ]; then echo "::warning::$1 still hits a stale styrigx-account route (default fetch 404); delete the old routes (deploy step 4)"; return 0; fi
              sleep 5
            done
            echo "::error::forged identity headers on $1 expected 401 from worker"; return 1
          }
          forged /api/account || ok=1
          forged /api/prefs || ok=1
          forged /api/wellbeing || ok=1
          # 账号运行时标记：公开的头像文件经网关转发，响应保留账号 Worker 的 X-SGX-Runtime: account
          avatar_ok=1
          for i in 1 2 3 4 5 6; do
            hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "https://styrigx.com/avatar/96.webp?smoke=$GITHUB_RUN_ID" || true)
            code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
            rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
            echo "/avatar/96.webp -> $code runtime=${rt:-none} (try $i)"
            if [ "$rt" = "account" ] && [ "$code" = "200" ]; then avatar_ok=0; break; fi
            if [ "$rt" = "account" ] && [ "$code" = "404" ]; then avatar_ok=0; echo "::warning::/avatar/* still hits a stale styrigx-account route; delete the old routes (deploy step 4), then /avatar/96.webp must be 200 account"; break; fi
            sleep 5
          done
          [ $avatar_ok = 0 ] || { echo "::error::/avatar/96.webp expected X-SGX-Runtime: account"; ok=1; }
          # 子站（合并 PR3）：三站页面未登录 302 到主站锁屏（子站关口格式：why + 完整 return），由网关回答
          redir() { # 地址 期望状态码 期望 Location（逐字）
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$1" | tr -d '\r' || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              loc=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="location"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} location=${loc:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "worker" ] && [ "$loc" = "$3" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 to $3 from worker"; return 1
          }
          for s in blog curio daymark; do
            redir "https://styrigx.com/$s/" 302 "https://styrigx.com/?lock=1&why=no-cookie&return=https%3A%2F%2Fstyrigx.com%2F$s%2F" || ok=1
          done
          # 旧图志域名：任意路径 301 到主域名同路径 + 查询串（不验会话、不回源）
          redir https://atlas.styrigx.com/blog/ 301 https://styrigx.com/blog/ || ok=1
          redir 'https://atlas.styrigx.com/curio/?a=1' 301 'https://styrigx.com/curio/?a=1' || ok=1
          redir https://atlas.styrigx.com/daymark/en/ 301 https://styrigx.com/daymark/en/ || ok=1
          redir https://atlas.styrigx.com/api/lock-session-check 301 https://styrigx.com/api/lock-session-check || ok=1
          redir 'https://atlas.styrigx.com/api/search?q=a' 301 'https://styrigx.com/api/search?q=a' || ok=1
          # 静态资源不过网关：不能带 worker 标记
          css=$(curl -sS -o /dev/null -D - https://styrigx.com/robots.txt | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
          echo "/robots.txt runtime=${css:-none}"
          if [ -n "$css" ]; then echo "::error::static file went through the Worker"; ok=1; fi
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/auth-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_AUTH_GATEWAY_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-account-worker:
    # 账号 Worker styrigx-account（workers/account）：完整的账号系统（账号拆分 PR3）——账号密码 / 通行密钥 / 设备 / 账号会话 / 账号根密钥 /
    # 账号审计（D1_ACCOUNT_AUTH），头像（KV_PROFILE）、设置云同步（D1_SETTINGS_SYNC）、数字健康（D1_WELLBEING）。
    # 没有任何路由（workers/account/wrangler.toml 无 [[routes]]）、workers_dev=false、preview_urls=false：只经网关的服务绑定
    # ACCOUNT（AccountService）/ ACCOUNT_VERIFIER（AccountVerifier）进来（短链 Worker 不再绑它）；默认 fetch 一律 404。
    # 不调网关、不绑任何锁屏的东西（PR3 删掉了服务绑定 AUTH）。钥匙都在 Secrets Store（SGX_ACCOUNT_PRIVATE / PUBLIC、SGX_ACCOUNT_ROOT_KEY、
    # SGX_PW_PEPPER），CI 不传任何密值。
    # 部署顺序：账号、短链（互不依赖，可并行）→ 网关 → Pages。排在网关之前：网关的服务绑定指向它的命名入口（PR2 起已导出）。
    # 和网关 / 短链一样等 status 的健康闸门（needs 里的 search / status / chat）。
    # 注意：wrangler deploy 在配置里没有路由时不碰线上已有的路由（只在有路由时 PUT 整个列表），所以 PR3 前的 4 条旧路由
    # （styrigx.com/api/avatar*、/api/prefs*、/api/wellbeing*、/avatar/*）部署后还在、指向这里的默认 fetch（一律 404），
    # 要按部署步骤在网关部署后手动删掉；删之前这 4 类路径 404。
    # 先把 D1 styrigx-account 的表结构迁到最新（migrations/，已迁过的跳过；失败要让 job 红，不 continue-on-error），再部署，再核对。
    # token：Cloudflare 上 styrigx-account-deploy = GitHub 环境 STYRIGX_ACCOUNT_DEPLOY 里的同名环境密钥 STYRIGX_ACCOUNT_DEPLOY，
    # 权限 Workers Scripts 编辑 + Workers KV Storage 编辑 + D1 编辑 + Secrets Store 编辑（带 Secrets Store 绑定部署必须 Edit）+ Account Settings 读取；
    # 没有路由，不需要 Workers Routes 权限；环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-search-worker, deploy-status-worker, deploy-chat-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_ACCOUNT_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (styrigx-account)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/account
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-account --remote

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy account Worker (styrigx-account)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/account
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Post-deploy check (no public address, so check the live version)
        # 没有公开地址：核对线上确实换成了一个吃 100% 流量的新版本（同 search / chat）。代码能不能起来由 Cloudflare 上传时校验
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Smoke test production (forged identity headers never reach the account APIs)
        # 只发不带 cookie 的只读请求。这时网关可能还是旧版本、账号的 4 条旧路由可能还在（见上），所以每条只断言「碰不到接口」：
        # - 旧路由还在 → 进本 Worker 的默认 fetch：404 + X-SGX-Runtime: account（同时证明线上已是新代码：旧代码在这些路径回 401 / 200）；
        # - 旧路由已删 → 进网关：无会话 401 + X-SGX-Runtime: worker。
        # 绝不许 200（伪造的 X-Styrigx-Lock-Session: 1 不能当身份用）。
        run: |
          set -u
          check() { # 路径
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' -H 'X-Styrigx-Lock-Session: 1' -H 'X-Styrigx-Lock-By: password' "https://styrigx.com$1" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "forged $1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "404" ] && [ "$rt" = "account" ]; then return 0; fi
              if [ "$code" = "401" ] && [ "$rt" = "worker" ]; then return 0; fi
              sleep 5
            done
            echo "::error::forged identity headers on $1: expected 404 from account (stale route) or 401 from worker"; return 1
          }
          ok=0
          check /api/prefs || ok=1
          check /api/wellbeing || ok=1
          check /api/avatar || ok=1
          # 网关的接口和页面没被抢走
          for p in /api/lock-session-check; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://styrigx.com$p" || true)
            echo "$p -> $code"; [ "$code" = "401" ] || ok=1
          done
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-share-worker:
    # 分享短链 Worker styrigx-share（workers/share，2026-10-24）：https://styrigx.com/s/<码> + 管理接口 /api/share，数据在 D1 styrigx-share（D1_SHARE_LINK）。
    # 路由见 workers/share/wrangler.toml（styrigx.com/s/*、styrigx.com/api/share*，比网关的 styrigx.com/* 更具体）；workers_dev=false、preview_urls=false。
    # 不持任何钥匙：只认锁屏进门会话，问网关 AuthVerifier.lockSession()（服务绑定 AUTH），不问账号会话（不绑账号 Worker）；
    # 签 / 作废短链钥匙、给打开短链的人换会话问网关 ShareIssuer（服务绑定 ISSUER）。CI 不传任何密值。
    # 部署顺序：账号、短链（互不依赖，可并行）→ 网关 → Pages。短链不绑账号 Worker，所以不再等 deploy-account-worker（needs 里已去掉）；
    # 仍排在网关之前：新短链对旧网关同样能用（lockSession / ShareIssuer 接口没变，旧网关的 ShareIssuer 仍会多验一次账号会话）；
    # 新网关的 ShareIssuer 只验锁屏进门会话。
    # 和网关一样等 status 的健康闸门。
    # 步骤：迁移 D1 styrigx-share（migrations/；失败要让 job 红，不 continue-on-error）
    # → 查 d1_migrations 和表，确认 0001_share_links.sql 真的在库里（只看到 No migrations to apply 不算数）→ 部署 → 冒烟。
    # token：Cloudflare 上 styrigx-share-deploy = GitHub 环境 STYRIGX_SHARE_DEPLOY 里的同名环境密钥 STYRIGX_SHARE_DEPLOY，
    # 权限 Workers Scripts 编辑 + D1 编辑 + Account Settings 读取 + styrigx.com 的 Workers Routes 编辑；环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-status-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_SHARE_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (styrigx-share)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/share
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-share --remote

      - name: Confirm migrations are really in the database (styrigx-share)
        working-directory: workers/share
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          out=$(npx --yes "wrangler@$WRANGLER_VERSION" d1 execute styrigx-share --remote --json --command "SELECT name FROM d1_migrations UNION ALL SELECT 'table:' || name FROM sqlite_master WHERE type = 'table'")
          echo "$out"
          ok=0
          for need in '"0001_share_links.sql"' '"table:share_link"' '"table:share_fail"'; do
            if ! printf '%s' "$out" | grep -q "$need"; then echo "::error::D1 styrigx-share 里没有 $need"; ok=1; fi
          done
          exit $ok

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。第一次部署（Worker 还不存在）/ 灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/share
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy share Worker (styrigx-share)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/share
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Smoke test production (/s/* and /api/share must be served by styrigx-share)
        # 只发不带 cookie 的只读请求，不登录、不写数据（随机码打不开，只算 1 次失败计数）。路由生效可能要几秒，最多重试 6 次。
        run: |
          set -u
          check() { # 路径 期望状态码 期望 X-SGX-Runtime [期望 Location]
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "https://styrigx.com$1" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              loc=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} location=${loc:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "$3" ] && { [ -z "${4:-}" ] || [ "$loc" = "$4" ]; }; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 from $3"; return 1
          }
          ok=0
          # 打不开的短链：统一 302 到锁屏
          check "/s/smoke$(date +%s)xxxxxxxxxxx" 302 share 'https://styrigx.com/?lock=1' || ok=1
          # 管理接口：没会话 401（门）
          check /api/share 401 share || ok=1
          # 网关的接口和页面没被抢走（这时网关可能还是旧版本：这几条新旧网关回答相同）
          check /api/lock-session-check 401 worker || ok=1
          check /settings/ 302 worker || ok=1
          check /settings/security/tempkeys/ 302 worker || ok=1
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/share
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SHARE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

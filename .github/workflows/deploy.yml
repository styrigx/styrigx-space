    # token：Cloudflare 上 styrigx-daymark-core-deploy = GitHub 环境 STYRIGX_DAYMARK_CORE_DEPLOY 里的同名环境密钥 STYRIGX_DAYMARK_CORE_DEPLOY
    # （styrigx-atlas 仓库时用的同一把；权限 Workers Scripts 编辑 + D1 编辑 + styrigx.com 的 Workers Routes 编辑，部署前 Gray 核对）；环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-status-worker, deploy-space-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_DAYMARK_CORE_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (styrigx-daymark-core)
        # 不新增迁移：表结构在 styrigx-atlas 时已迁到最新，这一步应是 No migrations to apply
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_DAYMARK_CORE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/daymark-core
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-daymark-core --remote

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（space/scripts/deploy-rollback.mjs）。记录失败 → 空，只打 warning、不拦部署：空 = 这次失败不自动回滚
        id: live
        continue-on-error: true

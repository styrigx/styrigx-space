name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支推新提交时取消旧的 PR CI；main 的生产部署永不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN 默认只读；本工作流不推代码、不发评论、不建 release
permissions:
  contents: read

env:
  # Hugo 版本与 extended 只在 .github/actions/setup-hugo/action.yml 定义（子站按固定 tag 引用同一个 action）
  NODE_VERSION: '22'
  # 所有 wrangler（npx 和 wrangler-action）用同一个固定版本；升级时只改这里
  WRANGLER_VERSION: '4.152.0'

# 自动回滚（main 部署）：Pages 和 9 个 Worker（合并 PR3 起含 curio-core / daymark-core）的 job 部署前记下线上版本（step id live），部署 / 冒烟 / 部署后核对失败
# 就退回那个版本（space/scripts/deploy-rollback.mjs；Worker 用 wrangler rollback，Pages 用回滚 API），job 照样红。
# 只用各 job 部署本来就用的那把 token，不加 secret、不加权限。第一次部署（没有旧版本）/ 记录失败 → 不回滚，同以前。
# 不回滚：D1 迁移（只进不退，迁移要写成兼容旧代码）、KV 数据（搜索索引）、Secrets Store、路由 / 自定义域名、已部署的其他 job。
# 回滚下限：space/scripts/deploy-rollback-floor.json。线上版本低于下限（网关 / 账号 Worker 是 #226 之前的 KV 版本）就不记、不自动回滚，
# 免得退回读旧 KV 的代码；以后存储改成旧代码读不懂的格式时在那里加一行。
# 健康闸门第二阶段（2026-10-28，space/scripts/health-gate.mjs）：ai 没有公开地址（P4-2 起取代 search / chat），第一阶段只能核对版本换上了。
# status 部署并核对后，等 styrigx-status 在部署之后跑的巡检（D1 styrigx-status 的 status_checks 表，经服务绑定测 ai 的 /healthz），
# 连续 2 次失败（部署前就在失败的不算）→ status job 红：status 自己按原样回滚，rollback-ai-worker
# 用 ai 环境原有的 token 把 ai 退回部署前版本；网关 / Pages / 账号 / 分享都等 status，不会部署。
# 读 D1 用 status 部署本来就有的 token（D1 编辑），不经网关、不开免会话口子、不加 Worker / 子域名 / secret。

jobs:
  # 质量闸门：拆成 6 个并行作业（unit、build、e2e-lock、e2e-sites（按子站 matrix 再分 3 个）、visual、lighthouse）+ 汇总作业 quality（必需检查名不变）。
  # PR 也跑，变绿再合入 main；只有 main 的 push（或 main 上手动触发）才部署。
  unit:
    # 单元测试（workers + ui）。不构建站点、不装浏览器，最先出结果；和其他检查并行，不当前置门（2026-11-04 定）。
    # 固定 ubuntu-24.04：ubuntu-latest 换大版本时字体渲染会变，视觉基线跟着漂
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node + install dependencies (lockfile)
        # Node 22：D1 的真 SQL 测试要 node:sqlite（Node 20 上会整段跳过）。
        # 测试工具（Playwright、stylelint、Lighthouse CI、http-server）都在 devDependencies 里，按 lockfile npm ci
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build CSS
        run: node space/scripts/build-css.cjs --minify

      - name: Unit tests (workers + ui)
        # tests/workers/** 与 tests/space/ui/**（按功能分子目录；引号里的 glob 由 node --test 自己展开，含子目录）的全部单元测试；新加的测试文件自动纳入，不用再改这里。
        # 先确认 node:sqlite 可用：没有它 D1 的真 SQL 测试会静默跳过
        run: |
          node -e "require('node:sqlite')" || { echo "::error::node:sqlite unavailable, D1 SQL tests would be skipped"; exit 1; }
          node --test tests/workers/space-core/*.test.mjs tests/workers/account/*.test.mjs tests/workers/ai/*.test.mjs tests/workers/status/*.test.mjs tests/workers/proxy-rules/*.test.mjs "tests/space/ui/**/*.test.mjs"

  build:
    # 生产构建只做一次（2026-11 合站：主站和三个子站同一个 Hugo 站，一次构建）：打包 dry-run、生成物同步、分层 / 前端守卫、CSP、产物检查、搜索索引、子站单测、站点树检查、路由检查、stylelint。
    # 同一份 space/web/public 上传两次：site-atlas-production（给 e2e-lock）、site-production（给 e2e-sites 与 build-and-deploy），main 另传两份搜索索引。
    # 固定 ubuntu-24.04：ubuntu-latest 换大版本时字体渲染会变，视觉基线跟着漂
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Assert no legacy secret / variable names
        # 旧名字不许回到代码里：名单在 space/scripts/retired-names.json 的 legacy（SGX_ED25519_* → SGX_LOCK_*，SGX_STEPUP_KEY 已删，
        # OWNER_KEY → SGX_ROOT_KEY；账号命名 v2：SGX_ACCOUNT_ROOT_KEY → SGX_ACCOUNT_RECOVERY_KEY，D1_ACCOUNT_AUTH → D1_ACCOUNT）。
        # 账号 Worker / 账号前端的完整退役名单由 check-layers 规则 22 查。不扫 tests/：改名守卫测试里会故意写旧名字；也不扫名单文件本身。
        run: |
          pattern="$(node -e "process.stdout.write(require('./space/scripts/retired-names.json').legacy.join('|'))")"
          test -n "$pattern"
          if grep -rnE "$pattern" --include="*.js" --include="*.mjs" --include="*.cjs" --include="*.html" workers/ space/scripts/ space/web/assets/ space/web/layouts/; then
            echo "::error::legacy secret / variable name found (see above)"
            exit 1
          fi
          echo "OK: no legacy names."

      - name: Setup Hugo (shared action; version + extended defined only in .github/actions/setup-hugo)
        uses: ./.github/actions/setup-hugo

      - name: Setup Node + install dependencies (lockfile)
        # Node 22：D1 的真 SQL 测试要 node:sqlite（Node 20 上会整段跳过）。
        # 测试工具（Playwright、stylelint、Lighthouse CI、http-server）都在 devDependencies 里，按 lockfile npm ci
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build CSS
        run: node space/scripts/build-css.cjs --minify

      - name: Space core Worker bundle check (styrigx-space-core, dry-run)
        # 主站后端代码全在 workers/space-core/src/（进站 v3 L2 起含分享链接）；只打包不部署，import 断了 CI 就红
        working-directory: workers/space-core
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-space-core-dist

      - name: Account Worker bundle check (styrigx-account, dry-run)
        working-directory: workers/account
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-account-dist

      - name: Preview combined entry bundle check (tests/space/e2e/helpers/preview-worker.js, dry-run)
        # passkey-e2e 真实预览的 _worker.js：网关 + 账号 Worker 两边的代码装进一个脚本（账号拆分 PR3）。PR 上走本地模拟器不打包，
        # 这里先打一次，import 断了 PR 就红，不等到 main 的真实预览才发现。只打包不部署。
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" deploy tests/space/e2e/helpers/preview-worker.js --dry-run --outdir /tmp/preview-worker-dist \
            --name sgx-preview-worker-bundle --compatibility-date "$(sed -n 's/^compatibility_date = "\(.*\)"$/\1/p' space/web/wrangler.toml)"
          grep -q "X-SGX-Runtime" /tmp/preview-worker-dist/preview-worker.js
          grep -q "X-Styrigx-Space-Session" /tmp/preview-worker-dist/preview-worker.js

      - name: AI Worker bundle check (styrigx-ai, dry-run)
        working-directory: workers/ai
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-ai-dist

      - name: Status Worker bundle check (styrigx-status, dry-run)
        working-directory: workers/status
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-status-dist

      - name: Proxy rules Worker bundle check (styrigx-proxy-rules, dry-run)
        working-directory: workers/proxy-rules
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-proxy-rules-dist

      - name: Curio core Worker bundle check (styrigx-curio-core, dry-run)
        # 子站接口 Worker（2026-11-02 从 styrigx-atlas 搬来；合并 PR3 起由本工作流 deploy-curio-core / deploy-daymark-core 部署）
        working-directory: workers/curio-core
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-curio-core-dist

      - name: Daymark core Worker bundle check (styrigx-daymark-core, dry-run)
        working-directory: workers/daymark-core
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/styrigx-daymark-core-dist

      - name: Shared shell derived files in sync (palette-roles / input.css @shell / shell-nav)
        # 2026-11 合站：子站直接用主站的外壳源文件（没有副本、没有 sync-shell）；gen-shell 只生成派生文件，改了源头忘了重新生成 → 红
        run: node space/scripts/gen-shell.mjs --check

      - name: Palettes in sync (input.css @gen-palettes ← palette 定义)
        run: node space/scripts/gen-palettes.mjs --check

      - name: UI cookie contract in sync (tests/fixtures/ui-cookie-contract.json)
        run: node space/scripts/gen-ui-cookie-contract.mjs --check

      - name: Layer boundary check (SGX 3.0 分层规范)
        # 依赖方向（docs/architecture/overview.md）：前端 lib ← auth ← shell ← apps ← entries；lib 不含鉴权接口；
        # Worker 之间：每个 Worker 只 import 自己目录下的文件，没有 workers/shared；网关不许出现账号鉴权标识；账号 Worker 不许有路由（规则 14–17）；Worker 骨架防回退（规则 18–21，见 workers/README.md）；
        # 相对 import 解析不到文件也算失败；前端禁止 sgx-space-session（cookie 名）/sgx-lock-shown；禁止用 storage 存解锁状态
        run: node space/scripts/check-layers.mjs

      - name: Frontend guard (无原生弹窗 / 无废弃 token 变量)
        # assets/js/ 和 shared/shell/ 禁止 prompt/confirm/alert（裸调用、window./globalThis./self./top.、window['alert']），禁止独立 token 变量（已废弃的内存鉴权 token 机制）
        run: node space/scripts/check-frontend.mjs

      - name: Build site (生产构建，锁屏启用；主站 + blog / curio / daymark 同一次构建)
        # 这一份就是要上线的 Pages 产物（main 上传 artifact 给 build-and-deploy / deploy-ai-worker 复用，不再各自重建），
        # 所以和以前 Pages job 一样带构建 SHA。2026-11 合站：一个 Hugo 站（space/web/hugo.yaml），子站在 /blog/ /curio/ /daymark/ 下，
        # 产物就是 space/web/public/，不再各站单独构建、不再拼树（dist/site）
        id: prod
        run: hugo --minify -s space/web
        env:
          SGX_BUILD_SHA: ${{ github.sha }}

      - name: CSP hashes in sync (内联脚本 sha256 ← 生产构建；space/web/static/_headers 安全头 ← security-headers.js)
        # 改了模板里的内联脚本就要重新生成：hugo --minify -s space/web && node space/scripts/gen-csp.mjs
        run: node space/scripts/gen-csp.mjs --check

      - name: 前端技术名词检查（生产构建的 HTML 里不许出现后端变量名）
        # 用户可见文案不得出现后端变量名（名单在 space/scripts/retired-names.json 的 html：OWNER_KEY / SESSION_SECRET / SGX_ROOT_KEY /
        # SGX_SPACE_RECOVERY_KEY / SGX_ACCOUNT_ROOT_KEY / SGX_ACCOUNT_RECOVERY_KEY / SGX_ACCOUNT_PASSWORD_PEPPER / SGX_SPACE_PASSWORD_PEPPER / TURNSTILE_SECRET）；
        # 后端变量名只许出现在 workers/ 与注释里，不许进 space/web/public/ HTML。
        # 2026-11 合站：只查主站页面（子站 /blog/ /curio/ /daymark/ 不在范围里，同合站前；博客白皮书正文会如实写这些名字）
        run: |
          pattern="$(node -e "process.stdout.write(require('./space/scripts/retired-names.json').html.join('|'))")"
          test -n "$pattern"
          if grep -rlE "$pattern" space/web/public/ --include="*.html" | grep -vE '^space/web/public/(blog|curio|daymark)/'; then
            echo "FAIL: 技术变量名出现在 HTML 产物中"
            exit 1
          fi
          echo "OK: HTML 产物无技术变量名"

      - name: Check production build artifacts (Pages 需要的产物都在)
        # 下面上传的就是这份；_worker.js（pages.dev → styrigx.com 跳转，不能带网关代码）、_headers（含 CSP）、_redirects
        run: |
          for f in _worker.js _headers _redirects index.html; do test -s "space/web/public/$f" || { echo "::error::space/web/public/$f missing"; exit 1; }; done
          grep -q "styrigx.com" space/web/public/_worker.js
          if grep -q "X-SGX-Runtime" space/web/public/_worker.js; then echo "::error::gateway bundle in production Pages build"; exit 1; fi
          grep -q "Content-Security-Policy" space/web/public/_headers

      - name: Upload main-site production build (for e2e-lock)
        # 锁屏 / 边缘 / 基线截图测的就是这一份生产构建（e2e-lock 下载到原路径，不重建）
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-atlas-production
          path: space/web/public/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Build search index (site:space, from the production build)
        # PR 上也跑（不需密钥、几秒）：#217 只在 main 跑这步，输出目录不存在的问题合并后才暴露
        run: |
          node space/scripts/build-search-index.mjs --out "$RUNNER_TEMP/search-index/search-space.json"
          test -s "$RUNNER_TEMP/search-index/search-space.json"

      - name: Subsite unit tests (blog / curio / daymark pages + curio-core / daymark-core)
        # 页面（网址、模板、锁屏同步、外观继承、共享外壳副本）+ 接口 Worker（node:sqlite 真跑 D1 的 SQL）+ 博客搜索索引
        run: npm run test:sites

      - name: Check site tree (根文件只在域名根、三站都在、子站 /js/ 带指纹、/curio/ /daymark/ 和根上没有多余图片)
        # 2026-11 合站前这一步查拼好的 dist/site；合站后同样的断言直接查生产构建 space/web/public
        run: |
          set -u
          T=space/web/public
          fail() { echo "::error::$1"; exit 1; }
          for f in _worker.js _headers _redirects index.html 404.html robots.txt; do test -s "$T/$f" || fail "$T/$f missing"; done
          grep -q "'styrigx.com'" "$T/_worker.js" || fail "_worker.js host is not styrigx.com"
          if grep -q "X-SGX-Runtime" "$T/_worker.js"; then fail "gateway bundle in production Pages build"; fi
          grep -q "Content-Security-Policy" "$T/_headers" || fail "_headers lost the security headers"
          for s in blog curio daymark; do
            for f in index.html zh/index.html 404.html zh/404.html; do test -s "$T/$s/$f" || fail "$T/$s/$f missing"; done
            for f in _worker.js _headers _redirects robots.txt; do test ! -e "$T/$s/$f" || fail "$T/$s/$f must not exist (root-only file)"; done
            grep -q "^/$s/js/\*$" "$T/_headers" || fail "_headers has no /$s/js/* cache rule"
          done
          # 子站 /js/ 引用都带内容指纹（_headers 给它们一年 immutable）
          refs=$(grep -rhoE 'src="?/(blog|curio|daymark)/js/[a-zA-Z0-9_./-]+\.js' "$T/blog" "$T/curio" "$T/daymark" | sort -u || true)
          bad=$(echo "$refs" | grep -vE '\.[0-9a-f]{8,}\.(js|mjs)$' | grep -v '^$' || true)
          [ -z "$bad" ] || fail "unversioned subsite /js/ refs: $bad"
          # 图片一律要过会话（2026-10-29）：/curio/ /daymark/ 一张都不许有；根上只许主站已有的 /images/ /avatar/ /fav/ og.png favicon.*
          IMG='\.(png|apng|jpe?g|jfif|pjpeg|pjp|gif|webp|avif|svgz?|ico|cur|bmp|tiff?|heic|heif|jxl)$'
          bad=$(find "$T" -type f ! -path "$T/blog/*" | grep -iE "$IMG" | grep -vE "^$T/(images|avatar|fav)/|^$T/(og\.png|favicon\.ico|favicon\.svg)$" || true)
          [ -z "$bad" ] || fail "image files outside /blog/ and the main-site image dirs: $bad"
          # 合并 PR3：子站和主站同在 styrigx.com，产物里不许再有旧图志域名（跨站链接、接口地址都是相对路径）；
          # P4-3 PR-1 起该域名已下线（_worker.js 的注释也不再提它），一个文件都不许有
          bad=$(grep -rlI 'atlas\.styrigx\.com' "$T" || true)
          [ -z "$bad" ] || fail "atlas.styrigx.com still hardcoded in the site tree: $bad"
          # 合站单测的真实构建一组（Unit tests 那一步还没构建，跳过了；这里补跑）
          node --test tests/space/ui/build/one-site.test.mjs
          # P4-3 PR-4b：旷野合并的产物断言（没有 settings/ 目录、HTML 无旧设置层 href、新地址都在、git grep 只剩历史文档），要构建之后才跑得全
          node --test tests/space/ui/build/space-merge.test.mjs
          echo "OK: site tree $(find "$T" -type f | wc -l) files"

      - name: Blog search index builds (site:blog)
        # 每个分支都跑：网址和构建产物对不上 / 0 篇文章 → 红。只写 RUNNER_TEMP，不进 space/web/public（含 private 文章，不随 Pages 发出去）。
        # 合并 PR3 起 main 上传，P4-2 起由 deploy-ai-worker 写进 KV site:blog（styrigx-atlas 仓库不再写）
        run: |
          node space/scripts/blog/build-search-index.mjs --out "$RUNNER_TEMP/search-index/search-blog.json"
          test -s "$RUNNER_TEMP/search-index/search-blog.json"

      - name: Upload production site (for e2e-sites and build-and-deploy)
        # 生产构建 space/web/public（2026-11 合站后就是整棵树）：e2e-sites 测的、build-and-deploy 部署的是同一份（PR 也上传，给 e2e-sites）
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-production
          path: space/web/public/
          if-no-files-found: error
          retention-days: 1

      - name: Upload search index (for deploy-ai-worker)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: search-index-space
          path: ${{ runner.temp }}/search-index/search-space.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload blog search index (for deploy-ai-worker, site:blog)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: search-index-blog
          path: ${{ runner.temp }}/search-index/search-blog.json
          if-no-files-found: error
          retention-days: 1

      - name: Check worker routes (每个页面都过网关；账号 Worker 没有路由，账号路径在网关转发表里)
        run: node space/scripts/check-worker-routes.mjs

      - name: Subsite generated files in sync (curio seed SQL, blog code tokens)
        # curio：workers/curio-core/migrations/0002_seed.sql ← space/scripts/curio/data/seed.json；blog：code-tokens.css ← 色彩角色。
        # 2026-11 合站：子站直接用主站的外壳源文件，没有副本和 sgx-shell.lock.json，不再核对 sync-shell
        run: |
          node space/scripts/curio/gen-seed-sql.mjs --check
          node space/scripts/blog/gen-code-tokens.mjs --check

      - name: stylelint（禁止硬编码颜色）
        run: npx stylelint --config tests/config/stylelintrc.json "space/web/assets/css/input.css"

  e2e-lock:
    # 锁屏、边缘、锁屏基线截图、凭证接口、lock-gate 关。测 build 上传的主站生产构建。
    # 前一步红了后面照跑（if: !cancelled()），一轮看全；job 照样红，不用 continue-on-error。
    needs: build
    # 固定 ubuntu-24.04：ubuntu-latest 换大版本时字体渲染会变，视觉基线跟着漂
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Hugo (shared action; version + extended defined only in .github/actions/setup-hugo)
        uses: ./.github/actions/setup-hugo

      - name: Setup Node + install dependencies (lockfile)
        # Node 22：D1 的真 SQL 测试要 node:sqlite（Node 20 上会整段跳过）。
        # 测试工具（Playwright、stylelint、Lighthouse CI、http-server）都在 devDependencies 里，按 lockfile npm ci
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Playwright Chromium + CJK fonts (shared action, cached)
        # 视觉回归对比中文截图；默认中文字体与基线生成环境（Noto Sans CJK）不一致会有 1-2% 像素漂移。
        # 浏览器按 lockfile 的 @playwright/test 版本缓存；字体缓存 apt 候选版本的 .deb，渲染与直接 apt 安装逐字节一致
        uses: ./.github/actions/setup-playwright
        with:
          cjk-fonts: 'true'

      - name: Build CSS
        run: node space/scripts/build-css.cjs --minify

      - name: Download site-atlas-production
        id: prod
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: site-atlas-production
          path: space/web/public/

      - name: Lock screen tests (生产构建，锁屏启用；含 lock-flags 的 lock-gate 开)
        if: ${{ !cancelled() && steps.prod.outcome == 'success' }}
        # 截图基线在下一步单独跑
        run: SGX_TEST_SUITE=lock npx playwright test --config=tests/config/playwright.config.js --grep-invert "baseline screenshot"

      - name: Edge flow e2e（真实网关 + 线上路由规则 + 真实域名 + 虚拟认证器）
        if: ${{ !cancelled() && steps.prod.outcome == 'success' }}
        # 生产构建；本地 HTTPS 代理把 styrigx.com（含 /blog/ /daymark/ 子站前缀）接到真实网关代码，路由按 wrangler.toml + 线上匹配规则
        run: SGX_TEST_SUITE=edge npx playwright test --config=tests/config/playwright.config.js

      - name: Lock screen baseline screenshot
        # 2026-11 UI 重设计 PR-1：旧截图基线已删除，新精简基线重拍前这一步跳过（lock.spec.js 里 SHOTS = false 也不比截图）；重拍时改回下面这行条件
        # if: ${{ !cancelled() && steps.prod.outcome == 'success' }}
        if: ${{ false }}
        run: SGX_TEST_SUITE=lock npx playwright test --config=tests/config/playwright.config.js --grep "baseline screenshot"

      - name: Credential API e2e（真实 handler + 内存 D1，自带测试服务器）
        if: ${{ !cancelled() }}
        # 锁屏密码 / 锁屏通行密钥 / 账号密码 / 账号通行密钥的真请求；不需要 Hugo 构建
        run: SGX_TEST_SUITE=credential npx playwright test --config=tests/config/playwright.config.js

      - name: Lock flags test (lock-gate off)
        if: ${{ !cancelled() && steps.prod.outcome == 'success' }}
        # lock-gate 关：锁屏完全不出现（要单独构建；会覆盖 space/web/public，所以放最后）
        run: |
          SGX_TEST_LOCK_GATE=0 hugo --minify -s space/web
          SGX_TEST_SUITE=lock SGX_TEST_FLAGS=gate-off npx playwright test --config=tests/config/playwright.config.js lock-flags.spec.js

      - name: Upload lock test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lock-test-results
          path: |
            test-results/
            playwright-report/

  e2e-sites:
    # blog / curio / daymark 的 Playwright，对着 build 上传的生产构建（site-production = space/web/public，2026-11 合站后主站和三站同一棵树）。
    # 三个子站拆成 matrix 三个并行 job（之前是一个 job 里串行三步，约 3.5 分钟）；fail-fast 关掉，一站红了其余照跑。
    # job 名仍是 e2e-sites（quality 的 needs 不变），GitHub 上显示为 e2e-sites (blog) / (curio) / (daymark)
    needs: build
    # 固定 ubuntu-24.04：ubuntu-latest 换大版本时字体渲染会变，视觉基线跟着漂
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: blog
            # 视觉基线 tests/blog/e2e/blog-visual.spec.js-snapshots 来自 styrigx-atlas（Playwright 1.64.1，Chromium 1248 与本仓 1.64.0 同一版本）；
            # 有像素差就走 update-snapshots.yml（同 runner、同字体 action）重生成
            config: tests/blog/config/playwright.config.js
          - site: curio
            config: tests/curio/config/playwright.e2e.config.js
          - site: daymark
            config: tests/daymark/config/playwright.e2e.config.js
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node + install dependencies (lockfile)
        # Node 22：D1 的真 SQL 测试要 node:sqlite（Node 20 上会整段跳过）。
        # 测试工具（Playwright、stylelint、Lighthouse CI、http-server）都在 devDependencies 里，按 lockfile npm ci
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Playwright Chromium + CJK fonts (shared action, cached)
        # 视觉回归对比中文截图；默认中文字体与基线生成环境（Noto Sans CJK）不一致会有 1-2% 像素漂移。
        # 浏览器按 lockfile 的 @playwright/test 版本缓存；字体缓存 apt 候选版本的 .deb，渲染与直接 apt 安装逐字节一致
        uses: ./.github/actions/setup-playwright
        with:
          cjk-fonts: 'true'

      - name: Download site-production
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: site-production
          path: space/web/public/

      - name: Subsite Playwright - ${{ matrix.site }} (against space/web/public)
        # 对着生产构建 space/web/public（space/scripts/blog/serve-static.mjs 模拟 Pages 回静态文件），博客在 /blog/ 下
        run: npx playwright test --config=${{ matrix.config }}

      - name: Upload subsite test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          # 每站一份，名字不能撞（同一 run 里 artifact 名唯一）
          name: subsite-test-results-${{ matrix.site }}
          path: |
            tests/${{ matrix.site }}/test-results/
            tests/${{ matrix.site }}/playwright-report/
            tests/${{ matrix.site }}/config/test-results/
            test-results/
          retention-days: 30

  visual:
    # 视觉回归 + 布局断言（默认组，阻塞），测试构建（锁屏禁用）。不等 build，自己构建。
    # 分 2 片并行（2026-11-04）：显示为 visual (1)、visual (2)；每片自己做测试构建（几十秒，比多一个串行构建作业再传产物快）。
    # fail-fast: false：一片红了另一片照跑完，一轮看全。quality 的 needs.visual.result 是两片的合并结果，任一片非 success 即非 success。
    # 切法：Playwright 按用例顺序连续切；默认组没开 fullyParallel（avatar-edit.spec.js 两条用例共用同一个临时文件，并行会互相覆盖），按文件成组。
    # 截图基线路径与分片无关，分片不重新生成任何基线。
    # 固定 ubuntu-24.04：ubuntu-latest 换大版本时字体渲染会变，视觉基线跟着漂
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Hugo (shared action; version + extended defined only in .github/actions/setup-hugo)
        uses: ./.github/actions/setup-hugo

      - name: Setup Node + install dependencies (lockfile)
        # Node 22：D1 的真 SQL 测试要 node:sqlite（Node 20 上会整段跳过）。
        # 测试工具（Playwright、stylelint、Lighthouse CI、http-server）都在 devDependencies 里，按 lockfile npm ci
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Playwright Chromium + CJK fonts (shared action, cached)
        # 视觉回归对比中文截图；默认中文字体与基线生成环境（Noto Sans CJK）不一致会有 1-2% 像素漂移。
        # 浏览器按 lockfile 的 @playwright/test 版本缓存；字体缓存 apt 候选版本的 .deb，渲染与直接 apt 安装逐字节一致
        uses: ./.github/actions/setup-playwright
        with:
          cjk-fonts: 'true'

      - name: Build CSS
        run: node space/scripts/build-css.cjs --minify

      - name: Rebuild for visual / Lighthouse (测试构建，锁屏禁用)
        # 视觉回归和 Lighthouse 用锁屏禁用的构建，避免锁屏干扰
        id: testbuild
        run: hugo --minify -s space/web
        env:
          SGX_TEST_NO_LOCK: "1"
          # 测试构建禁用天气组件（依赖外网，CI 不稳定会让 Lighthouse errors-in-console 误报）；生产构建绝不设置
          SGX_TEST_NO_WEATHER: "1"

      - name: Visual regression + layout assertions (默认组，阻塞)
        if: ${{ !cancelled() && steps.testbuild.outcome == 'success' }}
        # 默认 testMatch 已含 visual / pc-layout / layout-292 等全部默认 spec，失败即 CI 红。按 matrix.shard 只跑其中一片。
        # 不要再给这一步加 continue-on-error。
        run: npx playwright test --config=tests/config/playwright.config.js --shard=${{ matrix.shard }}/2

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          # 按片命名：两片同名会撞（upload-artifact v4+ 不许同名覆盖）
          name: visual-diff-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  lighthouse:
    # Lighthouse CI，测试构建（锁屏禁用）。单独一个作业：仓库公开、Actions 分钟免费，取墙钟短的（2026-11-04 定）。
    # 固定 ubuntu-24.04：ubuntu-latest 换大版本时字体渲染会变，视觉基线跟着漂
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Hugo (shared action; version + extended defined only in .github/actions/setup-hugo)
        uses: ./.github/actions/setup-hugo

      - name: Setup Node + install dependencies (lockfile)
        # Node 22：D1 的真 SQL 测试要 node:sqlite（Node 20 上会整段跳过）。
        # 测试工具（Playwright、stylelint、Lighthouse CI、http-server）都在 devDependencies 里，按 lockfile npm ci
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Playwright Chromium + CJK fonts (shared action, cached)
        # 视觉回归对比中文截图；默认中文字体与基线生成环境（Noto Sans CJK）不一致会有 1-2% 像素漂移。
        # 浏览器按 lockfile 的 @playwright/test 版本缓存；字体缓存 apt 候选版本的 .deb，渲染与直接 apt 安装逐字节一致
        uses: ./.github/actions/setup-playwright
        with:
          cjk-fonts: 'false'

      - name: Build CSS
        run: node space/scripts/build-css.cjs --minify

      - name: Rebuild for visual / Lighthouse (测试构建，锁屏禁用)
        # 视觉回归和 Lighthouse 用锁屏禁用的构建，避免锁屏干扰
        id: testbuild
        run: hugo --minify -s space/web
        env:
          SGX_TEST_NO_LOCK: "1"
          # 测试构建禁用天气组件（依赖外网，CI 不稳定会让 Lighthouse errors-in-console 误报）；生产构建绝不设置
          SGX_TEST_NO_WEATHER: "1"

      - name: Lighthouse CI
        if: ${{ !cancelled() && steps.testbuild.outcome == 'success' }}
        # lhci 自己起服务（见 tests/config/lighthouserc.json 的 startServerCommand）；gzip 模拟线上 Cloudflare 压缩
        run: |
          find space/web/public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec gzip -k -9 {} \;
          npx lhci autorun --config=tests/config/lighthouserc.json

  quality:
    # 汇总：分支保护的必需检查名仍是 quality（仓库设置不动）。6 个作业都 success 才绿；任何一个失败 / 取消 / 跳过都红。
    # visual 是 2 片 matrix：needs.visual.result 是两片合并后的结论（任一片失败 / 取消即非 success），这里不用改。
    # 部署作业照旧 needs: quality，所以也照旧等全部检查。
    if: ${{ always() }}
    needs: [unit, build, e2e-lock, e2e-sites, visual, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All quality jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e '
            const n = JSON.parse(require("fs").readFileSync(0, "utf8"));
            let bad = 0;
            for (const [job, v] of Object.entries(n)) {
              console.log(`${job}: ${v.result}`);
              if (v.result !== "success") bad++;
            }
            if (bad) { console.log(`::error::${bad} quality job(s) not successful`); process.exit(1); }
          '

  passkey-e2e:
    # WebAuthn 虚拟认证器 + 真实网关代码的 E2E（tests/space/e2e/passkey/passkey.spec.js、account-passkey.spec.js）。生产部署的所有 job 都等它通过。
    # 按事件分两条路（job 名不变：passkey-e2e 是分支保护的必需检查，结论就是这个 job 的结论）：
    # - pull_request：本地模拟器 tests/space/e2e/helpers/preview-emulator.cjs——同一个组合入口 tests/space/e2e/helpers/preview-worker.js
    #   （网关 workers/space-core/src/app.js + 账号 Worker 命名入口的实现，账号拆分 PR3；SGX_ENV=preview），
    #   D1 是 node:sqlite 内存库（网关 2026-10-27 起不绑 KV）、Cloudflare D1 / KV REST 也由它在本机模拟；env.ASSETS 读本步骤构建的 space/web/public。
    #   不用任何 Cloudflare secret、不部署预览、不清预览 D1 / 不跑 D1 迁移。
    # - push 到 main、workflow_dispatch：真实预览部署 passkey-e2e.styrigx-space.pages.dev + 预览 D1（下面带
    #   github.event_name != 'pull_request' 的步骤，和改动前一样）。模拟器测不到真实 D1、Pages 打包和真实绑定，
    #   所以 PR 的通过不顶替真实预览：main 的每次 push（只改文档 / 样式的除外）照跑真实预览，不再复用 PR 运行的结果。
    # 两条路都只用每次运行在 runner 上现生成的测试凭证（进站凭证、账号根密钥、pepper；真实预览另加 Ed25519 钥匙对），绝不用生产 secret，也不存 GitHub Secrets。
    # 真实预览只用仓库级的 CLOUDFLARE_ACCOUNT_ID 与 STYRIGX_SPACE_PAGES_DEPLOY（部署预览、写预览 D1）。
    # 外部 fork 的 PR 不跑（同仓库分支的 PR 照跑）。
    # 不等 quality（2026-11-04 CI 拆分）：两条路都自己构建，不用 quality 的产物；GitHub 的 needs 不能按事件区分，所以 main 上也不等。
    # 部署作业照旧同时 needs quality 和 passkey-e2e，没过检查的提交仍然不会上线；main 上只是共享预览可能在 quality 出结果前先部署（测试凭证、预览 D1，不碰生产）。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # 真实预览共用一个预览别名、一个预览 D1：main / 手动运行全仓库同时只跑一个，排队不取消。
    # PR 走本地模拟器，不碰共享预览，不用排进这个队（按 PR 的 ref 分组；同一 PR 的新提交由 workflow 级 concurrency 取消旧运行）。
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('passkey-e2e-emulator-{0}', github.ref) || 'passkey-e2e-preview' }}
      cancel-in-progress: false
    # 配额：2026-10-27 起网关和这组用例都不再用 KV（免费计划 KV 写 / 删 / 列各 1000 次 / 天、全账号共用，以前一次运行要花 ~90 写 ~50 删）；
    # D1 按行计、额度大得多（tests/space/e2e/helpers/preview-emulator.cjs 的 /__kv/stats d1 一栏可量）。仍然：
    # - PR 运行全部走本地模拟器，不碰 Cloudflare；
    # - 本次改动全部是文档 / 内容文字 / CSS / 视觉基线 / 图片，就不跑用例（也不部署预览），job 以成功结束（steps.scope）。
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Change scope (docs / content text / CSS / baselines only → skip the E2E)
        id: scope
        # 路径过滤做在步骤层，不用 workflow 级 paths：这个 job 照样启动、以成功结束，分支保护的必需检查不会一直挂着。
        # 反着写（denylist）：只有本次改动的文件「全部」属于下面几类才跳过，其余任何改动都照跑——
        #   *.md（文档、README；space/web/content 另算，见下）、*.css（space/web/assets/css/ 样式源等）、
        #   tests/**/*-snapshots/*.png（视觉基线）、图片（png / jpg / jpeg / webp / gif / avif / svg / ico）、
        #   space/web/content/*.md 只改 title / linkTitle / description / summary / keywords（这里的页面只有 front matter，
        #   url / layout 决定路由，E2E 正好走这些页面，改了就照跑；新增页面也照跑）。
        # 照跑名单优先于上面的跳过规则：.github/**（workflow 本身）、package.json、package-lock.json、space/web/shared/**、
        #   space/web/assets/js/**（含 shell/）、网关内核 workers/space-core/src/core/**、src/lib/**（原 _kernel/**）。删除、类型变化也一律照跑。
        # PR 比 base...head（合并基点起 PR 自己的改动）；push 直接比 before 和 after 两棵树（快进时等同 before...after，
        # 强推时把被覆盖掉的改动也算进来）；before 全零（新分支）、workflow_dispatch、拿不到 SHA、fetch / diff 出错、空 diff 都照跑。
        # 本步意外报错也不拦：continue-on-error，拿不到 docs_only=true 就照跑。
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          # 结论写 docs_only=true|false；任何拿不准（事件不对、SHA 缺失 / 全零、fetch / diff 出错、空 diff）都按 false 照跑
          verdict() { echo "docs_only=$1" >> "$GITHUB_OUTPUT"; echo "docs_only=$1: $2"; exit 0; }
          zero='^0+$'
          case "$EVENT" in
            pull_request) a="$PR_BASE"; b="$PR_HEAD" ;;
            push) a="$PUSH_BEFORE"; b="$PUSH_AFTER" ;;
            *) verdict false "event $EVENT: always run" ;;
          esac
          if [ -z "$a" ] || [ -z "$b" ] || [[ "$a" =~ $zero ]] || [[ "$b" =~ $zero ]]; then
            verdict false "no usable base ($a...$b, e.g. a new branch): run"
          fi
          # 只要提交和目录树（blob:none），不下文件内容；space/web/content 要比对 front matter 时 git 按需补那几个文件
          # checkout 是 depth 1 的浅克隆：先补全历史（否则 base 或 head 正好是浅边界时找不到合并基点）
          deepen=(); [ "$(git rev-parse --is-shallow-repository)" = true ] && deepen=(--unshallow)
          git fetch --no-tags --quiet --filter=blob:none "${deepen[@]}" origin "$a" "$b" || verdict false "fetch $a / $b failed: run"
          if [ "$EVENT" = pull_request ]; then
            # PR：base...head，只看 PR 自己的改动（从合并基点起）
            from="$(git merge-base "$a" "$b")" || verdict false "no merge base: run"
          else
            # push：before 和 after 两棵树直接比（快进时等于 before...after；强推时把被覆盖掉的改动也算进来）
            from="$a"
          fi
          changes="$(git diff --name-status --no-renames "$from" "$b")" || verdict false "git diff failed: run"
          [ -n "$changes" ] || verdict false "empty diff: run"
          # front matter 去掉只影响显示文字的键（title / linkTitle / description / summary / keywords），剩下的（url、layout、aliases、type…）有变就照跑
          fm() {
            git show "$1:$2" | awk '
              NR == 1 { if ($0 != "---") { print "NO-YAML-FRONT-MATTER"; exit } next }
              $0 == "---" { exit }
              /^(title|linkTitle|description|summary|keywords):/ { next }
              { print }'
          }
          n=0
          while IFS=$'\t' read -r st f; do
            n=$((n + 1))
            case "$f" in
              # 照跑名单优先于下面的跳过规则（workflow 自身、依赖、共享外壳、前端 JS、网关内核 src/core/、src/lib/）
              .github/* | package.json | package-lock.json | space/web/shared/* | space/web/assets/js/* | workers/space-core/src/core/* | workers/space-core/src/lib/*)
                verdict false "$f: always run" ;;
            esac
            [ "$st" = M ] || [ "$st" = A ] || verdict false "$st $f (deleted / type change): run"
            case "$f" in
              space/web/content/*.md)
                [ "$st" = M ] || verdict false "A $f (new page / route): run"
                if ! old="$(fm "$from" "$f")" || ! new="$(fm "$b" "$f")"; then verdict false "$f: cannot read front matter: run"; fi
                if [ "$old" != "$new" ] || [ "$new" = NO-YAML-FRONT-MATTER ]; then
                  verdict false "$f: front matter beyond title / description changed: run"
                fi ;;
              tests/*-snapshots/*.png) ;;
              *.md | *.css) ;;
              *.png | *.jpg | *.jpeg | *.webp | *.gif | *.avif | *.svg | *.ico) ;;
              *) verdict false "$f: run" ;;
            esac
          done <<< "$changes"
          verdict true "all $n changed file(s) are docs / content text / CSS / baselines / images: skip passkey E2E"

      - name: Decide whether to run the E2E
        id: gate
        # 跑 = 不是「只改文档 / 样式」。下面的步骤都只认这一个输出（再按事件分模拟器 / 真实预览）。
        # 不再有「同一棵树的 PR 运行已通过就跳过 main」：PR 现在测的是本地模拟器，不能顶替 main 上的真实预览。
        env:
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "skip: docs / content text / CSS / baselines only"
          elif [ "$EVENT" = pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "run passkey-e2e on the local emulator (pull_request)"
          else echo "run=true" >> "$GITHUB_OUTPUT"; echo "run passkey-e2e on the real preview ($EVENT)"; fi

      - name: Require Cloudflare secrets
        # 只检查仓库级的 Cloudflare 账号 id 和 Pages 部署 token；缺了直接红，不许 e2e 整组静默跳过还算通过。
        # 预览测试凭证不是 secret，下面「Generate preview test credentials」每次现生成。
        # PR 走本地模拟器，不用 Cloudflare secret，不检查。
        if: github.event_name != 'pull_request'
        env:
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_PAGES_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY != '' }}
        run: |
          ok=0
          for v in HAS_ACCOUNT HAS_PAGES_TOKEN; do
            if [ "${!v}" != "true" ]; then echo "::error::missing secret for $v"; ok=1; fi
          done
          exit $ok

      - name: Setup Node
        # 提前到这里：下面的清预览 D1 用 node 跑 space/scripts/kv-budget.mjs（ESM）。
        # 模拟器的 D1 要 node:sqlite（Node 22 起有）
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Generate preview test credentials (CI only)
        if: steps.gate.outputs.run == 'true'
        # 预览站的测试进站凭证（网关 SGX_SPACE_RECOVERY_KEY）、测试恢复密钥（账号 Worker SGX_ACCOUNT_RECOVERY_KEY，两把不同）、
        # 锁屏密码 pepper（网关 SGX_SPACE_PASSWORD_PEPPER）和账号密码 pepper（账号 Worker SGX_ACCOUNT_PASSWORD_PEPPER，命名 v2 起分开）：
        # 每次运行新生成，只给这次的预览（PR：本地模拟器）用，和下面的 Ed25519 测试钥匙对一样不进仓库、不存 GitHub Secrets。
        # 根密钥只要求去空白后非空（两边 lib/crypto.js normalizeSpaceKey），这里用 32 字节随机数的 hex（64 个字符，无空白、无特殊字符）。
        # 先 ::add-mask:: 再写进 $GITHUB_ENV，后面各步骤的日志里都打码。
        run: |
          space_key="$(openssl rand -hex 32)"
          recovery_key="$(openssl rand -hex 32)"
          pepper="$(openssl rand -hex 32)"
          account_pepper="$(openssl rand -hex 32)"
          test "${#space_key}" -eq 64 && test "${#recovery_key}" -eq 64 && test "${#pepper}" -eq 64 && test "${#account_pepper}" -eq 64
          test "$space_key" != "$recovery_key" && test "$pepper" != "$account_pepper"
          echo "::add-mask::$space_key"
          echo "::add-mask::$recovery_key"
          echo "::add-mask::$pepper"
          echo "::add-mask::$account_pepper"
          {
            echo "PREVIEW_TEST_SPACE_KEY=$space_key"
            echo "PREVIEW_TEST_RECOVERY_KEY=$recovery_key"
            echo "PREVIEW_TEST_PW_PEPPER=$pepper"
            echo "PREVIEW_TEST_ACCOUNT_PEPPER=$account_pepper"
          } >> "$GITHUB_ENV"
          echo "preview test space key / recovery key / peppers generated (preview only)"

      - name: Reset preview D1 (state that would change this run)
        # 每次运行换了两把根密钥、pepper 和 Ed25519 钥匙对。2026-10-27 起网关的认证状态全部在 D1（不再绑定 KV），
        # 开跑前只清预览 D1（测试专用库 styrigx-test-preview）里会改变本次起始状态的表（space/scripts/kv-budget.mjs RESET_D1_TABLES）：
        # 密码、通行密钥（「锁屏 / 账号都未设置」）和输错计数（attempt_limit：会 429）。网关和账号的预览表同库同名、按 realm 列分开，一起清。
        # 纪元、user handle、审计、challenge、临时钥匙、设备、重置开关不清：旧会话 / 票都是旧钥匙签的、验签先失败，
        # 其余只是过期就不认的行，不改变任何断言的前提（逐条理由见 space/scripts/kv-budget.mjs）。
        # 库 id 只认 space/web/wrangler.toml [env.preview] 的 D1_SPACE，且断言它不是正式网关的库。D1 REST 要这个 token 有 D1 编辑。
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
        run: node space/scripts/kv-budget.mjs reset-preview

      - name: Setup Hugo (shared action; version + extended defined only in .github/actions/setup-hugo)
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-hugo

      - name: Install dependencies (lockfile)
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Playwright Chromium (shared action, browser cache keyed by lockfile version)
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Build CSS
        if: steps.gate.outputs.run == 'true'
        run: node space/scripts/build-css.cjs --minify

      - name: Build site
        if: steps.gate.outputs.run == 'true'
        run: hugo --minify -s space/web

      - name: Start local preview emulator (pull_request only)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        # tests/space/e2e/helpers/preview-emulator.cjs：仓库里的组合入口（不打包，直接 import tests/space/e2e/helpers/preview-worker.js：网关 + 账号 Worker）+
        # node:sqlite 的 D1 + 本机的 Cloudflare D1 / KV REST；env.ASSETS 读上面构建的 space/web/public。Ed25519 钥匙对由它自己现生成。
        # 密钥 / pepper 用本次生成的 PREVIEW_TEST_SPACE_KEY / PREVIEW_TEST_RECOVERY_KEY / PREVIEW_TEST_PW_PEPPER / PREVIEW_TEST_ACCOUNT_PEPPER（已打码）。固定端口 8788，和下一步的 SGX_TEST_BASE 一致。
        # 后台跑到 job 结束（runner 收尾时回收）；日志写 emulator-log/，失败时随测试结果一起上传。
        run: |
          node -e "require('node:sqlite')" || { echo "::error::node:sqlite unavailable, the emulator's D1 needs it"; exit 1; }
          mkdir -p emulator-log
          log=emulator-log/preview-emulator.log
          nohup node tests/space/e2e/helpers/preview-emulator.cjs --port 8788 --space-key "$PREVIEW_TEST_SPACE_KEY" --recovery-key "$PREVIEW_TEST_RECOVERY_KEY" --pepper "$PREVIEW_TEST_PW_PEPPER" --account-pepper "$PREVIEW_TEST_ACCOUNT_PEPPER" > "$log" 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8788/__kv/stats; then echo "preview emulator ready on http://localhost:8788 (pid $pid)"; exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; echo "::error::preview emulator exited before it was ready"; exit 1; fi
            sleep 1
          done
          cat "$log"
          echo "::error::preview emulator not ready after 60s"
          exit 1

      - name: Run WebAuthn E2E on local emulator (SGX_TEST_SUITE=passkey, pull_request only)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        # 和真实预览同一组用例、同一个 playwright 配置；变量按 preview-emulator.cjs 文件头。
        # SGX_TEST_CF_API 把测试进程的 Cloudflare D1 REST 指到模拟器；CF token / account / D1 id 是占位值，不是 secret。
        env:
          SGX_TEST_SUITE: passkey
          SGX_TEST_BASE: http://localhost:8788
          SGX_TEST_SPACE_KEY: ${{ env.PREVIEW_TEST_SPACE_KEY }}
          SGX_TEST_RECOVERY_KEY: ${{ env.PREVIEW_TEST_RECOVERY_KEY }}
          SGX_TEST_CF_API: http://127.0.0.1:8788/client/v4
          SGX_TEST_CF_TOKEN: x
          SGX_TEST_CF_ACCOUNT: x
          SGX_TEST_PREVIEW_D1_ID: local
          CI: '1'
        run: |
          npx playwright test --config=tests/config/playwright.config.js
          echo "emulator KV / D1 operations this run (not billed):"
          curl -fsS http://127.0.0.1:8788/__kv/stats | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);for(const k of ['app','rest','d1'])console.log(k,JSON.stringify(Object.fromEntries(Object.entries(j[k]).filter(([n])=>n!=='byPrefix'))))})" || true

      - name: Bundle preview _worker.js (combined entry tests/space/e2e/helpers/preview-worker.js)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # Pages 上已经没有后端代码。预览把组合入口打包成 Pages 的 _worker.js（覆盖静态的那个），在 passkey-e2e.styrigx-space.pages.dev 上跑：
        # 网关和账号 Worker 两边仓库里的真实代码，网关的服务绑定 ACCOUNT / ACCOUNT_VERIFIER 换成进程内适配器，env 按正式绑定拆给两半
        # （账号拆分 PR3；见 preview-worker.js 文件头）。页面和默认头像读 env.ASSETS，接口连预览的 D1（D1_SPACE / D1_ACCOUNT 同一个测试库）。
        # 只打包不部署 Worker，不需要 Worker 权限。
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" deploy tests/space/e2e/helpers/preview-worker.js --dry-run --outdir "$RUNNER_TEMP/preview-dist" \
            --name sgx-preview-worker-bundle --compatibility-date "$(sed -n 's/^compatibility_date = "\(.*\)"$/\1/p' space/web/wrangler.toml)"
          cp "$RUNNER_TEMP/preview-dist/preview-worker.js" space/web/public/_worker.js
          grep -q "X-SGX-Runtime" space/web/public/_worker.js
          grep -q "X-Styrigx-Space-Session" space/web/public/_worker.js

      - name: Generate Ed25519 test key pairs (CI only)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 锁屏域和账号域各一对，每次运行新生成，只给预览用；绝不用生产密钥，密钥不进仓库
        run: |
          for d in lock account; do
            openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/$d-priv.pem"
            openssl pkey -in "$RUNNER_TEMP/$d-priv.pem" -pubout -out "$RUNNER_TEMP/$d-pub.pem"
            test -s "$RUNNER_TEMP/$d-priv.pem" && test -s "$RUNNER_TEMP/$d-pub.pem"
          done
          echo "Ed25519 test key pairs generated (preview only)"

      - name: Put this run's public keys into space/web/wrangler.toml (runner copy only)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # space/web/wrangler.toml 是 Pages 的配置源：部署时它的 [env.preview.vars] 覆盖后台的明文变量。
        # 仓库里那份 SGX_SPACE_PUBLIC 是固定值，和本次生成的私钥对不上，所以部署前在 runner 里换成本次的公钥，
        # 并补上账号域公钥。不提交，只影响这次部署。
        run: |
          python3 - <<'PYEOF'
          import json, os, re, tomllib
          tmp = os.environ["RUNNER_TEMP"]
          lock_pub = open(f"{tmp}/lock-pub.pem").read()
          acct_pub = open(f"{tmp}/account-pub.pem").read()
          path = "space/web/wrangler.toml"
          s = open(path).read()
          pat = re.compile(r'^SGX_SPACE_PUBLIC = .*$', re.M)
          assert len(pat.findall(s)) == 1, "expected exactly one SGX_SPACE_PUBLIC line"
          assert "SGX_ACCOUNT_PUBLIC" not in s
          s = pat.sub(lambda m: "SGX_SPACE_PUBLIC = " + json.dumps(lock_pub) + "\nSGX_ACCOUNT_PUBLIC = " + json.dumps(acct_pub), s)
          open(path, "w").write(s)
          v = tomllib.loads(s)["env"]["preview"]["vars"]
          assert v["SGX_SPACE_PUBLIC"] == lock_pub and v["SGX_ACCOUNT_PUBLIC"] == acct_pub and v["SGX_ENV"] == "preview"
          print("preview public keys written to the runner copy of space/web/wrangler.toml")
          PYEOF

      - name: Set preview test secrets (preview only)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 只写 preview 环境（PATCH deployment_configs.preview），绝不碰 production。
        # 必须在部署之前写，否则新值要到下一次部署才生效。secret 都经 env 传进来，不拼进脚本；
        # SGX_SPACE_RECOVERY_KEY（网关进站凭证）/ SGX_SPACE_PASSWORD_PEPPER（锁屏密码）/ SGX_ACCOUNT_RECOVERY_KEY（恢复密钥）/ SGX_ACCOUNT_PASSWORD_PEPPER（账号密码）
        # 用上面本次生成的值（已打码）。命名 v2 起预览不再写 SGX_ACCOUNT_ROOT_KEY（账号代码不读它；以前写过的旧测试值不删也不被读）。
        # 账号拆分 PR3 起预览不再写 SGX_ROOT_KEY（网关代码不读它）；预览环境里以前写过的旧值是以前某次运行的测试值，不删也不被读。
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, tomllib, urllib.request, urllib.error
          env = os.environ
          tmp = env["RUNNER_TEMP"]
          rd = lambda f: open(f"{tmp}/{f}").read()
          lock_priv, lock_pub = rd("lock-priv.pem"), rd("lock-pub.pem")
          acct_priv, acct_pub = rd("account-priv.pem"), rd("account-pub.pem")
          assert "PRIVATE KEY" in lock_priv and "PRIVATE KEY" in acct_priv
          space_key, recovery_key = env["PREVIEW_TEST_SPACE_KEY"], env["PREVIEW_TEST_RECOVERY_KEY"]
          pepper, account_pepper = env["PREVIEW_TEST_PW_PEPPER"], env["PREVIEW_TEST_ACCOUNT_PEPPER"]
          assert len(space_key) == 64 and len(recovery_key) == 64 and len(pepper) == 64 and len(account_pepper) == 64
          assert space_key != recovery_key and pepper != account_pepper
          pv = tomllib.load(open("space/web/wrangler.toml", "rb"))["env"]["preview"]["vars"]
          secret = lambda v: {"type": "secret_text", "value": v}
          plain = lambda v: {"type": "plain_text", "value": v}
          body = json.dumps({"deployment_configs": {"preview": {"env_vars": {
              "SGX_SPACE_RECOVERY_KEY": secret(space_key),
              "SGX_ACCOUNT_RECOVERY_KEY": secret(recovery_key),
              "SGX_SPACE_PASSWORD_PEPPER": secret(pepper),
              "SGX_SPACE_TEMPKEY_PEPPER": secret(pepper),
              "SGX_ACCOUNT_PASSWORD_PEPPER": secret(account_pepper),
              "SGX_SPACE_PRIVATE": secret(lock_priv),
              "SGX_ACCOUNT_PRIVATE": secret(acct_priv),
              # 下面这些也在 space/web/wrangler.toml 里（部署时以它为准）；这里写同样的值，两边不会不一致
              "SGX_SPACE_PUBLIC": plain(lock_pub),
              "SGX_ACCOUNT_PUBLIC": plain(acct_pub),
              "SGX_SITE": plain(pv["SGX_SITE"]),
              "SGX_ENV": plain(pv["SGX_ENV"]),
              "SGX_RP_ID": plain(pv["SGX_RP_ID"]),
              "SGX_ORIGIN": plain(pv["SGX_ORIGIN"]),
          }}}}).encode()
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{env['CF_ACCOUNT_ID']}/pages/projects/styrigx-space",
              data=body, method="PATCH",
              headers={"Authorization": f"Bearer {env['CF_PAGES_TOKEN']}", "Content-Type": "application/json"})
          try:
              r = json.load(urllib.request.urlopen(req, timeout=30))
          except urllib.error.HTTPError as e:
              print(f"FAIL: HTTP {e.code}", file=sys.stderr); sys.exit(1)
          if not r.get("success"):
              print("FAIL: success=false", file=sys.stderr); sys.exit(1)
          print("preview secrets updated")
          PYEOF

      - name: Apply D1 migrations to preview
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 部署 preview 前对测试专用库 styrigx-test-preview 跑迁移（--env preview），绝不碰 production；失败要让 CI 红。
        # 2026-10-29 起所有 Worker 的预览共用这一个库：站点核心（space/web/wrangler.toml [env.preview]：D1_SPACE 迁移目录 workers/space-core/migrations，
        # 进站 v3 L2b 起进站 + 分享链接一份基线 0001_baseline.sql）、账号 Worker（workers/account [env.preview]）两套迁移都在这里跑。
        # 表名互不重叠；迁移记录表分开：站点核心 d1_migrations_core（同正式），账号 d1_migrations_account。
        # 基线全部 IF NOT EXISTS：预览库里旧迁移（记录在 d1_migrations / d1_migrations_share，只留史）建好的表遇到它是空操作。
        # 库是空的也没关系：第一次运行两套迁移全部应用，之后只补新的。跑完列一次两张记录表。
        working-directory: space/web
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply styrigx-test-preview --remote --env preview
          (cd ../../workers/account && npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply styrigx-test-preview --remote --env preview)
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute styrigx-test-preview --remote --env preview --command "SELECT 'space-core' AS worker, name, applied_at FROM d1_migrations_core UNION ALL SELECT 'account', name, applied_at FROM d1_migrations_account ORDER BY 1, 2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write preview deploy marker
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 本次部署的标记（run id + attempt），部署后轮询别名直到稳定返回它（下一个 Wait 步骤）。
        # 放 /images/ 下：网关对 MAIN_STATIC_PREFIXES 原样回源、不验会话；只进这个 job 的预览 public/，不进生产构建。
        run: |
          mkdir -p space/web/public/images
          printf '%s\n' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > space/web/public/images/e2e-deploy.txt
          cat space/web/public/images/e2e-deploy.txt

      - name: Deploy to preview
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: space/web
          command: pages deploy public --project-name=styrigx-space --branch=passkey-e2e --commit-dirty=true

      - name: Wait until preview alias serves this deployment
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 别名 passkey-e2e.styrigx-space.pages.dev 刚部署后有一段时间仍会把部分请求路由到上一次部署。
        # 上一次部署是上一次运行生成的 Ed25519 钥匙 / SpaceKey（PR1.5 首跑时还连着旧预览库），
        # 请求混着打到两次部署就会出现 {"error":"session"}、轮询变慢、限速计数分散（2026-10-29 run 40904956665 两次 attempt）。
        # 连续 10 次读到本次标记才开跑；最多等约 240 秒，超时让 CI 红（不带着混合路由跑测试）。
        run: |
          want="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          url="https://passkey-e2e.styrigx-space.pages.dev/images/e2e-deploy.txt"
          ok=0; got=""
          for i in $(seq 1 120); do
            got="$(curl -fsS -H 'Cache-Control: no-cache' "$url?n=$i-$RANDOM" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$got" = "$want" ]; then ok=$((ok + 1)); else ok=0; fi
            if [ "$ok" -ge 10 ]; then echo "alias serves $want (stable after $i probes)"; exit 0; fi
            sleep 2
          done
          echo "::error::preview alias did not settle on $want within ~240s (last: '$got')"
          exit 1

      - name: Run WebAuthn E2E (SGX_TEST_SUITE=passkey)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        # 跑 passkey 组的全部 describe（testMatch 已限定文件，不再 --grep）。
        # 预览地址和预览 D1 id 从 space/web/wrangler.toml 读，不在这里重复写。
        # SGX_TEST_SPACE_KEY / SGX_TEST_RECOVERY_KEY 是本次生成、已写进预览 SGX_SPACE_RECOVERY_KEY / SGX_ACCOUNT_RECOVERY_KEY 的同一对值。
        # 测试进程写预览 D1（打开重置开关、清进站凭证限速计数）用 Pages 部署 token（和上面清 D1 同一个）。
        # 测试 helper 尽量少写：缓存会话 / 进门票并用只读接口确认（tests/space/e2e/helpers/preview-helpers.cjs 文件头）。
        env:
          SGX_TEST_SUITE: passkey
          SGX_TEST_SPACE_KEY: ${{ env.PREVIEW_TEST_SPACE_KEY }}
          SGX_TEST_RECOVERY_KEY: ${{ env.PREVIEW_TEST_RECOVERY_KEY }}
          SGX_TEST_CF_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          SGX_TEST_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          eval "$(python3 - <<'PYEOF'
          import shlex, tomllib
          p = tomllib.load(open("space/web/wrangler.toml", "rb"))["env"]["preview"]
          d1 = [k["database_id"] for k in p["d1_databases"] if k["binding"] == "D1_SPACE"][0]
          print("export SGX_TEST_BASE=" + shlex.quote(p["vars"]["SGX_ORIGIN"]))
          print("export SGX_TEST_PREVIEW_D1_ID=" + shlex.quote(d1))
          PYEOF
          )"
          echo "preview: $SGX_TEST_BASE"
          npx playwright test --config=tests/config/playwright.config.js

      - name: Guard - no private vars on Pages production
        # 私密值只在鉴权网关的 Secrets Store，Pages 生产环境上不许再有（防止有人加回去）。
        # 要用 Cloudflare secret 读 Pages 项目：PR 运行不碰 Cloudflare，只在 main / 手动运行查（只改文档 / 样式时也查）
        if: github.event_name != 'pull_request'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          env = os.environ
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{env['CF_ACCOUNT_ID']}/pages/projects/styrigx-space",
              headers={"Authorization": f"Bearer {env['CF_PAGES_TOKEN']}"})
          r = json.load(urllib.request.urlopen(req, timeout=30))
          # 生产不带任何变量时 API 返回 env_vars: null，按空处理
          prod = r["result"]["deployment_configs"]["production"].get("env_vars") or {}
          names = sorted(prod.keys())
          print("production vars:", names)
          # Pages 只放静态文件，会话检查全在网关；生产部署按 space/web/wrangler.toml 不带任何变量
          forbidden = ["SGX_SPACE_PRIVATE", "SGX_ACCOUNT_PRIVATE", "SGX_STEPUP_PRIVATE", "SGX_APP_PRIVATE", "SGX_ROOT_KEY", "SGX_SPACE_RECOVERY_KEY", "SGX_ACCOUNT_ROOT_KEY", "SGX_ACCOUNT_RECOVERY_KEY", "SGX_ACCOUNT_PASSWORD_PEPPER", "SGX_SPACE_PASSWORD_PEPPER", "TURNSTILE_SECRET", "OWNER_KEY"]
          present = [v for v in forbidden if v in names]
          assert not present, f"private vars must not be on Pages production: {present}"
          print("guard OK: no private vars on Pages production")
          PYEOF

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: passkey-test-results
          path: |
            test-results/
            playwright-report/
            emulator-log/

  build-and-deploy:
    # 部署条件：(push 或 workflow_dispatch) 且 ref 是 main；其他分支手动触发不部署。
    # 手动触发同样要先过 quality 和 passkey-e2e（不跳过）。
    # 不加任何传密钥值的 input，密钥只在 Cloudflare 后台改。
    # Pages 只放静态文件，会话检查全靠网关，所以等网关部署好、线上冒烟通过后再部署 Pages；网关失败就不部署 Pages。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-space-core, deploy-curio-core, deploy-daymark-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        # 只给 wrangler-action 用（不再 npm ci / 构建）
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download production site (built and checked in quality)
        # quality 的生产构建（带 SGX_BUILD_SHA）原样部署，不再重建：测过的就是上线的
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: site-production
          path: space/web/public

      - name: Assert static-only Pages build
        # 生产部署只能带静态的 _worker.js（pages.dev → styrigx.com 跳转 + /curio/ /daymark/ 图片 404），不能带网关代码。
        # 合并 PR2 起产物是单树、2026-11 合站后是同一个 Hugo 站：三站在 /blog/ /curio/ /daymark/ 下，子站目录里没有域名根文件
        run: |
          for f in _headers _redirects index.html; do test -s "space/web/public/$f" || { echo "::error::space/web/public/$f missing"; exit 1; }; done
          for s in blog curio daymark; do
            test -s "space/web/public/$s/index.html" || { echo "::error::space/web/public/$s/index.html missing (subsites missing from the build?)"; exit 1; }
            for f in _worker.js _headers _redirects robots.txt; do test ! -e "space/web/public/$s/$f" || { echo "::error::space/web/public/$s/$f must not exist"; exit 1; }; done
          done
          grep -q "Content-Security-Policy" space/web/public/_headers
          test -f space/web/public/_worker.js
          grep -q "styrigx.com" space/web/public/_worker.js
          if grep -q "X-SGX-Runtime" space/web/public/_worker.js; then echo "::error::gateway bundle in production Pages build"; exit 1; fi

      - name: Record live Pages production deployment (rollback target)
        # 部署前记下生产当前的 deployment（项目的 canonical_deployment；space/scripts/deploy-rollback.mjs）。还没有生产部署 / 记录失败 → 空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（Cloudflare Pages 编辑，已有）
        id: live
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node space/scripts/deploy-rollback.mjs pages-snapshot --project styrigx-space

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: space/web
          command: pages deploy public --project-name=styrigx-space --commit-dirty=true

      - name: Smoke test Pages (pages.dev must redirect, pages still go through the gateway)
        # 只发不带 cookie 的只读请求。pages.dev 地址不经过网关，必须 301 回 styrigx.com（或被 Access 拦在登录页），否则能绕过锁屏。
        run: |
          set -u
          ok=1
          for i in 1 2 3 4 5 6; do
            hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://styrigx-space.pages.dev/security/ | tr -d '\r' || true)
            code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
            loc=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="location"{print $2}')
            echo "pages.dev /security/ -> $code $loc (try $i)"
            if [ "$code" = "301" ] && [ "$loc" = "https://styrigx.com/security/" ]; then ok=0; break; fi
            # pages.dev 前面挂了 Cloudflare Access 时，请求先被 Access 302 到登录页，同样到不了页面，也算通过。
            case "$loc" in
              https://styrigx.cloudflareaccess.com/cdn-cgi/access/login/styrigx-space.pages.dev\?*)
                [ "$code" = "302" ] && { ok=0; break; } ;;
            esac
            sleep 5
          done
          [ $ok = 0 ] || { echo "::error::pages.dev neither redirected to styrigx.com nor sat behind Access"; exit 1; }
          # v5 S3：页面公开，网关照样接（X-SGX-Runtime: worker），/security/ 是 Pages _redirects 的 301 → /#sec
          hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' https://styrigx.com/security/ | tr -d '\r')
          code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
          rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
          echo "styrigx.com /security/ -> $code runtime=${rt:-none}"
          if [ "$code" != "301" ] || [ "$rt" != "worker" ]; then echo "::error::/security/ not answered through the gateway (want 301 from _redirects, runtime worker)"; exit 1; fi
          # 关键页：首页（未登录照常 200 访客态，网关回源 Pages）带的是这次构建的短 SHA（<html data-sgx-build>，HTML 是 max-age=0）
          short="${GITHUB_SHA:0:7}"
          for i in $(seq 1 12); do
            code=$(curl -sS -o "$RUNNER_TEMP/home.html" -w '%{http_code}' https://styrigx.com/ || true)
            if [ "$code" = "200" ] && grep -Eq "data-sgx-build=\"?$short" "$RUNNER_TEMP/home.html"; then echo "/ -> 200, build $short (try $i)"; exit 0; fi
            echo "/ -> $code, build $(grep -Eo 'data-sgx-build="?[0-9a-z]+' "$RUNNER_TEMP/home.html" | head -1) (try $i)"
            sleep 5
          done
          echo "::error::styrigx.com/ does not serve build $short"; exit 1

      - name: Smoke test single tree (subsites open through the gateway, static files direct, no images)
        # v5 S3（整站放开）：页面、RSS、站点地图对没进站的人也公开，但都要经网关（注入会话标记）。只发不带 cookie 的只读请求：
        # - 三站产物里每个一级页面目录各抽一个页面：200 text/html、X-SGX-Runtime: worker、HTML 里有 data-sgx-lock-session="locked"
        #   （网关接管且按访客注入；新目录没被网关接管 → 没有标记 → 红）
        # - 三站指纹 CSS：200 text/css，没有 X-SGX-Runtime（子站静态后缀直通回源 → 也证明这次部署的树里真的有 /<站>/）
        # - /curio/、/daymark/ 图片路径：不得拿到图片（网关直通回源 → _worker.js 404）
        # - 三站 .xml（博客全文 RSS、站点地图）：200 xml、worker（公开）
        # - styrigx-space.pages.dev/blog/：301 到 https://styrigx.com/blog/（或同 /security/ 一样被 Access 拦在登录页）
        run: |
          set -u
          ok=0
          hdr() { curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$1" | tr -d '\r' || true; }
          field() { printf '%s' "$1" | awk -F': ' -v h="$2" 'tolower($1)==h{print $2}' | tail -1; }
          code_of() { printf '%s' "$1" | sed -n 's/^HTTP_CODE://p'; }
          visitor() { # 页面：没进站也 200 HTML、由网关回答、带访客标记
            for i in 1 2 3 4 5 6; do
              h=$(curl -sS -o "$RUNNER_TEMP/v.html" -D - -w 'HTTP_CODE:%{http_code}\n' "https://styrigx.com$1" | tr -d '\r' || true)
              code=$(code_of "$h"); rt=$(field "$h" x-sgx-runtime); ct=$(field "$h" content-type)
              echo "styrigx.com$1 -> $code runtime=${rt:-none} ${ct:-no-type} (try $i)"
              case "$code $rt $ct" in "200 worker text/html"*) grep -q 'data-sgx-lock-session="locked"' "$RUNNER_TEMP/v.html" && return 0 ;; esac
              sleep 5
            done
            echo "::error::styrigx.com$1 expected 200 text/html from the gateway with data-sgx-lock-session=\"locked\""; return 1
          }
          feed() { # .xml：公开，由网关回答
            for i in 1 2 3 4 5 6; do
              h=$(hdr "https://styrigx.com$1"); code=$(code_of "$h"); rt=$(field "$h" x-sgx-runtime); ct=$(field "$h" content-type)
              echo "styrigx.com$1 -> $code runtime=${rt:-none} ${ct:-no-type} (try $i)"
              case "$code $rt $ct" in "200 worker "*xml*) return 0 ;; esac
              sleep 5
            done
            echo "::error::styrigx.com$1 expected 200 xml from the gateway"; return 1
          }
          for s in blog curio daymark; do
            paths=$(cd "space/web/public/$s" && find . -name '*.html' ! -name '404.html' | sed 's|^\.||; s|index\.html$||' | awk -F/ '{k=($2==""?"/":$2); if(!(k in seen)){seen[k]=1; print}}')
            for p in $paths; do visitor "/$s$p" || ok=1; done
            css=$(cd "space/web/public/$s" && find css -name '*.css' | head -1)
            if [ -z "$css" ]; then echo "::error::no css/*.css in the $s package"; ok=1; continue; fi
            pass=1
            for i in 1 2 3 4 5 6; do
              h=$(hdr "https://styrigx.com/$s/$css"); code=$(code_of "$h"); ct=$(field "$h" content-type); rt=$(field "$h" x-sgx-runtime)
              echo "styrigx.com/$s/$css -> $code ${ct:-no-type} runtime=${rt:-none} (try $i)"
              case "$code $ct" in "200 text/css"*) [ -z "$rt" ] && { pass=0; break; } ;; esac
              sleep 5
            done
            [ $pass = 0 ] || { echo "::error::styrigx.com/$s/$css not served directly from this deployment"; ok=1; }
          done
          for p in /blog/rss.xml /blog/zh/rss.xml /blog/sitemap-index.xml /curio/sitemap.xml /daymark/sitemap.xml; do feed "$p" || ok=1; done
          for p in /curio/sgx-image-probe.png /daymark/sgx-image-probe.png; do
            h=$(hdr "https://styrigx.com$p"); code=$(code_of "$h"); ct=$(field "$h" content-type)
            echo "styrigx.com$p -> $code ${ct:-no-type}"
            case "$code" in 404) ;; *) echo "::error::styrigx.com$p without session answered $code"; ok=1 ;; esac
            case "$ct" in image/*) echo "::error::styrigx.com$p without session returned $ct"; ok=1 ;; esac
          done
          pass=1
          for i in 1 2 3 4 5 6; do
            h=$(hdr https://styrigx-space.pages.dev/blog/); code=$(code_of "$h"); loc=$(field "$h" location)
            echo "pages.dev /blog/ -> $code ${loc:-none} (try $i)"
            if [ "$code" = "301" ] && [ "$loc" = "https://styrigx.com/blog/" ]; then pass=0; break; fi
            case "$loc" in
              https://styrigx.cloudflareaccess.com/cdn-cgi/access/login/styrigx-space.pages.dev\?*)
                [ "$code" = "302" ] && { pass=0; break; } ;;
            esac
            sleep 5
          done
          [ $pass = 0 ] || { echo "::error::pages.dev /blog/ neither redirected to styrigx.com/blog/ nor sat behind Access"; ok=1; }
          exit $ok

      - name: Roll back Pages production (deploy or smoke failed)
        # 前面任何一步失败且记到了部署前的 deployment：生产已经不是它就调 Pages 回滚 API 退回去并核对；没变（上传就失败）什么都不做。job 照样红
        if: failure() && steps.live.outputs.deployment != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.deployment }}
        run: node space/scripts/deploy-rollback.mjs pages-rollback --project styrigx-space --to "$PREVIOUS"

  deploy-status-worker:
    # 站点监测 styrigx-status（workers/status）：先于网关部署（网关的服务绑定 STATUS 指向它，它不在就部署不了）。
    # 没有公开地址（workers_dev=false、没有路由），Cron 每分钟检查一轮；数据只能从网关 /api/status 进。
    # 先把 D1 的表结构迁到最新（migrations/，已迁过的跳过），再部署。进站 v3 L2b 起库是自己的 styrigx-status（之前和网关共用 styrigx-space-gateway），
    # 表带 status_ 前缀、迁移记录表 d1_migrations_status（workers/status/wrangler.toml）。
    # token：Cloudflare 上 styrigx-status-deploy = GitHub 环境 STYRIGX_STATUS_DEPLOY 里的同名密钥，
    # 权限 Workers Scripts 编辑 + D1 编辑 + Account Settings 读取 + Secrets Store 编辑（PR3 起有 Secrets Store 绑定
    # SGX_CF_USAGE_TOKEN，部署必须 Edit，Read 报 10021，同鉴权网关）；环境只允许 main。
    # 服务绑定 AI_SERVICE（P4-2 起取代 SEARCH / CHAT，每分钟测 ai 的 /healthz）：排在 ai 之后，
    # 免得新监测先上线、测到还没部署好的版本，误开故障。
    # 服务绑定 JOB_SPACE（v5 S2，入口 ShareJanitor）指向 styrigx-space-core：它绑 STATUS、排在本 job 之后，没法反过来排；
    # Worker 早已存在，绑定照样能部署，新入口等本次 deploy-space-core 上线后才有，这之前只有 03:41 CST 那轮会打一条失败日志。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-ai-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_STATUS_DEPLOY
    # 健康闸门的结论（space/scripts/health-gate.mjs）：verdict = pass / fail / binding / timeout / error；failed = 确认失败的站（逗号分隔）
    outputs:
      health_verdict: ${{ steps.health.outputs.verdict }}
      health_failed: ${{ steps.health.outputs.failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (status → styrigx-status, d1_migrations_status)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/status
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-status --remote

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（space/scripts/deploy-rollback.mjs）。灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy status Worker (styrigx-status)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/status
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Post-deploy check (no public address, so check the live version)
        # 这个 Worker 没有公开地址、冒烟打不到（只能经网关 + 会话进）：核对线上确实换成了一个吃 100% 流量的新版本。
        # 代码能不能起来由 Cloudflare 上传时校验（启动就抛错的脚本上传会被拒）
        working-directory: workers/status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Post-deploy health gate (status checks of ai after this deploy)
        # 健康闸门第二阶段（space/scripts/health-gate.mjs）：等新部署的 status 每分钟巡检（经服务绑定测 ai 的 /healthz）写进 D1 status_checks，
        # 只认部署之后的；连续 2 次失败 → 红。最多等 5 分钟（巡检不跑 = status 自己有问题，同样红）。
        # 红了：下面一步把 status 退回部署前版本；verdict = fail 时 rollback-ai-worker 退回 ai；
        # 网关 / Pages / 账号 / 分享都等这个 job，不会部署。部署前就在失败的站只打 warning。
        # D1 REST 用 status 部署本来就有的 token（D1 编辑，同上面的 d1 migrations apply），不加 secret、不经网关。
        id: health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE_UNTIL: ${{ needs.deploy-ai-worker.outputs.started_at }}
        run: node space/scripts/health-gate.mjs --sites ai --baseline-until "$BASELINE_UNTIL"

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-ai-worker:
    # 站内对话助手 styrigx-ai（workers/ai，P4-1）：先于网关部署（网关的服务绑定 AI_SERVICE 指向它，它不在就部署不了）。
    # 没有公开地址（workers_dev=false、preview_urls=false、没有路由），只能从网关 /api/ai 进。运行时只读 KV styrigx-space-core（进站 v3 L2b 由 styrigx-space-gateway 换过来；索引 + 模型登记 ai:models）。
    # P4-2：search-index 退役，部署后把主站索引 site:space、博客索引 site:blog 写进同一个 KV（原 deploy-search-worker 的两步搬来）。
    # P4-2：外部模型钥匙 SGX_CHAT_API_KEY 的 Secrets Store 绑定（复用原 styrigx-chat 那把）；绑定失败退一步部署不带钥匙的版本（同原 deploy-chat-worker）。
    # token：GitHub 环境 STYRIGX_AI_DEPLOY 里的同名密钥（Cloudflare 上 styrigx-ai-deploy，2026-11-05 由 styrigx-search-index-deploy 改名，
    # Workers Scripts 编辑 + Workers KV Storage 编辑 + Secrets Store 编辑（绑 SGX_CHAT_API_KEY 要它，同原 styrigx-chat-deploy），范围整个账号）。
    # 2026-11-05 run 42007357284：原 token 没有 Secrets Store 权限，带钥匙部署报 10021，Gray 定改名 + 加权限，一次带钥匙部署成功、不靠退路。
    # Workers AI 绑定要不要额外权限文档没写清：先不加；首次部署若报权限错，Gray 给这把 token 加 Workers AI 权限后重跑（对线上无影响）。
    # 2026-11 AI 语义召回：wrangler.toml 加了 Vectorize 绑定 styrigx-ai-recall（索引要先在 Cloudflare 建好，否则部署失败、退路也失败、回滚）、
    # 服务绑定 CURIO（styrigx-curio-core#CurioReader）、[placement] region、每小时 Cron。若部署报 Vectorize 权限错，给这把 token 加 Vectorize 编辑后重跑。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_AI_DEPLOY
    outputs:
      previous: ${{ steps.live.outputs.version }}
      started_at: ${{ steps.t0.outputs.at }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        # 只给 wrangler-action 用（索引在 quality 里由生产构建生成，这里不再构建 / npm ci）
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download search index (site:space, built in quality)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: search-index-space
          path: ${{ runner.temp }}

      - name: Download blog search index (site:blog, built in quality)
        # 合并 PR3 起博客索引由本仓库写（同一把 token：已有 Workers KV Storage 编辑）；styrigx-atlas 仓库不再写；P4-2 起在这个 job 写
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: search-index-blog
          path: ${{ runner.temp }}

      - name: Check search index
        run: |
          test -s "$RUNNER_TEMP/search-space.json"
          test -s "$RUNNER_TEMP/search-blog.json"

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（space/scripts/deploy-rollback.mjs）。灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚
        id: live
        continue-on-error: true
        working-directory: workers/ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_AI_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Record deploy start
        # 毫秒时间戳（UTC）：status 的健康闸门（监测项 ai）把这之前的最近一次巡检当「部署前」
        id: t0
        run: echo "at=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Deploy AI Worker (styrigx-ai)
        id: deploy_ai
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_AI_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Prepare keyless config (fallback)
        # P4-2：外部模型钥匙 SGX_CHAT_API_KEY 的 Secrets Store 绑定（同原 styrigx-chat 的退路）：带钥匙绑定部署失败
        # （密钥不在 / token 绑不了）→ 去掉钥匙绑定再部署一次；自营模型照常，选中外部模型回 503 no_key
        if: steps.deploy_ai.outcome == 'failure'
        working-directory: workers/ai
        run: |
          echo "::warning::styrigx-ai deploy failed (SGX_CHAT_API_KEY binding?); deploying without the key binding, external models will answer 503 no_key"
          sed '/^\[\[secrets_store_secrets\]\]/,$d' wrangler.toml > wrangler.nokey.toml
          # 只认行首的表头：wrangler.toml 注释里写着 [[secrets_store_secrets]] 这串字，按全文 grep 会误报（2026-11-05 run 42007357284）
          if grep -qE '^[[:space:]]*\[\[secrets_store_secrets\]\]' wrangler.nokey.toml; then echo "::error::keyless config still has a Secrets Store binding"; exit 1; fi
          grep -q '^name = "styrigx-ai"$' wrangler.nokey.toml

      - name: Deploy AI Worker without key binding (fallback)
        if: steps.deploy_ai.outcome == 'failure'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_AI_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --config wrangler.nokey.toml

      - name: Post-deploy check (no public address, so check the live version)
        # 没有公开地址、冒烟打不到（只能经网关 + 会话进）：核对线上确实换成了一个吃 100% 流量的新版本
        working-directory: workers/ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_AI_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Upload search index to KV (site:space)
        # P4-2：原在 deploy-search-worker，search-index 退役后并到这里（同一把 token、同一个 KV styrigx-space-core）
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_AI_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: kv key put site:space --path=${{ runner.temp }}/search-space.json --binding=KV_SEARCH_INDEX --remote

      - name: Upload blog search index to KV (site:blog)
        # 博客的条目链接是 https://styrigx.com/blog/…（space/scripts/blog/build-search-index.mjs 的 SITE_URL）；site:curio / site:daymark 由各自接口 Worker 自己写。
        # KV 写失败：AI 召回还是旧索引，job 红（照下面一步回滚代码）；数据不回滚
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_AI_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: kv key put site:blog --path=${{ runner.temp }}/search-blog.json --binding=KV_SEARCH_INDEX --remote

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变什么都不做。
        # job 照样红，后面依赖它的 job（网关）不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_AI_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  rollback-ai-worker:
    # 健康闸门（deploy-status-worker 的 Post-deploy health gate）确认 ai 在部署后失败 → 退回 deploy-ai-worker 记下的部署前版本。
    # 在 ai 自己的环境里跑，只用它部署本来就用的 token（Workers Scripts 编辑），同 job 内的自动回滚（含回滚下限）。P4-2 起取代 rollback-search-worker / rollback-chat-worker。
    # 闸门没判 fail（pass / binding / timeout / error）或没记到部署前版本 → 跳过。
    if: ${{ always() && needs.deploy-status-worker.outputs.health_verdict == 'fail' && contains(format(',{0},', needs.deploy-status-worker.outputs.health_failed), ',ai,') && needs.deploy-ai-worker.outputs.previous != '' }}
    needs: [deploy-ai-worker, deploy-status-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: STYRIGX_AI_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Roll back AI Worker (health gate failed)
        # 只换代码版本；KV 里的索引（site:space / site:blog）是这次上传的，不回滚（同 job 内回滚）
        working-directory: workers/ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_AI_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ needs.deploy-ai-worker.outputs.previous }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-proxy-rules-worker:
    # 规则集反代 + 代理订阅 styrigx-proxy-rules（workers/proxy-rules）：独立部署，不等也不挡网关和 Pages。
    # 公开地址只有自定义域名 proxy-rules.styrigx.com（wrangler.toml 的 routes，custom_domain）。
    # token：Cloudflare 上 styrigx-proxy-rules-deploy = GitHub 环境 STYRIGX_PROXY_RULES_DEPLOY 里的同名密钥，
    # 权限 Workers Scripts 编辑 + D1 编辑（styrigx-proxy 迁移）+ Secrets Store 编辑（SGX_PROXY_DB_KEY 绑定）+ styrigx.com 的 Workers Routes 编辑；环境只允许 main。
    # 步骤：D1 迁移（migrations/；已迁过的跳过，失败要让 job 红）→ 记录线上版本 → 部署 → 冒烟 → 失败回滚（只回代码，不回迁移）。
    # account 的 /api/account/proxy 经服务绑定 PROXY 调本 Worker 的 ProxyAdmin；两边各自部署，本 Worker 没部署完的那一两分钟 account 回 503 upstream。
    # 排在 ai、curio-core、daymark-core 之后（2026-11-10）：免费账号整个账号只有 5 个 Cron Trigger，
    # 那三个先部署（crons = [] 清掉自己的每小时 Cron，改由 status 调），本 Worker 的 6 小时 Cron 才有名额。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-ai-worker, deploy-curio-core, deploy-daymark-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_PROXY_RULES_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (proxy-rules → styrigx-proxy)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_PROXY_RULES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/proxy-rules
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-proxy --remote

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（space/scripts/deploy-rollback.mjs）。灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/proxy-rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_PROXY_RULES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy proxy rules Worker (styrigx-proxy-rules)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_PROXY_RULES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/proxy-rules
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Smoke test proxy-rules.styrigx.com
        # 只发只读请求。新域名第一次绑定要等证书签发，最多重试 12 次（约 2 分钟）。
        run: |
          set -u
          B=https://proxy-rules.styrigx.com
          check() { # 路径 期望状态码
            for i in $(seq 1 12); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$B$1" || true)
              echo "$1 -> $code (try $i)"
              [ "$code" = "$2" ] && return 0
              sleep 10
            done
            echo "::error::$1 expected $2"; return 1
          }
          ok=0
          check /healthz 200 || ok=1
          check /MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs 200 || ok=1
          check /MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs 200 || ok=1
          # 自有仓 styrigx/mihomo-rules 的 release 分支（dist 分支已删）
          check /styrigx/mihomo-rules/release/geosite/samsung.mrs 200 || ok=1
          check /styrigx/mihomo-rules/release/geoip/cn.mrs 200 || ok=1
          # 白名单外不转发
          check /MetaCubeX/meta-rules-dat/meta/README.md 404 || ok=1
          check /styrigx/mihomo-rules/release/manifest.json 404 || ok=1
          check /styrigx/mihomo-rules/dist/geosite/samsung.mrs 404 || ok=1
          # 代理订阅：错令牌 404；公网没有管理 / 刷新入口
          check /s/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/smoke 404 || ok=1
          check /api/proxy 404 || ok=1
          check /internal/refresh 404 || ok=1
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/proxy-rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_PROXY_RULES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-curio-core:
    # 奇趣接口 Worker styrigx-curio-core（workers/curio-core；合并 PR3 起由本仓库部署，styrigx-atlas 仓库不再部署）。
    # 路由见 workers/curio-core/wrangler.toml：styrigx.com/curio/api/*（旧图志域名的过渡期路由 P4-3 PR-1 删除），
    # 比网关的整站通配更具体；workers_dev=false、preview_urls=false。不持任何钥匙：会话问站点核心 SpaceVerifier.conclusion()（服务绑定 SPACE）。
    # 进站 v3 L2 起排在 styrigx-space-core 之后（needs）：服务绑定 SPACE 指向的 Worker / 入口 SpaceVerifier 要先在，不然部署不了。
    # 网关切过去到本 Worker 部署完的那一两分钟，旧版本问的是旧网关的 AuthVerifier（还在，L3 才删），子站接口照旧。和网关一样等 status 的健康闸门。
    # 步骤：D1 迁移（migrations/；已迁过的跳过，失败要让 job 红）→ 记录线上版本 → 部署 → 核对新版本 → 冒烟 → 失败回滚。
    # token：Cloudflare 上 styrigx-curio-core-deploy = GitHub 环境 STYRIGX_CURIO_CORE_DEPLOY 里的同名环境密钥 STYRIGX_CURIO_CORE_DEPLOY
    # （styrigx-atlas 仓库时用的同一把；权限 Workers Scripts 编辑 + D1 编辑 + styrigx.com 的 Workers Routes 编辑，部署前 Gray 核对）；环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-status-worker, deploy-space-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_CURIO_CORE_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (styrigx-curio-core)
        # 不新增迁移：表结构在 styrigx-atlas 时已迁到最新，这一步应是 No migrations to apply
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/curio-core
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-curio-core --remote

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（space/scripts/deploy-rollback.mjs）。记录失败 → 空，只打 warning、不拦部署：空 = 这次失败不自动回滚
        id: live
        continue-on-error: true
        working-directory: workers/curio-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy 奇趣 core Worker (styrigx-curio-core)
        # wrangler deploy 按 wrangler.toml 的 [[routes]] 整体覆盖线上路由：只有主域名路由（旧图志域名的路由在这一步被摘掉）
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/curio-core
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Post-deploy check (live version switched)
        working-directory: workers/curio-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Smoke test production (styrigx.com/curio/api/* lands on this Worker)
        # 只发不带 cookie 的只读请求。这时网关可能还是旧版本：接口路由比网关的通配更具体，新旧网关下回答相同。
        run: |
          set -u
          check() { # 地址 期望状态码
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$1" | tr -d '\r' || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-curio-runtime"{print $2}')
              echo "$1 -> $code X-Curio-Runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "worker" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 with X-Curio-Runtime: worker"; return 1
          }
          ok=0
          # v5 S3 访问表（workers/curio-core/src/routes.js ROUTE_ACCESS）：读公开（歌单只有元数据）；听 / 导出要进站
          check "https://styrigx.com/curio/api/links" 200 || ok=1
          check "https://styrigx.com/curio/api/music" 200 || ok=1
          check "https://styrigx.com/curio/api/music-stream?t=smoke&id=1" 401 || ok=1
          check "https://styrigx.com/curio/api/export" 401 || ok=1
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 只换代码版本：D1 迁移、路由不回滚（接口按去掉 /curio 前缀的路径分发，不看主机，回滚后的旧版本照样能接现在的路由）。
        # job 照样红，网关不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/curio-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-daymark-core:
    # 日刻接口 Worker styrigx-daymark-core（workers/daymark-core；合并 PR3 起由本仓库部署，styrigx-atlas 仓库不再部署）。
    # 路由见 workers/daymark-core/wrangler.toml：styrigx.com/daymark/api/*（旧图志域名的过渡期路由 P4-3 PR-1 删除），
    # 比网关的整站通配更具体；workers_dev=false、preview_urls=false。不持任何钥匙：会话问站点核心 SpaceVerifier.conclusion()（服务绑定 SPACE）。

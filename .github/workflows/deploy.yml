        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-space-core:
    # 站点核心 Worker styrigx-space-core（workers/space-core；进站 v3 L2 起取代 styrigx-auth-gateway，并入分享链接 styrigx-share）：main 上真部署。
    # 先于 Pages 部署（Pages 只放静态文件，靠它验会话），也先于奇趣 / 日刻两个接口 Worker（它们的服务绑定 SPACE → SpaceVerifier 要它先在）。
    # 路由见 workers/space-core/wrangler.toml（整站通配 styrigx.com/*；/s/*、/api/share 也在里面，按路径分；workers_dev=false）。
    # 账号路径 /api/account、/api/prefs*、/api/avatar*、/api/wellbeing*、/api/profile、/avatar/* 验门后经服务绑定 ACCOUNT 转给账号 Worker（src/router.js FORWARDING）。
    # 部署顺序：ai → status → 账号 → 本 Worker → 奇趣 / 日刻接口 Worker → Pages。服务绑定指向的 ai / status / styrigx-account 要先在。
    # D1：进站 v3 L2b 起是 styrigx-space-core（一个绑定 D1_SPACE、一份基线、记录表 d1_migrations_core）。本 job 自己跑迁移，
    # 再查记录表和表确认真的在库里（只看到 No migrations to apply 不算数）。
    # 进站 v3 L3（2026-11-09）：旧 Worker styrigx-auth-gateway / styrigx-share、旧库 styrigx-space-gateway 已删，一次性的路由接管和 resync 步骤随之去掉。
    # 密钥全在 Secrets Store（5 个 SGX_SPACE_*，按名字绑定），CI 不传任何密值。
    # token：Cloudflare 上 styrigx-space-core-deploy = GitHub 环境 STYRIGX_SPACE_CORE_DEPLOY 里的同名环境密钥 STYRIGX_SPACE_CORE_DEPLOY
    # （Workers Scripts 编辑 + Workers Routes 编辑（styrigx.com）+ Secrets Store 编辑（带 Secrets Store 绑定部署必须 Edit）+ D1 编辑）；该环境只允许 main 分支部署。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-ai-worker, deploy-status-worker, deploy-account-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_SPACE_CORE_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (D1_SPACE → styrigx-space-core, d1_migrations_core)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SPACE_CORE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/space-core
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply D1_SPACE --remote

      - name: Confirm migrations are really in the database (styrigx-space-core)
        working-directory: workers/space-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          out=$(npx --yes "wrangler@$WRANGLER_VERSION" d1 execute D1_SPACE --remote --json --command "SELECT 'core:' || name AS n FROM d1_migrations_core UNION ALL SELECT 'table:' || name FROM sqlite_master WHERE type = 'table'")
          echo "$out"
          ok=0
          for need in '"core:0001_baseline.sql"' '"table:share_link"' '"table:share_fail"' '"table:passkey"' '"table:password"' '"table:user_handle"' '"table:lock_reset_switch"'; do
            if ! printf '%s' "$out" | grep -q "$need"; then echo "::error::D1 styrigx-space-core 里没有 $need"; ok=1; fi
          done
          exit $ok

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（space/scripts/deploy-rollback.mjs）。灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚代码版本。
        id: live
        continue-on-error: true
        working-directory: workers/space-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy space core Worker (styrigx-space-core)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_SPACE_CORE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/space-core
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Verify routes (styrigx.com/* → styrigx-space-core, no separate share routes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node space/scripts/verify-core-routes.mjs

      - name: Smoke test production /api/* and pages (must be served by the Worker)
        # passkey-e2e 只测预览，测不到生产这条路，所以部署后直接打线上。
        # 只发不带 cookie 的只读请求，不登录、不写数据。路由生效可能要几秒，最多重试 6 次。
        # 失败时自动退回部署前的版本（最后两步：第一次部署时把路由还给旧 Worker），Pages、奇趣 / 日刻接口 Worker 不会部署（等这个 job）。修好或 revert 后重新跑。
        run: |
          set -u
          check() { # 路径（可带子站域名） 期望状态码
            case "$1" in https://*) u="$1" ;; *) u="https://styrigx.com$1" ;; esac
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$u" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "worker" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 from worker"; return 1
          }
          ok=0
          check /api/geo 200 || ok=1
          check /api/lock-session-check 401 || ok=1
          # 全站搜索（P4-2 退役，路由表里没了）：没会话仍是 401（网关门先拦，默认拒绝）；有会话才是 404，冒烟测不到
          check '/api/search?q=a' 401 || ok=1
          # v5 S4 关键词搜索：公开，没会话也 200（只回公开页面元数据；索引读不了也是 200 degraded）
          check '/api/find?q=muse' 200 || ok=1
          # 站点监测：没会话 401
          check /api/status 401 || ok=1
          # 聊天（P4-2 退役，同上）：没会话 401
          check /api/chat 401 || ok=1
          # 未登录访问不存在的接口：middleware 先拦（默认拒绝），返回 401 而不是 404，这是预期。
          check /api/no-such-endpoint 401 || ok=1
          # 页面（v5 S3 整站放开）：网关回源 Pages，没进站也照常 200（访客态）；旧安全页是 Pages _redirects 的 301，同样经网关
          check / 200 || ok=1
          # P4-3 PR-4c：英文在根、中文 /zh/
          check /zh/ 200 || ok=1
          check /wild/ 200 || ok=1
          check /security/lock/ 301 || ok=1
          check /zh/security/lock/ 301 || ok=1
          check /security/ 301 || ok=1
          # 旧 /en/…（P4-3 PR-4c 删除不 301；英文在根上是源，中文 /zh/ 是翻译层）：网关自己判 404，有没有会话都一样，不 302、不 301。
          # 2026-11-07 线上解锁会话打开 /en/ 拿到过 77ce4d6 的旧英文首页（回源链路上的旧副本），这里同时核对正文不是首页
          for p in /en/ /en /en/about/ /en/security/lock/ /EN/ /%65n/; do check "$p" 404 || ok=1; done
          enbody=$(curl -sS "https://styrigx.com/en/?smoke=$GITHUB_RUN_ID" || true)
          if printf '%s' "$enbody" | grep -q 'id="home-widgets"'; then echo "::error::/en/ served a home page"; ok=1; fi
          # 四站同一条规则：子站旧 /<站>/en/… 也由网关直接 404（该站自己的 404 页），不 301
          for p in /blog/en/ /curio/en/ /daymark/en/ /blog/EN/ /curio/%65n/ /daymark/en/sitemap.xml; do check "$p" 404 || ok=1; done
          # 旧搜索 / 聊天页（P4-2 起 _redirects 301 回首页）：v5 S3 起没会话也直接是 Pages 的 301（经网关）
          check /browser/search/ 301 || ok=1
          check /chat/ 301 || ok=1
          # 账号（账号拆分 PR3）：/api/account 没有账号 Worker 的旧路由，一定进网关——无会话 401；伪造身份头也一样 401（网关先剥头）
          check /api/account 401 || ok=1
          forged() { # 路径：带伪造的 X-Styrigx-Space-* 头，必须 401 且由网关回答（不许 200、不许进账号 Worker 的接口）
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' -H 'X-Styrigx-Space-Session: 1' -H 'X-Styrigx-Space-By: password' "https://styrigx.com$1" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "forged $1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "401" ] && [ "$rt" = "worker" ]; then return 0; fi
              # 账号 Worker 的旧路由还没手动删（部署步骤 4）：直接进账号 Worker 的默认 fetch，一律 404，同样碰不到接口
              if [ "$code" = "404" ] && [ "$rt" = "account" ]; then echo "::warning::$1 still hits a stale styrigx-account route (default fetch 404); delete the old routes (deploy step 4)"; return 0; fi
              sleep 5
            done
            echo "::error::forged identity headers on $1 expected 401 from worker"; return 1
          }
          forged /api/account || ok=1
          forged /api/prefs || ok=1
          # 数字健康合计（v5 S3 访问表 public）：没会话 GET 也转发给账号 Worker，回 200（只合计），X-SGX-Runtime: account
          wb_ok=1
          for i in 1 2 3 4 5 6; do
            hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' -H 'X-Styrigx-Space-Session: 1' "https://styrigx.com/api/wellbeing?smoke=$GITHUB_RUN_ID" || true)
            code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
            rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
            echo "/api/wellbeing (forged header) -> $code runtime=${rt:-none} (try $i)"
            if [ "$code" = "200" ] && [ "$rt" = "account" ]; then wb_ok=0; break; fi
            sleep 5
          done
          [ $wb_ok = 0 ] || { echo "::error::GET /api/wellbeing without session expected 200 from account (public totals)"; ok=1; }
          # 账号运行时标记：公开的头像文件经网关转发，响应保留账号 Worker 的 X-SGX-Runtime: account
          avatar_ok=1
          for i in 1 2 3 4 5 6; do
            hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "https://styrigx.com/avatar/96.webp?smoke=$GITHUB_RUN_ID" || true)
            code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
            rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
            echo "/avatar/96.webp -> $code runtime=${rt:-none} (try $i)"
            if [ "$rt" = "account" ] && [ "$code" = "200" ]; then avatar_ok=0; break; fi
            if [ "$rt" = "account" ] && [ "$code" = "404" ]; then avatar_ok=0; echo "::warning::/avatar/* still hits a stale styrigx-account route; delete the old routes (deploy step 4), then /avatar/96.webp must be 200 account"; break; fi
            sleep 5
          done
          [ $avatar_ok = 0 ] || { echo "::error::/avatar/96.webp expected X-SGX-Runtime: account"; ok=1; }
          # 子站（v5 S3）：三站页面没进站也 200，由网关回答
          redir() { # 地址 期望状态码 期望 Location（逐字）
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$1" | tr -d '\r' || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              loc=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="location"{print $2}')
              echo "$1 -> $code runtime=${rt:-none} location=${loc:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "worker" ] && [ "$loc" = "$3" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 to $3 from worker"; return 1
          }
          for s in blog curio daymark; do check "/$s/" 200 || ok=1; done
          # 静态资源不过网关：不能带 worker 标记
          css=$(curl -sS -o /dev/null -D - https://styrigx.com/robots.txt | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
          echo "/robots.txt runtime=${css:-none}"
          if [ -n "$css" ]; then echo "::error::static file went through the Worker"; ok=1; fi
          # 分享链接（进站 v3 L2 起由本 Worker 接，原 styrigx-share）：打不开的短链统一 302 到锁屏（L2b 起 ?entry=1）；管理接口没会话 401
          redir "https://styrigx.com/s/smoke$(date +%s)xxxxxxxxxxx" 302 'https://styrigx.com/?entry=1' || ok=1
          check /api/share 401 || ok=1
          # 旧锁屏头名也一样被剥（所有外来 x-styrigx-* 都剥）
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Styrigx-Lock-Session: 1' -H 'X-Styrigx-Lock-By: password' https://styrigx.com/api/account || true)
            [ "$code" = 401 ] && break; sleep 5
          done
          [ "$code" = 401 ] || { echo "::error::old X-Styrigx-Lock-* headers on /api/account expected 401, got $code"; ok=1; }
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/space-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_SPACE_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"

  deploy-account-worker:
    # 账号 Worker styrigx-account（workers/account）：完整的账号系统——账号密码 / 通行密钥 / 恢复密钥 / 设备 / session / reauth / reset /
    # 应用授权 / 审计（D1_ACCOUNT 的 account_* 表），头像（KV_PROFILE）、设置云同步和数字健康（同在 D1_ACCOUNT）。
    # 没有任何路由（workers/account/wrangler.toml 无 [[routes]]）、workers_dev=false、preview_urls=false：只经网关的服务绑定
    # ACCOUNT（AccountService）/ ACCOUNT_VERIFIER（AccountVerifier）进来（短链 Worker 不再绑它）；默认 fetch 一律 404。
    # 不调网关、不绑任何锁屏的东西（PR3 删掉了服务绑定 AUTH）。钥匙都在 Secrets Store（SGX_ACCOUNT_PRIVATE / PUBLIC、SGX_ACCOUNT_RECOVERY_KEY、
    # SGX_ACCOUNT_PASSWORD_PEPPER），CI 不传任何密值。
    # 部署顺序：账号、短链（互不依赖，可并行）→ 网关 → Pages。排在网关之前：网关的服务绑定指向它的命名入口（PR2 起已导出）。
    # 和网关 / 短链一样等 status 的健康闸门（needs 里的 ai / status）。
    # 注意：wrangler deploy 在配置里没有路由时不碰线上已有的路由（只在有路由时 PUT 整个列表），所以 PR3 前的 4 条旧路由
    # （styrigx.com/api/avatar*、/api/prefs*、/api/wellbeing*、/avatar/*）部署后还在、指向这里的默认 fetch（一律 404），
    # 要按部署步骤在网关部署后手动删掉；删之前这 4 类路径 404。
    # 先把 D1 styrigx-account 的表结构迁到最新（migrations/，已迁过的跳过；失败要让 job 红，不 continue-on-error），再部署，再核对。
    # token：Cloudflare 上 styrigx-account-deploy = GitHub 环境 STYRIGX_ACCOUNT_DEPLOY 里的同名环境密钥 STYRIGX_ACCOUNT_DEPLOY，
    # 权限 Workers Scripts 编辑 + Workers KV Storage 编辑 + D1 编辑 + Secrets Store 编辑（带 Secrets Store 绑定部署必须 Edit）+ Account Settings 读取；
    # 没有路由，不需要 Workers Routes 权限；环境只允许 main。
    # !failure() && !cancelled()：passkey-e2e 跳过用例时仍以成功结束；上游任何一个失败 / 取消就不部署
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality, passkey-e2e, deploy-ai-worker, deploy-status-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_ACCOUNT_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (styrigx-account)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/account
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-account --remote

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（space/scripts/deploy-rollback.mjs）。灰度中 / 记录失败 → 记成空，
        # 只打 warning、不拦部署：空 = 这次失败不自动回滚。token 同部署那一步（读部署状态只要 Workers Scripts，已有）
        id: live
        continue-on-error: true
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy account Worker (styrigx-account)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/account
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Post-deploy check (no public address, so check the live version)
        # 没有公开地址：核对线上确实换成了一个吃 100% 流量的新版本（同 ai / status）。代码能不能起来由 Cloudflare 上传时校验
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Smoke test production (forged identity headers never reach the account APIs)
        # 只发不带 cookie 的只读请求。这时网关可能还是旧版本、账号的 4 条旧路由可能还在（见上），所以每条只断言「碰不到接口」：
        # - 旧路由还在 → 进本 Worker 的默认 fetch：404 + X-SGX-Runtime: account（同时证明线上已是新代码：旧代码在这些路径回 401 / 200）；
        # - 旧路由已删 → 进网关：无会话 401 + X-SGX-Runtime: worker。
        # 绝不许 200（伪造的 X-Styrigx-Space-Session: 1 不能当身份用）。
        run: |
          set -u
          check() { # 路径
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' -H 'X-Styrigx-Space-Session: 1' -H 'X-Styrigx-Space-By: password' "https://styrigx.com$1" || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-sgx-runtime"{print $2}')
              echo "forged $1 -> $code runtime=${rt:-none} (try $i)"
              if [ "$code" = "404" ] && [ "$rt" = "account" ]; then return 0; fi
              if [ "$code" = "401" ] && [ "$rt" = "worker" ]; then return 0; fi
              sleep 5
            done
            echo "::error::forged identity headers on $1: expected 404 from account (stale route) or 401 from worker"; return 1
          }
          ok=0
          check /api/prefs || ok=1
          check /api/wellbeing || ok=1
          check /api/avatar || ok=1
          # 网关的接口和页面没被抢走
          for p in /api/lock-session-check; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://styrigx.com$p" || true)
            echo "$p -> $code"; [ "$code" = "401" ] || ok=1
          done
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 前面任何一步失败且记到了部署前版本：线上已经不是那个版本就 wrangler rollback 回去并核对；线上没变（上传阶段就失败）什么都不做。
        # 只换代码版本：D1 迁移、KV 数据、Secrets Store、路由不回滚。job 照样红，后面依赖它的 job 不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_ACCOUNT_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"


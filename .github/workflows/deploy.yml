        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations (styrigx-curio-core)
        # 不新增迁移：表结构在 styrigx-atlas 时已迁到最新，这一步应是 No migrations to apply
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/curio-core
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply styrigx-curio-core --remote

      - name: Record live Worker version (rollback target)
        # 部署前记下线上 100% 流量的版本（scripts/deploy-rollback.mjs）。记录失败 → 空，只打 warning、不拦部署：空 = 这次失败不自动回滚
        id: live
        continue-on-error: true
        working-directory: workers/curio-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-snapshot

      - name: Deploy 奇趣 core Worker (styrigx-curio-core)
        # wrangler deploy 按 wrangler.toml 的 [[routes]] 整体覆盖线上路由：主域名路由在这一步挂上，atlas 旧路由保留
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/curio-core
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Post-deploy check (live version switched)
        working-directory: workers/curio-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Smoke test production (styrigx.com/curio/api/* and the old atlas route both land on this Worker)
        # 只发不带 cookie 的只读请求。这时网关可能还是旧版本：接口路由比网关的通配更具体，新旧网关下回答相同。
        run: |
          set -u
          check() { # 地址 期望状态码
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$1" | tr -d '\r' || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-curio-runtime"{print $2}')
              echo "$1 -> $code X-Curio-Runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "worker" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 with X-Curio-Runtime: worker"; return 1
          }
          ok=0
          check "https://styrigx.com/curio/api/links" 401 || ok=1
          check "https://styrigx.com/curio/api/icon?id=1" 401 || ok=1
          check "https://styrigx.com/curio/api/photo?kind=device&id=1" 401 || ok=1
          check "https://atlas.styrigx.com/curio/api/links" 401 || ok=1
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 只换代码版本：D1 迁移、路由不回滚（回滚后的旧版本照样能接新旧两条路由上的请求：接口按去掉 /curio 前缀的路径分发，不看主机）。
        # job 照样红，网关不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/curio-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_CURIO_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.live.outputs.version }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-rollback.mjs" worker-rollback --to "$PREVIOUS"


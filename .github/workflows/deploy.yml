        run: node "$GITHUB_WORKSPACE/space/scripts/deploy-rollback.mjs" worker-verify --previous "$PREVIOUS"

      - name: Smoke test production (styrigx.com/daymark/api/* lands on this Worker)
        # 只发不带 cookie 的只读请求。这时网关可能还是旧版本：接口路由比网关的通配更具体，新旧网关下回答相同。
        run: |
          set -u
          check() { # 地址 期望状态码
            for i in 1 2 3 4 5 6; do
              hdr=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$1" | tr -d '\r' || true)
              code=$(printf '%s' "$hdr" | sed -n 's/^HTTP_CODE://p')
              rt=$(printf '%s' "$hdr" | awk -F': ' 'tolower($1)=="x-daymark-runtime"{print $2}')
              echo "$1 -> $code X-Daymark-Runtime=${rt:-none} (try $i)"
              if [ "$code" = "$2" ] && [ "$rt" = "worker" ]; then return 0; fi
              sleep 5
            done
            echo "::error::$1 expected $2 with X-Daymark-Runtime: worker"; return 1
          }
          ok=0
          # v5 S3 访问表（workers/daymark-core/src/routes.js ROUTE_ACCESS）：读公开；表里没有的路径一律要进站
          check "https://styrigx.com/daymark/api/quotes" 200 || ok=1
          check "https://styrigx.com/daymark/api/today" 200 || ok=1
          check "https://styrigx.com/daymark/api/no-such-endpoint" 401 || ok=1
          exit $ok

      - name: Roll back to the recorded version (deploy or post-deploy check failed)
        # 只换代码版本：D1 迁移、路由不回滚（接口按去掉 /daymark 前缀的路径分发，不看主机，回滚后的旧版本照样能接现在的路由）。
        # job 照样红，网关不部署
        if: failure() && steps.live.outputs.version != ''
        working-directory: workers/daymark-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_DAYMARK_CORE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

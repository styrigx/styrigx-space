name: D1 cutover (one-time, styrigx-space-gateway → styrigx-space-core + styrigx-status)

# 进站 v3 L2b（2026-11-09，Gray 08:18 / 08:21 定）的一次性搬迁。只手动触发，只在 main 上跑（两个 GitHub 环境都只允许 main）。
#   D1 styrigx-space-gateway：网关表 + share_link / share_fail → D1 styrigx-space-core；status_* 七张表 → D1 styrigx-status（表名都不变）
#   KV styrigx-space-gateway（全部键）→ KV styrigx-space-core
# 旧库 / 旧命名空间只读、不删（回滚兜底；L3 删，先列清单）。账号 styrigx-account、奇趣 / 日刻 core、预览库不动。
# 细节、核对规则见 space/scripts/d1-cutover.mjs 开头。（2026-11-07 那一次三个旧库 → styrigx-space-gateway 的版本见 git 历史，PR #304）
#
# 顺序（写在 PR 正文里）：
#   1. 合并 PR（squash）。main 推送的部署里 d1-cutover-gate 在 styrigx-space-core 里见不到搬迁标记 → ai / status / space-core / curio-core / daymark-core 部署全部跳过
#      （线上还是旧代码、旧库，不受影响）。
#   2. 跑本工作流 dry_run = true：只读旧库和新库，本机按迁移建表试导入，逐表比对行数；不写任何远端。
#   3. 短暂停写（几分钟：尽量别改解锁密码 / 通行密钥 / 临时钥匙 / 分享链接）里跑 dry_run = false：
#      kv（照搬 + 逐值核对）→ d1（两套迁移 → 导出 → 导入 → 逐表核对 → 写标记）。任何一步不一致即失败、不写标记；可直接重跑。
#   4. 重跑 deploy.yml（workflow_dispatch，main）：gate 放行；deploy-space-core 在部署新绑定前先 resync（凭证 / 钥匙 / 链接表再和旧库比一遍，
#      搬完之后又变了的整表重拷），部署 + 冒烟通过后写 switched 标记。
#   5. 部署后跑一次 verify_only = true，看旧库和新库的差异报告（只报告）。
# 不上传任何导出文件（里面有进站凭证）；日志只有表名、行数和哈希前缀。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = 只读演练（不写远端）；false = 正式搬迁'
        type: boolean
        default: true
      verify_only:
        description: 'true = 只核对旧库和新库（部署后看差异；不导入、不写标记）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: d1-cutover
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.152.0'

jobs:
  kv:
    # 搜索索引 KV：site:* 会被 CI / Cron 重建，但 ai:models 是手写值，所以整个命名空间照搬。
    # token：styrigx-ai-deploy（GitHub 环境 STYRIGX_AI_DEPLOY；Workers KV Storage 编辑，范围整个账号，读旧命名空间写新命名空间都够）。
    # 读写这个 KV 的只有 ai（读）、curio-core / daymark-core（写自己的 site:*）和 deploy-ai-worker（写 site:space / site:blog），space-core 不绑，
    # 所以 space-core 的部署 token 不用加 KV 权限。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: STYRIGX_AI_DEPLOY
    outputs:
      keys: ${{ steps.kv.outputs.keys }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Copy KV styrigx-space-gateway → styrigx-space-core
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_AI_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.verify_only && '--verify' || (inputs.dry_run && '--dry-run' || '') }}
        run: node space/scripts/d1-cutover.mjs kv $MODE

  d1:
    # token：styrigx-status-deploy（GitHub 环境 STYRIGX_STATUS_DEPLOY；D1 编辑是账号级权限，读旧库、写两个新库都够）。
    if: github.ref == 'refs/heads/main'
    needs: kv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: STYRIGX_STATUS_DEPLOY
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply D1 migrations to styrigx-space-core / styrigx-status
        # 只建表建索引：space-core 一份基线 migrations/0001_baseline.sql（记录表 d1_migrations_core），
        # status 一份 migrations/0001_baseline.sql（记录表 d1_migrations_status）。已迁过的跳过。
        if: ${{ !inputs.dry_run && !inputs.verify_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          (cd workers/status && npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply styrigx-status --remote)
          (cd workers/space-core && npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply D1_SPACE --remote)

      - name: Export → import → per-table check (styrigx-space-gateway → styrigx-status / styrigx-space-core)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STYRIGX_STATUS_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.verify_only && '--verify' || (inputs.dry_run && '--dry-run' || '') }}
          KV_KEYS: ${{ needs.kv.outputs.keys }}
        run: node space/scripts/d1-cutover.mjs d1 $MODE --kv-keys "$KV_KEYS"

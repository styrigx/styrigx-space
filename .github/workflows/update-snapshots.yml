name: Update visual snapshots
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "要更新基线的分支（不要填 main）"
        required: true
permissions:
  contents: write   # 把新基线推回该分支
  actions: write    # 推完后用 GITHUB_TOKEN 触发 deploy.yml
env:
  NODE_VERSION: '22'        # 与 deploy.yml 保持一致（Hugo 版本只在 .github/actions/setup-hugo 定义）
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Refuse main
        # 分支名只经 env 传入 shell，不拼进脚本；main / refs/heads/main 都拒绝
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          b="${BRANCH#refs/heads/}"
          if [ -z "$b" ] || [ "$b" = "main" ]; then
            echo "::error::不要在 main 上更新基线"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.branch }}
      - name: Setup Hugo (shared action; same as deploy.yml)
        uses: ./.github/actions/setup-hugo
      - name: Setup Node + install dependencies (lockfile)
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Playwright Chromium + CJK fonts (shared action; same as deploy.yml quality)
        # 视觉回归对比中文截图；字体与浏览器的安装 / 缓存方式和 deploy.yml 同一个 action，基线渲染环境一致
        uses: ./.github/actions/setup-playwright
        with:
          cjk-fonts: 'true'
      - name: Build CSS
        run: node space/scripts/build-css.cjs --minify
      - name: Update lock screen baseline (生产构建，锁屏启用；同 deploy.yml 的锁屏截图步骤)
        run: |
          hugo --minify -s space/web
          SGX_TEST_SUITE=lock npx playwright test --config=tests/config/playwright.config.js --grep "baseline screenshot" --update-snapshots
      - name: Test build (same as deploy.yml visual step)
        run: |
          hugo --minify -s space/web
        env:
          SGX_TEST_NO_LOCK: "1"
          SGX_TEST_NO_WEATHER: "1"
      - name: Update snapshots
        run: npx playwright test --config=tests/config/playwright.config.js visual.spec.js --update-snapshots
      - name: Update blog snapshots (子站博客视觉回归；同 deploy.yml 的子站 Playwright)
        # 2026-11 合站：博客和主站同一个 Hugo 站，上一步的测试构建 space/web/public 里就有 /blog/（测试开关只影响主站模板），直接对着它生成
        run: |
          npx playwright test --config=tests/blog/config/playwright.config.js blog-visual.spec.js --update-snapshots
      - name: Commit snapshots only
        id: commit
        run: |
          git checkout -- space/web/data/ 2>/dev/null || true   # 生产构建生成的数据文件不提交
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只 add 存在的（或仓库里还跟踪着的）基线目录：截图开关 SHOTS=false / 某组还没生成基线时目录不存在，
          # 直接 git add 会 "pathspec did not match" 退出 128（run 42478955025）。-A 让整组被删的基线也记成删除。
          paths=()
          for p in tests/space/e2e/visual/visual.spec.js-snapshots tests/space/e2e/visual/lock.spec.js-snapshots tests/blog/e2e/blog-visual.spec.js-snapshots; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then paths+=("$p"); else echo "跳过 $p（没有生成、仓库里也没有）"; fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then echo "没有任何基线目录（截图开关都关着？），不提交"; exit 0; fi
          git add -A -- "${paths[@]}"
          git diff --cached --quiet && echo "基线无变化" && exit 0
          git diff --cached --stat
          git commit -m "[UI] CI 更新视觉基线 (ubuntu-24.04)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN 的 push 不会触发 deploy.yml，这里显式 dispatch 一次。
      # deploy.yml 的部署 job 只在 main 上跑，非 main 分支只跑测试，不会部署生产。
      - name: Trigger CI on the updated branch
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref "$BRANCH"
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

name: Update visual snapshots
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "要更新基线的分支（不要填 main）"
        required: true
permissions:
  contents: write
  actions: write   # B1-11：推完基线后用 GITHUB_TOKEN 触发 deploy.yml
env:
  HUGO_VERSION: '0.168.0'   # 与 deploy.yml 保持一致
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse main
        if: inputs.branch == 'main'
        run: echo "不要在 main 上更新基线" && exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install
      - run: npm install --no-save @playwright/test stylelint postcss-scss @lhci/cli http-server && npx playwright install chromium --with-deps
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Build CSS
        run: node scripts/build-css.cjs --minify
      - name: Update lock screen baseline (生产构建，锁屏启用；同 deploy.yml 的锁屏截图步骤)
        run: |
          node scripts/gen-posts-json.mjs
          hugo --minify -s web
          SGX_TEST_SUITE=lock npx playwright test --config=tests/config/playwright.config.js --grep "baseline screenshot" --update-snapshots
        env:
          # 同 deploy.yml：匿名读博客仓库会撞 GitHub API 限流（runner 共享 IP，403），必须带 token
          BLOG_TOKEN: ${{ secrets.BLOG_READ_TOKEN || github.token }}
      - name: Test build (same as deploy.yml visual step)
        run: |
          sed -i "s/0x4AAAAAAFSBhpWkAwZr1SMA/1x00000000000000000000AA/g" web/hugo.yaml
          cp web/data/posts.fixture.json web/data/posts.json
          hugo --minify -s web
        env:
          SGX_TEST_NO_LOCK: "1"
          SGX_TEST_NO_WEATHER: "1"
      - name: Update snapshots
        run: npx playwright test --config=tests/config/playwright.config.js visual.spec.js --update-snapshots
      - name: Commit snapshots only
        id: commit
        run: |
          git checkout -- web/hugo.yaml   # 丢掉测试用 Turnstile key 替换
          rm -f web/data/posts.json       # fixture 复制的临时文件，未被 git 跟踪
          git checkout -- web/data/ 2>/dev/null || true   # 生产构建生成的数据文件不提交
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/web/e2e/visual/visual.spec.js-snapshots tests/web/e2e/visual/lock.spec.js-snapshots
          git diff --cached --quiet && echo "基线无变化" && exit 0
          git diff --cached --stat
          git commit -m "[UI] CI 更新视觉基线 (ubuntu-24.04)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # B1-11：GITHUB_TOKEN 的 push 不会触发 deploy.yml，这里显式 dispatch 一次。
      # deploy.yml 的 build-and-deploy 只在 main 上跑，非 main 分支只跑测试，不会部署生产。
      - name: Trigger CI on the updated branch
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref "${{ inputs.branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

name: Update visual snapshots
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "要更新基线的分支（不要填 main）"
        required: true
permissions:
  contents: write   # 把新基线推回该分支
  actions: write    # 推完后用 GITHUB_TOKEN 触发 deploy.yml
env:
  HUGO_VERSION: '0.168.0'   # 与 deploy.yml 保持一致
  NODE_VERSION: '22'        # 与 deploy.yml 保持一致
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Refuse main
        # 分支名只经 env 传入 shell，不拼进脚本；main / refs/heads/main 都拒绝
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          b="${BRANCH#refs/heads/}"
          if [ -z "$b" ] || [ "$b" = "main" ]; then
            echo "::error::不要在 main 上更新基线"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.branch }}
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Build CSS
        run: node scripts/build-css.cjs --minify
      - name: Update lock screen baseline (生产构建，锁屏启用；同 deploy.yml 的锁屏截图步骤)
        run: |
          hugo --minify -s web
          SGX_TEST_SUITE=lock npx playwright test --config=tests/config/playwright.config.js --grep "baseline screenshot" --update-snapshots
      - name: Test build (same as deploy.yml visual step)
        run: |
          hugo --minify -s web
        env:
          SGX_TEST_NO_LOCK: "1"
          SGX_TEST_NO_WEATHER: "1"
      - name: Update snapshots
        run: npx playwright test --config=tests/config/playwright.config.js visual.spec.js --update-snapshots
      - name: Commit snapshots only
        id: commit
        run: |
          git checkout -- web/data/ 2>/dev/null || true   # 生产构建生成的数据文件不提交
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/web/e2e/visual/visual.spec.js-snapshots tests/web/e2e/visual/lock.spec.js-snapshots
          git diff --cached --quiet && echo "基线无变化" && exit 0
          git diff --cached --stat
          git commit -m "[UI] CI 更新视觉基线 (ubuntu-24.04)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN 的 push 不会触发 deploy.yml，这里显式 dispatch 一次。
      # deploy.yml 的部署 job 只在 main 上跑，非 main 分支只跑测试，不会部署生产。
      - name: Trigger CI on the updated branch
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref "$BRANCH"
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

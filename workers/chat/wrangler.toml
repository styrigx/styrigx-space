# styrigx-chat：聊天后端（CI 部署；只干一件事——把主站聊天页的对话转给模型、把回答流回去，2026-10-22 从网关拆出来）
#
# 没有公开地址：不开 workers.dev、不开预览地址、不挂路由、不挂域名。唯一入口是鉴权网关 styrigx-auth-gateway 的服务绑定 CHAT：
#   主站 /api/chat 先由网关验门（同源 + 锁屏会话 + 只许站长），再转进来（GET → /models，POST → /chat），回答原样流回浏览器。
# 所以这里不验 cookie；入口只认网关写的 X-Sgx-Role: owner（src/index.js）。不存任何对话。
#
# 钥匙只有一把：Gemini API key，放在 Secrets Store 的 SGX_CHAT_API_KEY（见文件末尾），仓库里不写值。
#   部署前要先在 Secrets Store 建好这个密钥（作用域含 workers）：部署时 Cloudflare 会核对每个 Secrets Store 绑定，
#   绑定一个还不存在的密钥会让本 Worker 部署失败。网关不再绑定这把钥匙，所以它没建好不影响网关部署
#   （deploy.yml 的 deploy-chat-worker 失败时会退一步部署不带钥匙绑定的版本，聊天回 503 no_key）。

name = "styrigx-chat"
main = "src/index.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

# ---- 明文变量 ----
# CHAT_PROVIDER = "gemini"（原生 streamGenerateContent + Google 搜索接地）或 "openai"（任意 OpenAI 兼容接口，没有联网检索）。
# 免费档能用 Google 搜索接地的只有 gemini-2.5-flash / gemini-2.5-flash-lite（每天合计 500 次）；Gemini 的 OpenAI 兼容端点不支持搜索接地。
# 钥匙没配 / 读不到 → /api/chat 回 503 no_key。
[vars]
CHAT_PROVIDER = "gemini"
CHAT_API_BASE = "https://generativelanguage.googleapis.com/v1beta"
CHAT_MODEL = "gemini-2.5-flash"
CHAT_SEARCH = "on"
# 模型切换（2026-10-22）：聊天页可选的模型白名单，POST 只认这里的 id（GET 把列表给页面）。CHAT_MODEL 是默认。
# search = 带不带 Google 搜索 / url_context 工具：免费档只有 2.5 Flash / Flash-Lite 能搜索接地（合计每天 500 次）；
# Gemini 3+ 免费档能免费生成文字，但搜索接地是「Not available」（ai.google.dev 价格页，2026-10-22），所以不联网。
# CHAT_SEARCH = "off" 仍是总开关（哪个都不联网）。坏 JSON → 退回只有 CHAT_MODEL 一个。
CHAT_MODELS = '[{"id":"gemini-2.5-flash","label":"Gemini 2.5 Flash","search":true},{"id":"gemini-2.5-flash-lite","label":"Gemini 2.5 Flash-Lite","search":true},{"id":"gemini-3.8-flash","label":"Gemini 3.8 Flash","search":false},{"id":"gemini-3.5-flash-lite","label":"Gemini 3.5 Flash-Lite","search":false}]'

# ---- 密钥：Secrets Store（和鉴权网关同一个 store；store_id 是存储的编号，不是密值）----
# 聊天钥匙（Gemini API key，不绑结算的 Google 小号）：只有 POST 用到时才读（src/chat.js）。
# 注意：本段必须留在文件最后——deploy.yml 的退路部署按「从第一个 [[secrets_store_secrets]] 到文件末尾」整段删掉。
[[secrets_store_secrets]]
binding = "SGX_CHAT_API_KEY"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_CHAT_API_KEY"

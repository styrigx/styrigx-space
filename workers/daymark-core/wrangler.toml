# styrigx-daymark-core：日刻的核心 Worker（存句子、读句子、今日一句）（CI 部署：styrigx-space deploy.yml 的 deploy-daymark-core；承接 styrigx.com/daymark/api/*）
#
# 全部后端代码都在本目录：src/（入口、路由表、接口）+ migrations/（D1）。
# 页面是主站 Pages styrigx-space 单树里的 /daymark/（atlas/web/daymark/）静态文件；页面的会话检查在主站鉴权网关。
#
# 安全：
# - 本 Worker 不持任何钥匙。会话交给鉴权网关验（服务绑定 AUTH → AuthVerifier.conclusion）。
# - workers_dev = false、preview_urls = false：只通过 styrigx.com/daymark/api/* 路由访问（它连的是正式 D1）。

name = "styrigx-daymark-core"
main = "src/index.js"
compatibility_date = "2026-10-20"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

# 路由（合并 PR3，2026-11-03）：主域名 styrigx.com/daymark/api/*（单树里本站前缀 /daymark），比网关的 styrigx.com/* 更具体，接口请求直接落到本 Worker。
# 旧图志域名下的过渡期接口路由已于 P4-3 PR-1 删除。
# 页面路径和 /api/lock-session-check、/api/search 归主站鉴权网关（workers/auth-gateway/wrangler.toml），这里只管本站接口。
# 部署 token 要有 styrigx.com 区域的 Workers Routes 编辑（wrangler deploy 按这里的列表整体覆盖线上路由）。
[[routes]]
pattern = "styrigx.com/daymark/api/*"
zone_name = "styrigx.com"

[[d1_databases]]
binding = "D1_QUOTES"
database_name = "styrigx-daymark-core"
database_id = "27f93d06-9cd9-48d9-bd77-8584f68adb1e"
migrations_dir = "migrations"

# 鉴权：主站鉴权网关的 RPC 入口 AuthVerifier（conclusion(cookieHeader, clientContext, opts) → { lock, account }，见 src/api/_auth.js）。
# 网关必须先部署出 AuthVerifier 入口，本 Worker 才能部署（CI 的 Gate check 会核对）。
[[services]]
binding = "AUTH"
service = "styrigx-auth-gateway"
entrypoint = "AuthVerifier"

# 全站搜索索引：KV styrigx-space-gateway（2026-11 由 styrigx-search-index 换过来，主站 styrigx-ai 读它），本 Worker 只写 site:daymark 这一条。
# 写接口成功后重建（src/search-index.js），下面的 Cron 每小时兜底；KV 里只有句子的标题、署名、链接，不是钥匙。
[[kv_namespaces]]
binding = "KV_SEARCH_INDEX"
id = "608cf3e27184481cbca2922950506d87"

# Cron：每小时第 17 分重建一次搜索索引（首次部署后也靠它填上）。
[triggers]
crons = ["17 * * * *"]

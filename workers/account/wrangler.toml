# styrigx-account：账号数据 Worker（CI 部署；2026-10-24 从鉴权网关 styrigx-auth-gateway 拆出来）
#
# 管管理员账号名下的三样数据：头像（KV_PROFILE）、设置云同步（D1_SETTINGS_SYNC，含主题等外观设置）、数字健康（D1_WELLBEING）。
# 代码：src/（入口 index.js、门 gate.js、会话 auth.js、接口 api/、公共 lib/）+ migrations/（D1 styrigx-account）。
#
# 安全：
# - 不持任何钥匙、不绑认证库（styrigx-auth-gateway 的 KV/D1）。会话全部问网关：服务绑定 AUTH → AuthVerifier（RPC），
#   和这些接口还在网关里时是同一套验签代码（verifyLockSession / verifyAccountSession）。
# - workers_dev = false、preview_urls = false：不开 *.workers.dev 和预览地址（它连的是正式 KV/D1，只许经 styrigx.com 的路由进来）。
# - SGX_ENV = "production"：门（src/gate.js）按生产规则执行，同网关 middleware。

name = "styrigx-account"
main = "src/index.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

# 路由：本 Worker 只接这几条路径，比网关的 styrigx.com/* 更具体，所以先命中这里（前端地址不变）。
# 都用结尾 *：Cloudflare 不带 * 的规则遇到查询串不命中（/api/wellbeing?d=…、/avatar/192.webp?v=… 都带查询串），见 scripts/lib/cf-routes.mjs。
# scripts/check-worker-routes.mjs 在 CI 里核对：这几条路径归本 Worker，网关的接口一条都没被抢走，页面仍归网关。
# 注意：删掉这里的路由 = 请求回到网关，网关已经没有这几个接口（/api/* 404、头像落到静态默认图），不能靠删路由回滚。
[[routes]]
pattern = "styrigx.com/api/avatar*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/api/prefs*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/api/wellbeing*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/avatar/*"
zone_name = "styrigx.com"

[vars]
SGX_ENV = "production"
# WebAuthn 依赖方（账号 Passkey 登录 / 注册），值同网关 workers/auth-gateway/wrangler.toml（2026-10-29 PR2）。
SGX_RP_ID = "styrigx.com"
SGX_ORIGIN = "https://styrigx.com"

# ---- 服务绑定：会话问网关 ----
# styrigx-auth-gateway 的 AuthVerifier（src/rpc.js：lockSession() 锁屏会话、accountSession() 账号会话）。
# 部署顺序：deploy.yml 里 deploy-account-worker 在 deploy-auth-worker 之后（要先有带 accountSession() 的网关）。
[[services]]
binding = "AUTH"
service = "styrigx-auth-gateway"
entrypoint = "AuthVerifier"

# ---- 数据绑定（正式）----
# 账号资料库 KV styrigx-account：KV_PROFILE 只放公开的头像 avatar:*。
# 2026-10-28 起云同步不在 KV 了（KV_SETTINGS_SYNC 绑定已删，见下面 D1_SETTINGS_SYNC）；旧键 account-prefs 已导入 D1，
# 2026-10-29 从 KV 删除，库里只剩 avatar:*。
[[kv_namespaces]]
binding = "KV_PROFILE"
id = "b20701f5f48e498e897bc6f0bd81643f"

# D1 styrigx-account：一个库两套数据，id 相同。
# D1_WELLBEING = wb_daily（migrations/0001_wellbeing.sql）。
[[d1_databases]]
binding = "D1_WELLBEING"
database_name = "styrigx-account"
database_id = "03f60d23-9c2f-4f3d-a692-764ccaac6f5d"
migrations_dir = "migrations"

# D1_SETTINGS_SYNC = settings_sync 云同步（migrations/0002_settings_sync.sql；src/api/prefs.js，逐项新的赢在 SQL 里原子完成）。
# 2026-10-28 上线前用 scripts/migrate-prefs-kv-to-d1.mjs 把 KV 里的 account-prefs 导入过（旧键 2026-10-29 已删，脚本只剩历史意义）。
[[d1_databases]]
binding = "D1_SETTINGS_SYNC"
database_name = "styrigx-account"
database_id = "03f60d23-9c2f-4f3d-a692-764ccaac6f5d"
migrations_dir = "migrations"

# D1_ACCOUNT_AUTH = 账号鉴权状态（2026-10-29 PR2，migrations/0003_account_auth.sql：epoch、password、passkey、user_handle、challenge、
# attempt_limit、device、audit、data_migration，每张表 realm 列 = 'account'；见 src/identity/realm.js REALM_ACCOUNT.d1Binding）。
# 同一个库 styrigx-account；和网关里同名的 D1_ACCOUNT_AUTH（指向 styrigx-auth-gateway）不是一个库，网关那个 PR4 删。
# PR2 暗上线：表随账号部署 job 的 d1 migrations apply 建好，代码还没有入口读写它（PR3 切流）。
[[d1_databases]]
binding = "D1_ACCOUNT_AUTH"
database_name = "styrigx-account"
database_id = "03f60d23-9c2f-4f3d-a692-764ccaac6f5d"
migrations_dir = "migrations"

# ---- 密钥：Secrets Store（2026-10-29 PR2；读法见 src/secrets.js，Secrets Store 对象换成字符串、60 秒缓存）----
# 和网关同一个 store；binding = secret_name。store_id 是存储的编号，不是密值。
# - SGX_ACCOUNT_PRIVATE / SGX_ACCOUNT_PUBLIC：账号票签名钥匙，与网关绑的是同一对密值（切换时现有账号票继续有效）
# - SGX_ACCOUNT_ROOT_KEY：账号根密钥，新建（值与锁屏根密钥不同），部署前要先在 Cloudflare 后台建好
# - SGX_PW_PEPPER：账号密码哈希的 pepper，与网关同一个密值
# 部署 token 要有 Secrets Store 编辑权限（带 Secrets Store 绑定部署必须 Edit，否则报 10021）。
[[secrets_store_secrets]]
binding = "SGX_ACCOUNT_PRIVATE"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ACCOUNT_PRIVATE"

[[secrets_store_secrets]]
binding = "SGX_ACCOUNT_PUBLIC"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ACCOUNT_PUBLIC"

[[secrets_store_secrets]]
binding = "SGX_ACCOUNT_ROOT_KEY"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ACCOUNT_ROOT_KEY"

[[secrets_store_secrets]]
binding = "SGX_PW_PEPPER"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_PW_PEPPER"

# ---- preview 环境（还没有部署它的 CI job；预览 KV / D1 已登记，CI 的 passkey-e2e 会给预览 D1 跑迁移，以后给预览测试用）----
# 绝不指向正式库。routes = [] 必须写：routes 会从顶层继承，不写的话预览 Worker 会去抢正式路由。
[env.preview]
name = "styrigx-account-preview"
workers_dev = false
preview_urls = false
routes = []

[env.preview.vars]
SGX_ENV = "preview"

# 预览 KV（测试专用 namespace，2026-10-29 起所有 Worker 的预览共用）：KV_PROFILE 只放公开的头像 avatar:*（云同步不在 KV，见下面的预览 D1）。
[[env.preview.kv_namespaces]]
binding = "KV_PROFILE"
id = "193b4d68b8ac4c6f8c0ba16b5ea78b14"

# 预览 D1 = 测试专用库 styrigx-test-preview（2026-10-29 起所有 Worker 的预览共用：网关 / 账号 / 短链的表名互不重叠），两段同一个 id。
# 迁移记录表单独用 d1_migrations_account：三套迁移目录进同一个库，各记各的，文件名将来重名也不会互相跳过。
[[env.preview.d1_databases]]
binding = "D1_WELLBEING"
database_name = "styrigx-test-preview"
database_id = "1339bb0b-f9f8-4e3d-b413-ff07ca28ce69"
migrations_dir = "migrations"
migrations_table = "d1_migrations_account"

[[env.preview.d1_databases]]
binding = "D1_SETTINGS_SYNC"
database_name = "styrigx-test-preview"
database_id = "1339bb0b-f9f8-4e3d-b413-ff07ca28ce69"
migrations_dir = "migrations"
migrations_table = "d1_migrations_account"

# D1_ACCOUNT_AUTH 预览 = 同一个测试库（2026-10-29 PR2），迁移记录表同样 d1_migrations_account。
[[env.preview.d1_databases]]
binding = "D1_ACCOUNT_AUTH"
database_name = "styrigx-test-preview"
database_id = "1339bb0b-f9f8-4e3d-b413-ff07ca28ce69"
migrations_dir = "migrations"
migrations_table = "d1_migrations_account"

# 预览密钥照网关预览的做法（web/wrangler.toml [env.preview]）：不绑 Secrets Store（不继承正式的 secrets_store_secrets），
# 测试密钥由 CI 每次部署前现生成、写成普通 Secret，不进 toml、不进 GitHub Secrets。该环境还没有部署 job。

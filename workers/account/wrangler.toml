# styrigx-account：账号 Worker（CI 部署；完整的账号系统，账号拆分 PR3）
#
# 管站点账号的全部身份和数据：账号密码、账号通行密钥、恢复密钥、已登录设备、session / reauth / reset 三张票、应用授权、审计（D1_ACCOUNT 的 account_* 表），
# 以及头像 / 个人资料（KV_PROFILE）、设置云同步（D1_ACCOUNT 的 settings_sync）。
# 代码：src/（部署入口 index.js：默认 fetch = app.js（一律 404），命名入口 rpc/account-service.js AccountService、rpc/account-verifier.js AccountVerifier；
# 身份头门 gate.js、路由 router.js、接口 api/、账号身份 core/、公共 lib/；骨架见 workers/README.md）+ migrations/（D1 styrigx-account）。分层与边界见 workers/account/README.md、docs/architecture/overview.md「Worker 边界」。
#
# 安全（方案第 3 节三道保险）：
# - 没有任何 [[routes]]：请求只经网关 styrigx-space-core 的服务绑定 ACCOUNT / ACCOUNT_VERIFIER 进来（网关先验锁屏、剥外部 x-styrigx-* 头、写规范身份头）。
# - 默认 fetch 一律 404；只有命名入口 AccountService 读身份头。
# - workers_dev = false、preview_urls = false：不开 *.workers.dev 和预览地址。
# - 不调网关、不绑任何锁屏数据或钥匙（不再有 [[services]] AUTH）。唯一的服务绑定是 PROXY → styrigx-proxy-rules 的 ProxyAdmin（代理订阅管理，不是网关）。

name = "styrigx-account"
main = "src/index.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

# Smart Placement：本 Worker 频繁读 D1，让 Cloudflare 把执行位置放在离数据库近的地方，降 D1 往返延迟。
[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 1

# 路由：没有（账号拆分 PR3 删掉原来的 4 条 styrigx.com/api/avatar*、/api/prefs*、/api/wellbeing*、/avatar/*；方案第 4 节）。
# 这几条路径归网关的 styrigx.com/*，在网关转发表 workers/space-core/src/router.js FORWARDING 里；space/scripts/check/check-worker-routes.mjs 核对本 Worker 没有任何路由。
# 部署后要在 Cloudflare 后台核对 styrigx.com 的 Workers Routes 里已经没有指向 styrigx-account 的路由（残留就手删；残留期间默认 fetch 也只回 404）。

[vars]
SGX_ENV = "production"
# WebAuthn 依赖方（账号 Passkey 登录 / 注册），值同网关 workers/space-core/wrangler.toml（2026-10-29 PR2）。
SGX_RP_ID = "styrigx.com"
SGX_ORIGIN = "https://styrigx.com"

# ---- 数据绑定（正式）----
# 账号资料库 KV styrigx-account：KV_PROFILE 只放公开数据——头像 avatar:* 和个人资料 profile（JSON，2026-11-07）。
# 2026-10-28 起云同步不在 KV 了（KV_SETTINGS_SYNC 绑定已删，见下面 D1_SETTINGS_SYNC）；旧键 account-prefs 已导入 D1，
# 2026-10-29 从 KV 删除，库里只剩 avatar:*。
[[kv_namespaces]]
binding = "KV_PROFILE"
id = "b20701f5f48e498e897bc6f0bd81643f"

# D1 styrigx-account：一个库两套数据，id 相同。
# （命名 v2 起是一个库一个绑定 D1_ACCOUNT：账号 account_*、云同步 settings_sync；原来同一个库挂了三个名字。）
# 功能靠表名分开：账号 account_*（migrations/0003 → 0005_account_tables.sql）、云同步 settings_sync（0002，src/api/prefs.js）。数字健康 wb_daily（0001）v6 P4 删除，drop 见 docs/ops/v6-p4-drop-wellbeing.sql。
# 表随账号部署 job 的 d1 migrations apply 建好。
[[d1_databases]]
binding = "D1_ACCOUNT"
database_name = "styrigx-account"
database_id = "03f60d23-9c2f-4f3d-a692-764ccaac6f5d"
migrations_dir = "migrations"

# ---- 密钥：Secrets Store（2026-10-29 PR2；读法见 src/secrets.js，Secrets Store 对象换成字符串、60 秒缓存）----
# 和网关同一个 store；binding = secret_name。store_id 是存储的编号，不是密值。
# - SGX_ACCOUNT_PASSWORD_PEPPER：账号密码哈希的 pepper，账号独占（命名 v2 起不再和网关共用）
# - SGX_ACCOUNT_RESCUE_KEY（v6 P3，定稿 v5.2 §九）：救援钥匙。救援入口（POST /api/identity action rescue）只读 get() 做恒定时间比对；
#   Gray 在 dashboard 设值 / 换值（每次救援后换），运行时生效不用重部署。只绑定，不碰值。
# - v6 P4（定稿 v5.2 §十三）删除绑定：SGX_ACCOUNT_RECOVERY_KEY（旧恢复钥匙）、SGX_SPACE_PASSWORD_PEPPER（旧 pepper；部署前须用 docs/ops/v6-p4-predeploy-check.sql 核生产库无 pepper_id = 'space' 行）。
#   签名钥匙对 SGX_ACCOUNT_PRIVATE / SGX_ACCOUNT_PUBLIC 删除（定稿 v5.3 §十二：v6 会话是随机令牌不签名、APP 令牌已删）；secret 由 Gray 在部署绿后自行删除。
# 部署 token 要有 Secrets Store 编辑权限（带 Secrets Store 绑定部署必须 Edit，否则报 10021）。
[[secrets_store_secrets]]
binding = "SGX_ACCOUNT_PASSWORD_PEPPER"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ACCOUNT_PASSWORD_PEPPER"

[[secrets_store_secrets]]
binding = "SGX_ACCOUNT_RESCUE_KEY"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ACCOUNT_RESCUE_KEY"

# ---- 服务绑定：代理订阅管理（设计稿 v1.7 §7；/api/account/proxy 验完会话 / reauth 后调）----
# 订阅的数据和 SGX_PROXY_DB_KEY 只在 styrigx-proxy-rules；本 Worker 只转发。预览环境不绑（/api/account/proxy 回 503 config）。
[[services]]
binding = "PROXY"
service = "styrigx-proxy-rules"
entrypoint = "ProxyAdmin"

# ---- preview 环境：只用来登记测试资源（所有预览资源都是同一个 styrigx-test-preview：KV / D1，2026-10-30 Sloan 定），----
# CI 的 passkey-e2e 据此给测试库跑账号迁移。不部署成单独的预览 Worker（不写预览 name）；预览里的账号代码由组合入口
# tests/space/e2e/helpers/preview-worker.js 在进程内跑，连的就是这里登记的测试资源。
# 绝不指向正式库。routes = [] 照写：万一有人对它 deploy，也不会继承顶层路由去抢正式流量。
[env.preview]
workers_dev = false
preview_urls = false
routes = []

[env.preview.vars]
SGX_ENV = "preview"

# 预览 KV = styrigx-test-preview（测试专用 namespace，所有 Worker 的预览共用）：KV_PROFILE 只放公开的头像 avatar:* 和个人资料 profile（云同步不在 KV，见下面的预览 D1）。
[[env.preview.kv_namespaces]]
binding = "KV_PROFILE"
id = "193b4d68b8ac4c6f8c0ba16b5ea78b14"

# 预览 D1 = 测试专用库 styrigx-test-preview（所有 Worker 的预览共用：网关 / 账号 / 短链的表名互不重叠）。
# 迁移记录表单独用 d1_migrations_account：三套迁移目录进同一个库，各记各的。
[[env.preview.d1_databases]]
binding = "D1_ACCOUNT"
database_name = "styrigx-test-preview"
database_id = "1339bb0b-f9f8-4e3d-b413-ff07ca28ce69"
migrations_dir = "migrations"
migrations_table = "d1_migrations_account"

# 预览密钥：不绑 Secrets Store（不继承正式的 secrets_store_secrets）；测试密钥由 CI 每次现生成，不进 toml、不进 GitHub Secrets。

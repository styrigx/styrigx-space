# styrigx-atlas-core：内容层接口 Worker（Atlas 后端合并，2026-11-14 设计稿第一项）。
# 奇趣（原 styrigx-curio-core）、日刻（原 styrigx-daymark-core）合成一个 Worker、一个 D1、一个 R2；公开路径 /curio/api/*、/daymark/api/* 不变。
# D1 styrigx-atlas-core、R2 styrigx-atlas-core（Standard）2026-11-14 04:50 建好（Gray 点头），数据 04:51 从旧两库一桶迁入。
# 2026-11-14 16:31 D1 统一迁到 WNAM（经临时库两跳，同名重建：0137776d-…）；R2 迁 WNAM 另行。
# 路由：切换窗口里先用 Cloudflare 路由接口把旧两个 Worker 的两条路由直接改指本 Worker（不留空档），本 PR 合并后由 deploy-atlas-core 按这里接管。
# 旧 Worker 已下线，workers/ 下的旧目录已删（2026-11-14 合并进 atlas-core）。
# 绑定名和旧 Worker 一字不差（D1_FINDS…D1_MUSIC、D1_QUOTES 全指同一个库，R2_PHOTOS / R2_MUSIC 同一个桶），业务代码不改。
# 奇趣重组 PR 3（2026-11-23）删掉了设备、电影：绑定 D1_DEVICES、D1_MOVIES 一起去掉（库是同一个，不影响别的绑定）。

name = "styrigx-atlas-core"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "styrigx.com/curio/api/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/daymark/api/*"
zone_name = "styrigx.com"

# 音乐接口（music 搬家设计稿 v1.0 第 2 步加；第 4 步删掉旧 /curio/api/music*：那些地址仍落在上面 /curio/api/* 这条，由本 Worker 当表外路径回 401）
[[routes]]
pattern = "styrigx.com/music/api/*"
zone_name = "styrigx.com"

# 游戏接口（奇趣重组设计稿 v1.0 第三节 PR 1 加；旧 /curio/api/items、/curio/api/photo PR 3 删了，落在上面 /curio/api/* 这条当表外路径回 401）。
# 部署时 wrangler 按这里在 CF 上建这条路由：Gray 单独批
[[routes]]
pattern = "styrigx.com/games/api/*"
zone_name = "styrigx.com"

[observability]
enabled = true
head_sampling_rate = 1

# 奇趣
[[d1_databases]]
binding = "D1_FINDS"
database_name = "styrigx-atlas-core"
database_id = "0137776d-f8d5-4726-a66c-49cf5778d970"
migrations_dir = "migrations"

[[d1_databases]]
binding = "D1_GAMES"
database_name = "styrigx-atlas-core"
database_id = "0137776d-f8d5-4726-a66c-49cf5778d970"

[[d1_databases]]
binding = "D1_MUSIC"
database_name = "styrigx-atlas-core"
database_id = "0137776d-f8d5-4726-a66c-49cf5778d970"

# 日刻
[[d1_databases]]
binding = "D1_QUOTES"
database_name = "styrigx-atlas-core"
database_id = "0137776d-f8d5-4726-a66c-49cf5778d970"

[[r2_buckets]]
binding = "R2_PHOTOS"
bucket_name = "styrigx-atlas-core"

[[r2_buckets]]
binding = "R2_MUSIC"
bucket_name = "styrigx-atlas-core"

[[services]]
binding = "SPACE"
service = "styrigx-space-core"
entrypoint = "SpaceVerifier"

# 全站搜索索引（和旧两个 Worker 同一个 KV；奇趣写 site:curio、日刻写 site:daymark，不变）
[[kv_namespaces]]
binding = "KV_SEARCH_INDEX"
id = "4bcdb84f205541b9b6c8d230bc2b106f"

[triggers]
crons = []

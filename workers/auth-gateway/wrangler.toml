# styrigx-auth-gateway：鉴权网关（CI 部署；承接 styrigx.com、blog.styrigx.com、daymark.styrigx.com、curio.styrigx.com 整站请求：会话检查 + 接口；静态资源原样回源）
#
# 主站后端代码在本目录：src/（入口、路由表、密钥）+ functions/（middleware、接口、内核）+ migrations/（D1）。
# 头像 / 云同步 / 数字健康在账号 Worker styrigx-account（workers/account，2026-10-24 拆出来，自己挂更具体的路由，会话经本 Worker 的 SessionVerifier RPC 验）。
# Pages 只放静态文件（配置见 web/wrangler.toml），网关验完会话回源取页面。
#
# 安全：
# - workers_dev = false，不开 *.workers.dev 地址（它连的是正式 KV/D1，不能有未鉴权的入口）。
# - SGX_ENV = "production"：middleware 按生产规则执行，非 styrigx.com 的 /api 请求一律 403。
# - 私密值只在 Secrets Store（见文件末尾），不进仓库。

name = "styrigx-auth-gateway"
main = "src/worker.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

# 日志：在后台 Observability 里看每个请求的路径、状态码、耗时和报错，方便切换后排查。
# 写在这里是为了不被 CI 部署覆盖（后台手动开的设置会被下一次部署改回）。
# 代码只打印错误名和非敏感诊断信息，不打印 cookie、令牌或密钥。免费版每天 20 万条、保留 3 天。
[observability]
enabled = true
head_sampling_rate = 1

# 路由：本文件就是网关 Worker 路由的唯一登记处（scripts/check-worker-routes.mjs 在 CI 里核对）。
# 2026-10-21 起三站都是整站一条通配路由（host/*）：
# - Cloudflare 的路由规则不带 * 时要求整条 URL（含查询串）完全相等。以前登记的 styrigx.com/、blog.styrigx.com/、
#   daymark.styrigx.com/ 这类精确规则遇到 ?lock=1、?utm=… 就不命中 → 请求直达 Pages：
#   锁屏入口 styrigx.com/?lock=1&return=… 没有会话标记、解锁后回不去子站；子站首页带任意查询串不验会话直出正文。
# - 通配后新增页面目录不会漏登记（fail closed）。静态资源（/css/ /js/ /fonts/ /fav/ /images/）也进 Worker，
#   但在 src/index.js 第一行就原样回源，不验会话、不改响应（与以前不登记时行为一致）。
# - 更具体的规则优先：daymark.styrigx.com/api/*（styrigx-daymark-core，另一个仓库）仍归句子接口 Worker；
#   daymark.styrigx.com/api/session-check 比它更具体，归网关。curio 同理：curio.styrigx.com/api/* 归 styrigx-curio-core
#   （styrigx-curio 仓库，收藏接口），curio.styrigx.com/api/session-check 归网关。
# 注意：Pages 上已经没有后端代码，删掉路由 = 页面不验会话，不能靠删路由回滚；出问题时 revert 对应提交重新部署。
[[routes]]
pattern = "styrigx.com/*"
zone_name = "styrigx.com"

# ---- 子站（src/subsites.js）----
[[routes]]
pattern = "blog.styrigx.com/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "daymark.styrigx.com/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "daymark.styrigx.com/api/session-check"
zone_name = "styrigx.com"

[[routes]]
pattern = "curio.styrigx.com/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "curio.styrigx.com/api/session-check"
zone_name = "styrigx.com"

# ---- 明文变量（公钥在 Secrets Store）----
[vars]
SGX_ENV = "production"
SGX_SITE = "space"
SGX_ORIGIN = "https://styrigx.com"
SGX_RP_ID = "styrigx.com"
# 聊天的 CHAT_* 变量（模型、白名单、联网开关）在 styrigx-chat（workers/chat/wrangler.toml），网关不带。

# ---- 服务绑定 ----
# 全站搜索 styrigx-search-index（workers/search-index；没有公开地址，只能从这里进）。/api/search 验完会话转给它。
# 部署顺序：deploy.yml 里 deploy-search-worker 先于本 Worker。
[[services]]
binding = "SEARCH"
service = "styrigx-search-index"

# 站点监测 styrigx-status（workers/status；没有公开地址，只能从这里进）。/api/status 验完会话转给它。
# 部署顺序：deploy.yml 里 deploy-status-worker 先于本 Worker。
[[services]]
binding = "STATUS"
service = "styrigx-status"

# 聊天 styrigx-chat（workers/chat，2026-10-22 从网关拆出来；没有公开地址，只能从这里进）。/api/chat 验完门（同源 + 会话 + 只许站长）转给它，
# 回答原样流回去。聊天钥匙 SGX_CHAT_API_KEY 只绑在它那边，网关不绑：钥匙没建好不影响网关部署。
# 部署顺序：deploy.yml 里 deploy-chat-worker 先于本 Worker。
[[services]]
binding = "CHAT"
service = "styrigx-chat"

# ---- 数据绑定（正式 KV/D1）----
# 绑定名 = <类型>_<存放的内容>（2026-10-24）：一个资源里有几套数据就绑几个名字，id 相同。
# 认证库 styrigx-auth-gateway（原 styrigx-owner，2026-10-22 改名，id 不变）：
# - KV_LOCK_DOOR：锁屏 / 门 / 根凭证（lock-pw、owner-pw、owner-passkey:*、owner-user-id*、pk-challenge:*、pw-fail:/pw-lock:*、
#   lockreset-challenge:*、recovery-switch、session-epoch、layer:*、root-auth-*），以及其余非 account- 键
# - KV_ACCOUNT_LOGIN：账号登录（account-epoch、account-challenge:*、account-dev:*、account-revoked:*）
[[kv_namespaces]]
binding = "KV_LOCK_DOOR"
id = "b796097c90104000992b7713f61e16ea"

[[kv_namespaces]]
binding = "KV_ACCOUNT_LOGIN"
id = "b796097c90104000992b7713f61e16ea"

# 账号资料库 styrigx-account（头像 KV_PROFILE、云同步 KV_SETTINGS_SYNC）和数字健康 D1_WELLBEING
# 2026-10-24 随接口一起搬到账号 Worker styrigx-account（workers/account/wrangler.toml），网关不再绑定。

# D1 styrigx-auth-gateway：D1_LOCK_RESET = recovery_switch。
[[d1_databases]]
binding = "D1_LOCK_RESET"
database_name = "styrigx-auth-gateway"
database_id = "6931d1da-3502-480d-b0bd-de1bc4829d1d"
migrations_dir = "migrations"

# ---- 密钥：Secrets Store ----
# 聊天钥匙 SGX_CHAT_API_KEY 不在这里（2026-10-22 起只绑在 styrigx-chat，见 workers/chat/wrangler.toml）。
# 4 个私密值 + 2 把公钥全放 Secrets Store（2026-10-23 访客改临时 LockKey，TURNSTILE_SECRET 不再绑定）（签名钥匙只剩账号 SGX_ACCOUNT_*、锁屏 SGX_LOCK_* 两套）：换钥只在 Cloudflare 后台改，不用改代码、不用重新部署（最多 60 秒生效）。
# store_id 是存储的编号，不是密值。
[[secrets_store_secrets]]
binding = "SGX_LOCK_PRIVATE"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_LOCK_PRIVATE"

[[secrets_store_secrets]]
binding = "SGX_ACCOUNT_PRIVATE"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ACCOUNT_PRIVATE"

[[secrets_store_secrets]]
binding = "SGX_ROOT_KEY"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ROOT_KEY"

[[secrets_store_secrets]]
binding = "SGX_PW_PEPPER"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_PW_PEPPER"

[[secrets_store_secrets]]
binding = "SGX_LOCK_PUBLIC"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_LOCK_PUBLIC"

[[secrets_store_secrets]]
binding = "SGX_ACCOUNT_PUBLIC"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ACCOUNT_PUBLIC"

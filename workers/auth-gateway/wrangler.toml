# styrigx-auth-gateway：鉴权网关（CI 部署；承接 styrigx.com、blog.styrigx.com、daymark.styrigx.com、curio.styrigx.com 整站请求：会话检查 + 接口；静态资源原样回源）
#
# 主站全部后端代码都在本目录：src/（入口、路由表、密钥）+ functions/（middleware、接口、内核）+ migrations/（D1）。
# Pages 只放静态文件（配置见 web/wrangler.toml），网关验完会话回源取页面。
#
# 安全：
# - workers_dev = false，不开 *.workers.dev 地址（它连的是正式 KV/D1，不能有未鉴权的入口）。
# - SGX_ENV = "production"：middleware 按生产规则执行，非 styrigx.com 的 /api 请求一律 403。
# - 私密值只在 Secrets Store（见文件末尾），不进仓库。

name = "styrigx-auth-gateway"
main = "src/worker.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

# 日志：在后台 Observability 里看每个请求的路径、状态码、耗时和报错，方便切换后排查。
# 写在这里是为了不被 CI 部署覆盖（后台手动开的设置会被下一次部署改回）。
# 代码只打印错误名和非敏感诊断信息，不打印 cookie、令牌或密钥。免费版每天 20 万条、保留 3 天。
[observability]
enabled = true
head_sampling_rate = 1

# 路由：本文件就是网关 Worker 路由的唯一登记处（scripts/check-worker-routes.mjs 在 CI 里核对）。
# 2026-10-21 起三站都是整站一条通配路由（host/*）：
# - Cloudflare 的路由规则不带 * 时要求整条 URL（含查询串）完全相等。以前登记的 styrigx.com/、blog.styrigx.com/、
#   daymark.styrigx.com/ 这类精确规则遇到 ?lock=1、?utm=… 就不命中 → 请求直达 Pages：
#   锁屏入口 styrigx.com/?lock=1&return=… 没有会话标记、解锁后回不去子站；子站首页带任意查询串不验会话直出正文。
# - 通配后新增页面目录不会漏登记（fail closed）。静态资源（/css/ /js/ /fonts/ /fav/ /images/）也进 Worker，
#   但在 src/index.js 第一行就原样回源，不验会话、不改响应（与以前不登记时行为一致）。
# - 更具体的规则优先：daymark.styrigx.com/api/*（styrigx-daymark-core，另一个仓库）仍归句子接口 Worker；
#   daymark.styrigx.com/api/session-check 比它更具体，归网关。curio 同理：curio.styrigx.com/api/* 归 styrigx-curio-core
#   （styrigx-curio 仓库，收藏接口），curio.styrigx.com/api/session-check 归网关。
# 注意：Pages 上已经没有后端代码，删掉路由 = 页面不验会话，不能靠删路由回滚；出问题时 revert 对应提交重新部署。
[[routes]]
pattern = "styrigx.com/*"
zone_name = "styrigx.com"

# ---- 子站（src/subsites.js）----
[[routes]]
pattern = "blog.styrigx.com/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "daymark.styrigx.com/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "daymark.styrigx.com/api/session-check"
zone_name = "styrigx.com"

[[routes]]
pattern = "curio.styrigx.com/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "curio.styrigx.com/api/session-check"
zone_name = "styrigx.com"

# ---- 明文变量（公钥在 Secrets Store）----
[vars]
SGX_ENV = "production"
SGX_SITE = "space"
SGX_ORIGIN = "https://styrigx.com"
SGX_RP_ID = "styrigx.com"
# 聊天 /api/chat（functions/api/chat.js，2026-10-22）：只做联网检索，不存对话。
# CHAT_PROVIDER = "gemini"（原生 streamGenerateContent + Google 搜索接地）或 "openai"（任意 OpenAI 兼容接口，没有联网检索）。
# 免费档能用 Google 搜索接地的只有 gemini-2.5-flash / gemini-2.5-flash-lite（每天合计 500 次）；Gemini 的 OpenAI 兼容端点不支持搜索接地。
# 钥匙在 Secrets Store 的 SGX_CHAT_API_KEY（见文件末尾）；没配 → /api/chat 回 503 no_key，不影响其他接口。
CHAT_PROVIDER = "gemini"
CHAT_API_BASE = "https://generativelanguage.googleapis.com/v1beta"
CHAT_MODEL = "gemini-2.5-flash"
CHAT_SEARCH = "on"
# 模型切换（2026-10-22）：聊天页可选的模型白名单，POST /api/chat 只认这里的 id（GET /api/chat 把列表给页面）。CHAT_MODEL 是默认。
# search = 带不带 Google 搜索 / url_context 工具：免费档只有 2.5 Flash / Flash-Lite 能搜索接地（合计每天 500 次）；
# Gemini 3+ 免费档能免费生成文字，但搜索接地是「Not available」（ai.google.dev 价格页，2026-10-22），所以不联网。
# CHAT_SEARCH = "off" 仍是总开关（哪个都不联网）。坏 JSON → 退回只有 CHAT_MODEL 一个。
CHAT_MODELS = '[{"id":"gemini-2.5-flash","label":"Gemini 2.5 Flash","search":true},{"id":"gemini-2.5-flash-lite","label":"Gemini 2.5 Flash-Lite","search":true},{"id":"gemini-3.8-flash","label":"Gemini 3.8 Flash","search":false},{"id":"gemini-3.5-flash-lite","label":"Gemini 3.5 Flash-Lite","search":false}]'

# ---- 服务绑定 ----
# 全站搜索 styrigx-search-index（workers/search-index；没有公开地址，只能从这里进）。/api/search 验完会话转给它。
# 部署顺序：deploy.yml 里 deploy-search-worker 先于本 Worker。
[[services]]
binding = "SEARCH"
service = "styrigx-search-index"

# 站点监测 styrigx-status（workers/status；没有公开地址，只能从这里进）。/api/status 验完会话转给它。
# 部署顺序：deploy.yml 里 deploy-status-worker 先于本 Worker。
[[services]]
binding = "STATUS"
service = "styrigx-status"

# ---- 数据绑定（正式 KV/D1）----
# 认证库 styrigx-auth-gateway（原 styrigx-owner，2026-10-22 改名，id 不变）：锁屏 / 账号的密码哈希、通行密钥、会话、设备、限流。
[[kv_namespaces]]
binding = "OWNER_KV"
id = "b796097c90104000992b7713f61e16ea"

# 账号资料库 styrigx-account（2026-10-22 分出来）：头像（avatar:*）、云同步（account-prefs）。
[[kv_namespaces]]
binding = "ACCOUNT_KV"
id = "b20701f5f48e498e897bc6f0bd81643f"

[[d1_databases]]
binding = "SGX_D1"
database_name = "styrigx-sgx"
database_id = "2804d280-1cab-422a-834d-3390cea38976"
migrations_dir = "migrations"

# ---- 密钥：Secrets Store ----
# 5 个私密值 + 2 把公钥全放 Secrets Store（签名钥匙只剩账号 SGX_ACCOUNT_*、锁屏 SGX_LOCK_* 两套）：换钥只在 Cloudflare 后台改，不用改代码、不用重新部署（最多 60 秒生效）。
# store_id 是存储的编号，不是密值。
[[secrets_store_secrets]]
binding = "SGX_LOCK_PRIVATE"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_LOCK_PRIVATE"

[[secrets_store_secrets]]
binding = "SGX_ACCOUNT_PRIVATE"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ACCOUNT_PRIVATE"

[[secrets_store_secrets]]
binding = "SGX_ROOT_KEY"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ROOT_KEY"

[[secrets_store_secrets]]
binding = "SGX_PW_PEPPER"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_PW_PEPPER"

[[secrets_store_secrets]]
binding = "TURNSTILE_SECRET"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "TURNSTILE_SECRET"

[[secrets_store_secrets]]
binding = "SGX_LOCK_PUBLIC"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_LOCK_PUBLIC"

[[secrets_store_secrets]]
binding = "SGX_ACCOUNT_PUBLIC"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ACCOUNT_PUBLIC"

# 聊天钥匙（Gemini API key，不绑结算的 Google 小号）：只有 /api/chat 在用到时读（functions/api/chat.js），
# 不在 src/secrets.js 的 SECRET_NAMES 里（那份是每个请求都预读的签名钥匙），读不到只影响聊天。
# 部署前要先在 Secrets Store 建好这个密钥（作用域含 workers）：部署时 Cloudflare 会核对每个 Secrets Store 绑定，
# 绑定一个还不存在的密钥会让整个网关部署失败（不只是聊天）。
[[secrets_store_secrets]]
binding = "SGX_CHAT_API_KEY"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_CHAT_API_KEY"

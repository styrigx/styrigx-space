# styrigx-auth-gateway：鉴权网关（CI 部署；承接 styrigx.com/api/*、/avatar/*、主站全部页面，以及 blog/book 子站页面的会话检查）
#
# 主站全部后端代码都在本目录：src/（入口、路由表、密钥）+ functions/（middleware、接口、内核）+ migrations/（D1）。
# Pages 只放静态文件（配置见 web/wrangler.toml），网关验完会话回源取页面。
#
# 安全：
# - workers_dev = false，不开 *.workers.dev 地址（它连的是正式 KV/D1，不能有未鉴权的入口）。
# - SGX_ENV = "production"：middleware 按生产规则执行，非 styrigx.com 的 /api 请求一律 403。
# - 私密值只在 Secrets Store（见文件末尾），不进仓库。

name = "styrigx-auth-gateway"
main = "src/worker.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

# 日志：在后台 Observability 里看每个请求的路径、状态码、耗时和报错，方便切换后排查。
# 写在这里是为了不被 CI 部署覆盖（后台手动开的设置会被下一次部署改回）。
# 代码只打印错误名和非敏感诊断信息，不打印 cookie、令牌或密钥。免费版每天 20 万条、保留 3 天。
[observability]
enabled = true
head_sampling_rate = 1

# 路由：本文件就是主站 Worker 路由的唯一登记处（scripts/check-worker-routes.mjs 在 CI 里核对）。
# - /api/*：全部接口
# - 页面：主站每个 HTML 页面所在目录都要在这里（新增页面目录忘了登记 → CI 红），网关验会话后回源 Pages 取页面
# - /avatar/*：主人上传的头像存在 KV，要网关读（没上传过就回源拿静态默认图）
# - 静态资源（/css/ /js/ /fonts/ /fav/ 等）不登记，不过 Worker
# 注意：Pages 上已经没有后端代码，删掉页面路由 = 页面不验会话，不能靠删路由回滚；出问题时 revert 对应提交重新部署。
[[routes]]
pattern = "styrigx.com/api/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/avatar/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/en"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/en/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/settings/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/files/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/browser/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/bookmarks/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/search/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/app-verify/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "styrigx.com/zh/*"
zone_name = "styrigx.com"

# ---- 子站（src/subsites.js）：只登记要验会话的页面路径，静态资源（/_astro/ /fonts/ /js/ /css/ /images/）不登记 ----
# 子站 Pages 不持钥匙、没有验票代码，页面路由漏登记 = 那个页面不验会话；子站 CI 部署后逐个目录冒烟检查（未登录必须 302 且带 X-SGX-Runtime: worker）。

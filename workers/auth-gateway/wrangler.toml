# styrigx-auth-gateway：鉴权网关（CI 部署；承接 styrigx.com、blog.styrigx.com、daymark.styrigx.com、curio.styrigx.com 整站请求：会话检查 + 接口；静态资源原样回源）
#
# 主站后端代码在本目录：src/（入口、路由表、密钥）+ functions/（middleware、接口、内核）+ migrations/（D1）。
# 账号（账号密码 / 通行密钥 / 设备 / 账号会话、头像、云同步、数字健康）在账号 Worker styrigx-account（workers/account）：
# 账号拆分 PR3 起它没有任何公开路由，/api/account、/api/prefs*、/api/avatar*、/api/wellbeing*、/avatar/* 由本 Worker 验门后
# 经服务绑定 ACCOUNT 转发（转发表 src/forwarding.js）。
# 分享短链（/s/*、/api/share*）在短链 Worker styrigx-share（workers/share，2026-10-24），同样挂更具体的路由；短链钥匙和访客会话由本 Worker 的 ShareIssuer RPC 签。
# Pages 只放静态文件（配置见 web/wrangler.toml），网关验完会话回源取页面。
#
# 安全：
# - workers_dev = false，不开 *.workers.dev 地址（它连的是正式 D1，不能有未鉴权的入口）。
# - SGX_ENV = "production"：middleware 按生产规则执行，非 styrigx.com 的 /api 请求一律 403。
# - 私密值只在 Secrets Store（见文件末尾），不进仓库。

name = "styrigx-auth-gateway"
main = "src/worker.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

# 日志：在后台 Observability 里看每个请求的路径、状态码、耗时和报错，方便切换后排查。
# 写在这里是为了不被 CI 部署覆盖（后台手动开的设置会被下一次部署改回）。
# 代码只打印错误名和非敏感诊断信息，不打印 cookie、令牌或密钥。免费版每天 20 万条、保留 3 天。
[observability]
enabled = true
head_sampling_rate = 1

# 路由：本文件就是网关 Worker 路由的唯一登记处（scripts/check-worker-routes.mjs 在 CI 里核对）。
# 2026-10-21 起三站都是整站一条通配路由（host/*）：
# - Cloudflare 的路由规则不带 * 时要求整条 URL（含查询串）完全相等。以前登记的 styrigx.com/、blog.styrigx.com/、
#   daymark.styrigx.com/ 这类精确规则遇到 ?lock=1、?utm=… 就不命中 → 请求直达 Pages：
#   锁屏入口 styrigx.com/?lock=1&return=… 没有会话标记、解锁后回不去子站；子站首页带任意查询串不验会话直出正文。
# - 通配后新增页面目录不会漏登记（fail closed）。静态资源（/css/ /js/ /fonts/ /fav/ /images/）也进 Worker，
#   但在 src/index.js 第一行就原样回源，不验会话、不改响应（与以前不登记时行为一致）。
# - 更具体的规则优先：daymark.styrigx.com/api/*（styrigx-daymark-core，另一个仓库）仍归句子接口 Worker；
#   daymark.styrigx.com/api/lock-session-check 比它更具体，归网关。curio 同理：curio.styrigx.com/api/* 归 styrigx-curio-core
#   （styrigx-curio 仓库，收藏接口），curio.styrigx.com/api/lock-session-check 归网关。
# 注意：Pages 上已经没有后端代码，删掉路由 = 页面不验会话，不能靠删路由回滚；出问题时 revert 对应提交重新部署。
[[routes]]
pattern = "styrigx.com/*"
zone_name = "styrigx.com"

# ---- 子站（src/subsites.js）----
[[routes]]
pattern = "blog.styrigx.com/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "daymark.styrigx.com/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "daymark.styrigx.com/api/lock-session-check"
zone_name = "styrigx.com"

[[routes]]
pattern = "curio.styrigx.com/*"
zone_name = "styrigx.com"

[[routes]]
pattern = "curio.styrigx.com/api/lock-session-check"
zone_name = "styrigx.com"

# ---- 明文变量（公钥在 Secrets Store）----
[vars]
SGX_ENV = "production"
SGX_SITE = "space"
SGX_ORIGIN = "https://styrigx.com"
SGX_RP_ID = "styrigx.com"
# 聊天的 CHAT_* 变量（模型、白名单、联网开关）在 styrigx-chat（workers/chat/wrangler.toml），网关不带。

# ---- 服务绑定 ----
# 账号 Worker styrigx-account（workers/account；没有公开地址，只能从这里进；方案第 1、10.1 节）：
# - ACCOUNT（entrypoint AccountService）：转发表 src/forwarding.js 里的路径验完门后原样转过去，写全套身份头（X-Styrigx-Lock-* / X-Styrigx-Client-*）
# - ACCOUNT_VERIFIER（entrypoint AccountVerifier）：只读 RPC accountSession()——临时钥匙管理、短链签发、账号页首帧提示用
# 部署顺序：deploy.yml 里 deploy-account-worker 先于本 Worker（命名入口 PR2 已导出）。
[[services]]
binding = "ACCOUNT"
service = "styrigx-account"
entrypoint = "AccountService"

[[services]]
binding = "ACCOUNT_VERIFIER"
service = "styrigx-account"
entrypoint = "AccountVerifier"

# 全站搜索 styrigx-search-index（workers/search-index；没有公开地址，只能从这里进）。/api/search 验完会话转给它。
# 部署顺序：deploy.yml 里 deploy-search-worker 先于本 Worker。
[[services]]
binding = "SEARCH"
service = "styrigx-search-index"

# 站点监测 styrigx-status（workers/status；没有公开地址，只能从这里进）。/api/status 验完会话转给它。
# 部署顺序：deploy.yml 里 deploy-status-worker 先于本 Worker。
[[services]]
binding = "STATUS"
service = "styrigx-status"

# 聊天 styrigx-chat（workers/chat，2026-10-22 从网关拆出来；没有公开地址，只能从这里进）。/api/chat 验完门（同源 + 会话 + 只许管理员）转给它，
# 回答原样流回去。聊天钥匙 SGX_CHAT_API_KEY 只绑在它那边，网关不绑：钥匙没建好不影响网关部署。
# 部署顺序：deploy.yml 里 deploy-chat-worker 先于本 Worker。
[[services]]
binding = "CHAT"
service = "styrigx-chat"

# ---- 限流（Workers Rate Limiting，2026-10-28）----
# 无会话写接口（锁屏 / 重置 / 根凭证 / 临时钥匙进门的 POST）按 IP 每 60 秒 20 次，超了 429；计数在边缘，不占存储、不收费。
# 代码见 functions/_kernel/anon-limit.js（绑定缺失时放行）。namespace_id 是本账号内自定的整数，别的 Worker 不要复用。
[[ratelimits]]
name = "ANON_LIMITER"
namespace_id = "2801"
simple = { limit = 20, period = 60 }

# ---- 数据绑定（正式 D1）----
# 网关的认证状态全部在 D1 styrigx-auth-gateway（强一致），不绑定任何 KV（2026-10-27）。
# 账号拆分 PR3（方案 10.1）：网关只经 D1_LOCK_AUTH 读写 realm='lock' 的行（纪元、锁屏密码 / 通行密钥、user handle、challenge、
# 密码 / 临时码 / 锁屏根密钥输错计数、临时钥匙、锁屏根密钥审计）和恢复开关表 recovery_switch（改名 lock_reset_switch 留待以后）。
# 原来的 D1_ACCOUNT_AUTH / D1_ROOT_AUTH 两个绑定名删掉（网关代码不再读写 realm='account' / 'root' 的行）；
# 库里遗留的这些行不删，账号数据已由 scripts/migrate-account-auth.mjs（Cloudflare D1 REST，不经绑定）拷到 D1 styrigx-account，
# 观察期后 PR4 --cleanup --confirm 删除。
# 表：migrations/0001_recovery_switch.sql、0005_lock_account_state.sql、0006_auth_state.sql（0007 给 user_handle 加 legacy_handle 列）。
# 本 Worker 的部署 job 不跑 D1 迁移：表由代码在第一次遇到「no such table」时按同一份语句建（functions/_kernel/lib/d1-state.js SCHEMA，幂等）。
# 恢复开关代码仍读写 recovery_switch；scripts/migrate-account-auth.mjs apply 会另建 lock_reset_switch 并拷行，但代码还没切过去——
# 改名留待以后，PR4 的 --cleanup（会 DROP recovery_switch）必须在改名完成之后才能跑。
# 安全读（纪元、吊销、challenge、计数、临时钥匙）只读主库：代码不开 read replication / withSession。
[[d1_databases]]
binding = "D1_LOCK_AUTH"
database_name = "styrigx-auth-gateway"
database_id = "6931d1da-3502-480d-b0bd-de1bc4829d1d"
migrations_dir = "migrations"

# ---- 密钥：Secrets Store（方案 10.1：只剩 4 个）----
# 聊天钥匙 SGX_CHAT_API_KEY 只绑在 styrigx-chat；账号钥匙 SGX_ACCOUNT_PRIVATE / SGX_ACCOUNT_PUBLIC / SGX_ACCOUNT_ROOT_KEY 只绑在 styrigx-account。
# 锁屏根密钥 SGX_ADMIN_KEY：后台由原 SGX_ROOT_KEY 改名而来（值不变）。SGX_PW_PEPPER 与账号 Worker 绑同一个密值（方案 6.2）。
# 换钥只在 Cloudflare 后台改，不用改代码、不用重新部署（最多 60 秒生效）。store_id 是存储的编号，不是密值。
[[secrets_store_secrets]]
binding = "SGX_LOCK_PRIVATE"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_LOCK_PRIVATE"

[[secrets_store_secrets]]
binding = "SGX_ADMIN_KEY"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_ADMIN_KEY"

[[secrets_store_secrets]]
binding = "SGX_PW_PEPPER"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_PW_PEPPER"

[[secrets_store_secrets]]
binding = "SGX_LOCK_PUBLIC"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_LOCK_PUBLIC"

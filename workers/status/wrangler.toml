# styrigx-status：站点监测（CI 部署；只干一件事——每分钟检查一遍各站，记进 D1，给主站监测页出数据）
#
# 没有公开地址：不开 workers.dev、不挂路由、不挂域名。
#   - 定时：Cron 每分钟一次（src/index.js scheduled），检查 src/targets.js 里的 4 个地址，10 秒超时，
#     连续 3 次失败开一条故障，恢复后自动关。
#   - 每小时任务（2026-11-10）：同一条 41 分 Cron 经服务绑定 JOB_ATLAS / JOB_AI 叫两个 Worker 的 HourlyJob.run()（src/hourly.js；2026-11-14 前是 JOB_DAYMARK / JOB_CURIO / JOB_AI 三个）。
#   - 每日任务（v6 P2c）：同一条 41 分 Cron，只在 03:00 CST（UTC 19 点）那一轮经 JOB_ACCOUNT 叫账号 Worker 的 AccountJanitor.purgeExpiredUsers()
#     （到期满 30 天的用户自动删除，src/daily.js）。v6 P4 起分享短链整套删除，原 JOB_SPACE（space-core ShareJanitor）绑定一并删。
#   - 用量：Cron 每小时 41 分一次（src/usage.js），用只读 token 读 Cloudflare API（D1 / R2 / KV 存储、今天的 Workers 请求数），
#     最新快照存 D1 表 status_usage（migrations/0001_baseline.sql）。
#   - 免费额度（今天的操作次数：Workers + Pages Functions 请求、KV 读写删列、D1 读写行；R2 A/B 类本月）：不走 Cron，
#     /summary 被请求时按需查 GraphQL Analytics API，5 分钟缓存在 D1 表 status_quota（src/quota.js，migrations/0001_baseline.sql）。
#   - 读数据：唯一入口是鉴权网关 styrigx-space-core 的服务绑定 STATUS（主站 /api/status 验完会话转进来）。
#   - 服务绑定（2026-10-28；P4-2 起 SEARCH / CHAT 退役，换成 AI_SERVICE → styrigx-ai）。每分钟那一轮顺带测它的 GET /healthz
#     （src/targets.js 里带 binding 的一项），结果和公开地址一样记进 D1、显示在状态页。不经网关，网关不开免会话口子。
#     绑定要求对方 Worker 已存在，所以 deploy.yml 里本 job 排在 deploy-ai-worker 之后。
#   - 部署后健康闸门（2026-10-28，space/scripts/check/health-gate.mjs）：deploy.yml 部署完本 Worker 后用部署 token 经 D1 REST 只读 status_checks 表，
#     等部署之后的巡检；ai 连续失败就回滚。status_checks 的列（site / at / ok / err）和 status_checks_at 索引因此是闸门的接口，改名要一起改。
# 这里不验 cookie。唯一的钥匙是用量那把只读 token，放在 Cloudflare Secrets Store（和鉴权网关同一个 store），仓库里不写值：
#   Secrets Store 里建一条 secret_name = "SGX_CF_USAGE_TOKEN"，值 = 自定义 API token，Account 级只读：
#     Account Analytics Read · D1 Read · Workers R2 Storage Read · Workers KV Storage Read
#     （免费额度那部分只用到 Account Analytics Read；这把 token 只给运行时读，和任何部署 token 无关）
#   账号 id 用普通 Worker secret：npx wrangler secret put CF_ACCOUNT_ID（不进仓库，部署不会冲掉）
# 没配 → 用量 Cron 什么都不做，状态页「用量」显示「用量未配置」；/api/status 其余部分不受影响。

name = "styrigx-status"
main = "src/index.js"
compatibility_date = "2026-10-09"
# 检查请求按公网发出（同账号同区域的子站也走公网，经过网关和 Pages，和外部访问看到的一样）
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

# Smart Placement：本 Worker 频繁读 D1（每分钟巡检写 status_checks、每小时用量），让 Cloudflare 把执行位置放在离数据库近的地方，降 D1 往返延迟。
[placement]
mode = "smart"

[triggers]
# 第一条：每分钟检查各站；第二条：每小时 41 分收一次用量，同一轮叫 daymark-core、curio-core、ai 的每小时任务（index.js 按 event.cron 分流，src/hourly.js），
# 03:41 CST 那一轮另清理过期分享链接（src/daily.js，v5 S2，不另加 Cron）。
# 注意：免费账号整个账号最多 5 个 Cron Trigger（https://developers.cloudflare.com/workers/platform/limits/），这里占 2 个；
# 2026-11-10 起另外三个 Worker 不自带 Cron（让出名额给 proxy-rules），全账号共 3 个：这里 2 个 + proxy-rules 1 个。
crons = ["* * * * *", "41 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# D1 styrigx-status（进站 v3 L2b，2026-11-09，Gray 08:21 定：监测和账号一个做法，独立一个库；之前和网关 / 短链共用 styrigx-space-gateway）。
# 本 Worker 两套数据，表名带 status_ 前缀（2026-11-07 合库时加的，搬到独立库后保留不改）：
#   D1_UPTIME_MONITOR = status_checks / status_state / status_hourly / status_daily / status_incidents；
#   D1_CLOUDFLARE_USAGE = status_usage / status_quota。migrations_dir / migrations_table 只配在第一个上。
# 迁移记录表 d1_migrations_status。数据由 L2b 的一次性搬迁（见 git 历史 PR #338）从旧共用库原样搬来（旧库已于 L3 删除）。
# 更早的迁移历史在 migrations-archive/（只留史，不再跑）。
[[d1_databases]]
binding = "D1_UPTIME_MONITOR"
database_name = "styrigx-status"
database_id = "ee1246de-2233-431a-8819-ba2931347a32"
migrations_dir = "migrations"
migrations_table = "d1_migrations_status"

[[d1_databases]]
binding = "D1_CLOUDFLARE_USAGE"
database_name = "styrigx-status"
database_id = "ee1246de-2233-431a-8819-ba2931347a32"

[[services]]
binding = "AI_SERVICE"
service = "styrigx-ai"

# 每小时任务（2026-11-10，src/hourly.js）：三个 Worker 的命名入口 HourlyJob，只有 run(at)，公网进不来。
# 绑定要求对方 Worker 已存在（都早已存在）；入口要等对方新版部署后才有，这之前那一轮只打日志。
# Atlas 后端合并（2026-11-14）：原 JOB_DAYMARK、JOB_CURIO 两条合成 JOB_ATLAS（一轮里先奇趣后日刻），两条都指 atlas-core 会每小时跑两遍。
[[services]]
binding = "JOB_ATLAS"
service = "styrigx-atlas-core"
entrypoint = "HourlyJob"

[[services]]
binding = "JOB_AI"
service = "styrigx-ai"
entrypoint = "HourlyJob"

# 每日任务（v6 P2c，src/daily.js）：账号 Worker 的命名入口 AccountJanitor，只有 purgeExpiredUsers(at)（到期满 30 天的用户自动删除），公网进不来。
# styrigx-account 早已存在，绑定能部署；deploy.yml 里 status 排在 account 之前（account 不绑 status，space-core 绑两者），
# 所以入口要等同一次部署里 account 新版上线后才有，这之前那一轮（只在 03:41 CST）只打日志。
[[services]]
binding = "JOB_ACCOUNT"
service = "styrigx-account"
entrypoint = "AccountJanitor"

# 用量 token：Secrets Store 绑定，代码里 await env.SGX_CF_USAGE_TOKEN.get()。store_id 同 workers/space-core/wrangler.toml（是存储编号，不是密值）。
# 部署这个 Worker 的 token（styrigx-status-deploy）因此要多一项 Secrets Store 编辑（带 Secrets Store 绑定部署必须 Edit，Read 报 10021）。
[[secrets_store_secrets]]
binding = "SGX_CF_USAGE_TOKEN"
store_id = "a5a984f365424401bad5ad6ddcd44479"
secret_name = "SGX_CF_USAGE_TOKEN"

# styrigx-search-index：全站搜索（CI 部署；只干一件事——在合并好的全站索引里搜）
#
# 没有公开地址：不开 workers.dev、不挂路由、不挂域名。唯一入口是鉴权网关 styrigx-auth-gateway 的服务绑定 SEARCH：
#   四个站的 /api/search 先由网关验会话（owner / visitor），再带上角色转进来（src/index.js）。
# 所以这里不验 cookie、不持任何钥匙；角色头只可能是网关写的。
#
# 索引：KV styrigx-search-index，每个站一条 site:<站名>（space / blog / daymark / curio），各站 CI 构建后写入
#   （本仓库：scripts/build-search-index.mjs 生成 → deploy.yml 的 deploy-search-worker 写 site:space）。
# 格式见 src/rank.js 顶部。

name = "styrigx-search-index"
main = "src/index.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

# KV styrigx-search-index（2026-10-22 已建）。
[[kv_namespaces]]
binding = "KV_SEARCH_INDEX"
id = "bd1babcc3fe74d58994e254c74d34ced"

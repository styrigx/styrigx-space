# styrigx-curio-core：奇趣的核心 Worker（收藏的存、读、导入导出、图标缓存）（CI 部署：styrigx-space deploy.yml 的 deploy-curio-core；承接 styrigx.com/curio/api/*）
#
# 全部后端代码都在本目录：src/（入口、路由表、接口）+ migrations/（D1）。
# 页面是主站 Pages styrigx-space 单树里的 /curio/（atlas/web/curio/）静态文件；页面的会话检查在主站鉴权网关。
#
# 安全：
# - 本 Worker 不持任何钥匙。会话交给鉴权网关验（服务绑定 SPACE → SpaceVerifier）。
# - 全站搜索：本 Worker 自己把收藏 / 设备 / 游戏写进 KV styrigx-space-core 的 site:curio（src/search-index.js）。
# - workers_dev = false、preview_urls = false：只通过 styrigx.com/curio/api/* 路由访问（它连的是正式 D1 / R2）。

name = "styrigx-curio-core"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

# 路由（合并 PR3，2026-11-03）：主域名 styrigx.com/curio/api/*（单树里本站前缀 /curio），比网关的 styrigx.com/* 更具体，接口请求直接落到本 Worker。
# 旧图志域名下的过渡期接口路由已于 P4-3 PR-1 删除。
# 页面路径和 /api/lock-session-check、/api/search 归主站鉴权网关（workers/space-core/wrangler.toml），这里只管本站接口。
# 部署 token 要有 styrigx.com 区域的 Workers Routes 编辑（wrangler deploy 按这里的列表整体覆盖线上路由）。
[[routes]]
pattern = "styrigx.com/curio/api/*"
zone_name = "styrigx.com"

# D1 styrigx-curio-core：一个库里五套独立数据，各绑一个名字（value 相同）：
#   D1_FINDS   发现：links、cats、imports
#   D1_DEVICES 设备：devices
#   D1_GAMES   游戏：games
#   D1_MOVIES  电影：movies（奇趣拆页 P4-3 新增；Gray 在面板按名字加绑定）
#   D1_MUSIC   私人音乐：music_albums、music_tracks、music_tokens（同上）
# 跨两套数据的单条 SQL / batch（如搜索索引、照片清扫、设备 + 游戏一起读）用主表那套的绑定，代码里有注释。
# migrations_dir 只配在第一条上：`wrangler d1 migrations apply styrigx-curio-core` 按 database_name 找到的就是它。
[[d1_databases]]
binding = "D1_FINDS"
database_name = "styrigx-curio-core"
database_id = "26ae9cd2-43c9-4bc0-b558-b35560ed9d7c"
migrations_dir = "migrations"

[[d1_databases]]
binding = "D1_DEVICES"
database_name = "styrigx-curio-core"
database_id = "26ae9cd2-43c9-4bc0-b558-b35560ed9d7c"

[[d1_databases]]
binding = "D1_GAMES"
database_name = "styrigx-curio-core"
database_id = "26ae9cd2-43c9-4bc0-b558-b35560ed9d7c"

[[d1_databases]]
binding = "D1_MOVIES"
database_name = "styrigx-curio-core"
database_id = "26ae9cd2-43c9-4bc0-b558-b35560ed9d7c"

[[d1_databases]]
binding = "D1_MUSIC"
database_name = "styrigx-curio-core"
database_id = "26ae9cd2-43c9-4bc0-b558-b35560ed9d7c"

# R2：icons/（网站小图标缓存）、imports/（每次导入的浏览器书签原文，备份，不自动删）、photos/（设备照片 / 游戏封面 / 电影海报；每天清扫没人引用的）
[[r2_buckets]]
binding = "R2_PHOTOS"
bucket_name = "styrigx-curio-core"

# 同一个桶，私人音乐另绑一个名字（奇趣拆页 P4-3 新增）：music/<专辑>/…（音频、专辑封面；不清扫，删专辑 / 曲目时当场删）
[[r2_buckets]]
binding = "R2_MUSIC"
bucket_name = "styrigx-curio-core"

# 鉴权：主站鉴权网关的 RPC 入口 SpaceVerifier（admit / auditRoot：转给账号 Worker 判 v6 会话；见 src/api/_auth.js）。
[[services]]
binding = "SPACE"
service = "styrigx-space-core"
entrypoint = "SpaceVerifier"

# 全站搜索索引：KV styrigx-space-core（进站 v3 L2b 由 styrigx-space-gateway 换过来，主站 styrigx-ai 读）。本 Worker 只写自己那条 site:curio：
# 改内容的写接口成功后重建（ctx.waitUntil），下面的 Cron 每小时兜底一次。格式见 src/search-index.js。
[[kv_namespaces]]
binding = "KV_SEARCH_INDEX"
id = "4bcdb84f205541b9b6c8d230bc2b106f"

# Cron：每小时第 23 分重建一次搜索索引（首次部署后也靠它填上）；UTC 19:23（北京 03:23）那轮顺带清扫 R2 photos/ 里没人引用的照片。
[triggers]
# 2026-11-10：免费账号整个账号只有 5 个 Cron Trigger，本 Worker 的每小时任务并进 styrigx-status 的 "41 * * * *"，
# 由 status 经服务绑定调命名入口 HourlyJob.run()。crons = [] 是显式清掉线上已有的 Cron（不写 [triggers] 会保留旧的）。
crons = []

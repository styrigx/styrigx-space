{{ define "main" }}
{{ $lang := .Lang }}{{ $tr := partialCached "sgx-tr.html" $lang $lang }}
<main class="w-full mx-auto pb-16!" style="max-width:860px;padding-left:16px;padding-right:16px">
  <section class="text-center py-16">
    <p class="text-6xl font-extrabold text-m-on-surface-variant/40 mb-4">404</p>
    <h1 class="text-xl font-bold text-m-on-surface mb-2">{{ $tr.notFound.pageNotFound }}</h1>
    <p class="text-sm text-m-on-surface-variant mb-8">{{ $tr.notFound.thePageYoureLooking }}</p>
    <a href="{{ site.Home.RelPermalink }}"
       class="inline-flex items-center justify-center h-11 px-6 rounded-full bg-m-primary-fill text-m-on-primary-fill text-sm font-semibold active:scale-[.97] transition-transform">
      {{ $tr.notFound.backToDaymark }}
    </a>
  </section>
</main>
{{ end }}

{{ define "pagejs" }}{{ end }}

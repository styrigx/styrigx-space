# 博客（styrigx.com/blog/）：Hugo，和主站 styrigx-space 同栈（atlas/web/blog/ = 网站本体，hugo --minify -s atlas/web/blog → atlas/web/blog/public/）。
# P4-3 PR-4c（§6.8）：英文是默认语言（不带前缀），中文在 /zh/；旧的 /en/… 删除不 301。地址对照见 tests/blog/url-map.json。
title: 'Styrigx'
# 主站单树（styrigx.com）下的子路径：页面、资源都在 /blog/ 下（英文 /blog/，中文 /blog/zh/）。
# 2026-11 合并 PR2 起产物由 space/scripts/assemble.mjs 拼进主站 Pages（dist/site/blog/）；合并 PR3 起线上入口就是 styrigx.com/blog/（旧图志域名的 301 已于 P4-3 PR-1 删除）
baseURL: 'https://styrigx.com/blog/'
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
hasCJKLanguage: true
# 不要 /en/ → / 跳转页（/en/… 一律 404，不做 301）
disableDefaultLanguageRedirect: true
# 旧站是 Astro 的 trailingSlash: always：/post/<slug>/、/tags/<slug>/
uglyURLs: false
# 文章日期按 UTC 读（Astro 把 2026-10-11 读成 UTC 零点，RSS pubDate 也是 GMT）
timeZone: UTC
enableRobotsTXT: false
enableGitInfo: false
# 只要这些页面：首页、文章、标签页、404、RSS、站点地图（自己的 sitemap-index.xml / sitemap-0.xml）。
# /post/ 与 /tags/ 列表页旧站没有，不生成（否则会多出网关没登记过的页面）。
disableKinds:
  - section
  - taxonomy
  - sitemap

languages:
  en:
    locale: en
    label: English
    weight: 1
    contentDir: content/en
    params:
      locale: en
      rssTitle: 'Styrigx (English)'
      # 快捷面板语言选项的顺序（小的在前；没写按 weight）。weight 管默认语言 / 翻译排序，选择器顺序单独定：跟随系统 / 中文 / English
      pickerWeight: 2
  zh:
    locale: zh-CN
    label: 中文
    weight: 2
    contentDir: content/zh
    params:
      locale: zh-CN
      rssTitle: 'Styrigx'
      pickerWeight: 1

taxonomies:
  tag: tags

permalinks:
  page:
    post: /post/:contentbasename/
  term:
    tags: /tags/:slug/

outputFormats:
  RSS:
    baseName: rss
  SitemapIndex:
    mediaType: application/xml
    baseName: sitemap-index
    isPlainText: true
    notAlternative: true
    root: true
  Sitemap0:
    mediaType: application/xml
    baseName: sitemap-0
    isPlainText: true
    notAlternative: true
    root: true

outputs:
  home: [HTML, RSS, SitemapIndex, Sitemap0]
  page: [HTML]
  term: [HTML]

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingIDType: github
  highlight:
    # 代码块：Chroma 输出 class（配色由 atlas/web/blog/assets/css/blog/code-tokens.css 从色彩角色生成，不用固定主题）
    noClasses: false
    lineNos: true
    lineNumbersInTable: false
    anchorLineNos: false
    guessSyntax: false
    codeFences: true
    tabWidth: 2
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

# 站点描述按语言走字符串表（i18n/<lang>.yaml 的 siteDescription，缺键回退英文），这里不放任何语言的显示文案
params:
  author: 'Sloan Gray'
  version: '1.0.0'

# 构建时可读的环境变量（CI 用）
security:
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'

minify:
  # 和主站一样：不压 HTML（tdewolff 与内联脚本里的 < 冲突）；CSS 由 Tailwind CLI 压缩
  disableHTML: true

{{- /* 表格包一层横向滚动（原 Navfolio markdown 插件的 .markdown-table-scroll） */ -}}
<div class="markdown-table-scroll"><table{{ range $k, $v := .Attributes }} {{ $k }}="{{ $v }}"{{ end }}><thead>
{{- range .THead }}<tr>{{ range . }}<th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>{{ end -}}
</thead><tbody>
{{- range .TBody }}<tr>{{ range . }}<td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>{{ end -}}
</tbody></table></div>

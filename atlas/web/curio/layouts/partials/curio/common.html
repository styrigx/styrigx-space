{{- /* 各子页共用的确认框 + 提示条（curio.js 的 SgxCurioUI.ask / toast）。参数：isEn */ -}}
{{- $isEn := .isEn }}
{{/* ===== 确认（删收藏 / 删分类） ===== */}}
<div id="confirm-wrap" class="bk-overlay fixed inset-0 z-[70]" role="alertdialog" aria-modal="true" aria-labelledby="confirm-msg">
  <div class="bk-overlay-backdrop absolute inset-0" data-close="confirm"></div>
  <div class="bk-panel bk-dialog text-m-on-surface shadow-2xl">
    <div class="px-6 pt-6 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
      <p id="confirm-msg" class="text-[15px] leading-relaxed text-center"></p>
      <div class="flex gap-3 mt-5">
        <button id="confirm-cancel" type="button" class="flex-1 h-12 rounded-full bg-m-container text-m-on-surface text-[15px] font-bold">{{ if $isEn }}Cancel{{ else }}取消{{ end }}</button>
        <button id="confirm-ok" type="button" class="flex-1 h-12 rounded-full bg-m-error text-m-on-error text-[15px] font-bold"></button>
      </div>
    </div>
  </div>
</div>

<div id="bk-toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 z-[80] max-w-[calc(100vw-2rem)] px-4 py-3 rounded-2xl bg-m-inverse-surface text-m-inverse-on-surface text-sm shadow-lg" role="status"></div>

title: '奇趣'
# 主站单树（styrigx.com）下的子路径：页面、资源、接口都在 /curio/ 下（中文 /curio/，英文 /curio/en/）。
# 2026-11 合并 PR2 起产物由 space/scripts/assemble.mjs 拼进主站 Pages（dist/site/curio/）；合并 PR3 起线上入口就是 styrigx.com/curio/（旧图志域名的 301 已于 P4-3 PR-1 删除）
baseURL: 'https://styrigx.com/curio/'
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
hasCJKLanguage: true
languages:
  zh:
    label: 中文
    weight: 1
  en:
    label: English
    weight: 2
theme: []

# robots.txt 只有主域名根上的一份 space/web/static/robots.txt（Disallow: /，整个 styrigx.com 共用）。设 true 时 Hugo 内置模板会生成本站子目录里的 robots.txt（爬虫不读，白生成）
enableRobotsTXT: false
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: 'Sloan Gray 的奇趣：在网上偶然遇到、想留下的好东西'
  version: '0.2.0'

disableKinds: ['taxonomy', 'term', 'rss', 'section']

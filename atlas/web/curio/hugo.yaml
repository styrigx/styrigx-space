title: '奇趣'
# 主站单树（styrigx.com）下的子路径：页面、资源、接口都在 /curio/ 下（英文 /curio/，中文 /curio/zh/；P4-3 PR-4c 起英文默认）。
# 2026-11 合并 PR2 起产物由 space/scripts/assemble.mjs 拼进主站 Pages（dist/site/curio/）；合并 PR3 起线上入口就是 styrigx.com/curio/（旧图志域名的 301 已于 P4-3 PR-1 删除）
baseURL: 'https://styrigx.com/curio/'
# P4-3 PR-4c（§6.8）：英文是默认语言、不带前缀（/curio/），中文在 /curio/zh/；旧的 /curio/en/ 删除不 301，也不要 Hugo 生成跳转页。
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
disableDefaultLanguageRedirect: true
hasCJKLanguage: true
languages:
  en:
    label: English
    weight: 1
  zh:
    label: 中文
    weight: 2
theme: []

# robots.txt 只有主域名根上的一份 space/web/static/robots.txt（Disallow: /，整个 styrigx.com 共用）。设 true 时 Hugo 内置模板会生成本站子目录里的 robots.txt（爬虫不读，白生成）
enableRobotsTXT: false
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  # 站点描述在字符串表 data/i18n/<语言>.yaml 的 site.description（语言包化 2026-11-07）
  version: '0.2.0'

# P4-3 PR-4c：Hugo 自带的多语言站点地图会出 /curio/en/sitemap.xml（/en/… 已经不该存在），关掉，改成根上一份 /curio/sitemap.xml（sitemaproot，root: true，中英两版都在里面）
disableKinds: ['taxonomy', 'term', 'rss', 'section', 'sitemap']
outputFormats:
  sitemaproot:
    mediaType: application/xml
    baseName: sitemap
    isPlainText: true
    notAlternative: true
    root: true
outputs:
  home: [HTML, sitemaproot]

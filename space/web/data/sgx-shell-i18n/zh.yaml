# 站内终端 man 页的正文（S9：DESCRIPTION / AUTH / NOTES；英文底在 assets/js/shell/term/man/pages.js，行数一一对应）。{root} / {admin} 换成命令字；命令写法、提示符不翻译。
# 中文页每一页都要有（tests/space/ui/shell/man-i18n.test.mjs 查）。
manBody:
  sudo:
    desc:
      - "sudo {admin}：就在这里用解锁密码或通行密钥验证；终端收起，进站动画开始。"
      - "sudo -v：再验证 3 分钟（root@account 时验证的是账号）。"
      - "reset：用恢复钥匙重置密码和通行密钥。"
    notes:
      - "分享链接进来的会话（nobody@space:~#）不能再验证、不能分享、不能改钥匙。"
  lock:
    desc:
      - "lock：立即锁上这台设备（不用验证）。"
      - "passwd / passkey：进站用的钥匙（不是账号的）。"
      - "--all：所有设备都退回访客。"
    auth: "已进站；passwd、passkey 和 --all 要再验证（sudo -v）"
  exit:
    desc:
      - "reset 里：离开 reset。root@account：退出账号登录，回到 {admin}@space。其余：关掉终端。"
  share:
    desc:
      - "share add：名字、页面、链接多久有效、要不要带会话。"
    auth: "用自己的钥匙进站；列出和作废要再验证（sudo -v）"
  passwd:
    auth: "已登录账号（sudo {root}）；要再验证"
  passkey:
    auth: "已登录"
  device:
    auth: "已登录账号（sudo {root}）；--all 要再验证"
  app:
    desc:
      - "app：每个应用的权限范围、什么时候在哪台设备上授权的。"
      - "allow：重新授权一个应用。deny：取消授权（先问 y/N）；应用照样能看，只是不能改。"
    auth: "已登录账号（sudo {root}）；allow 要再验证（sudo -v）"
  profile:
    desc:
      - "profile：姓名、昵称、签名和邮箱（没改过的显示站点默认值）。"
      - "set：改一项，全站立刻跟着换。姓名最多 40 个字，昵称最多 32 个字，邮箱查格式。"
      - "avatar：选一张照片裁剪，或者移除你的头像。"
    auth: "已登录账号（sudo {root}）"
  sub:
    desc:
      - "sub：公钥（头尾）、令牌状态和每个来源：名称 · 机场域名或文件 · 节点数 · 启用 / 停用 / 出错。"
      - "show：印出令牌和每个来源的地址（或只印一个），各带复制；随时能用。"
      - "add：要机场链接（输入不显示）。同名再加 = 换链接：先拉一次，成功了才替换旧的。"
      - "upload：选一个本地 YAML 文件，只留 proxies:。同名再传 = 覆盖。"
      - "mv：只改名，不刷新；旧路径立刻 404。rm：先问 y/N，再删链接、节点和成品。"
      - "enable / disable：停用的来源 404；链接或文件和成品都留着。"
      - "key：粘贴 age1… X25519 公钥；保存后所有来源立刻重新加密。"
      - "token reset：换一个新令牌（已有令牌时先问 y/N）；旧地址全部立刻失效。"
    auth: "已登录账号（sudo {root}）；show、key 和 token reset 要再验证（sudo -v）"
    notes:
      - "地址是 https://proxy-rules.styrigx.com/s/<令牌>/<名称>；每份成品都用你的公钥 age 加密。"
      - "服务端用自己的密钥封存令牌，所以 sub show 能再印出来。"
      - "添加、上传、启用、停用、删除或换公钥后自动刷新一次；机场另外每 6 小时刷新。"
      - "名称用 A–Z a–z 0–9 _ -（1–32 位）。最多 20 个来源，每个文件 2 MB。暂不支持后量子公钥（age1pq1…）。"
  whoami:
    desc:
      - "显示当前用户；su root 之后还显示路径，比如 root via styrigx。"
  su:
    desc:
      - "su <用户>：用这个用户的密码或通行密钥登录；新用户第一次登录要设新密码。"
      - "su root：只有 wheel 组能用，输 root 的凭据；最多 1 小时，前台空闲 15 分钟自动退回。"
      - "exit 退一层；lock 全部退出。"
    notes:
      - "root 不能从访客直接登录。已经以某个用户登录时，要先 exit 才能 su 到另一个用户。"
  groups:
    auth: "已登录；看别人的组要 root"
  who:
    desc:
      - "每个会话的身份路径（root via styrigx）和开始时间；不是 root 只看到自己的。"
  useradd:
    desc:
      - "-e：到那一天 00:00（北京时间）起账号失效。-G：组，用逗号隔开。"
      - "印出一次性密码，只显示一次（24 小时内有效）；用户第一次登录必须改掉。"
    auth: "root，或 sudo useradd（sudoers）"
    notes:
      - "有期限的用户不能进 wheel、sudoers 和写组。"
  userdel:
    auth: "root，或 sudo userdel（sudoers）"
    notes:
      - "root 和 styrigx 不能删。"
  usermod:
    desc:
      - "-aG 加进这些组，-rG 移出；用户的会话作废，要重新登录。"
    auth: "root，或 sudo usermod（sudoers）"
    notes:
      - "移除 wheel 或 sudoers 的最后一个成员会先问一次。"
  rescue:
    desc:
      - "只能用：passwd、passkey、whoami、groups、exit、lock"
      - "用过的钥匙不能再用，救援后去 Cloudflare 换新值"
    notes:
      - "换钥匙不走终端，由 Gray 在 Cloudflare dashboard 改"

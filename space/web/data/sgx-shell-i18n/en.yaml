# 站内终端 man 页的 NAME 说明（终端统一 T5；英文底在 assets/js/shell/term/man/pages.js，懒加载）。键 = 命令名，命令写法不翻译。
man:
  man: "read a command’s manual page"
  cd: "change the current directory (use open to go there)"
  ls: "list a directory"
  cat: "print today’s daymark line"
  sudo: "enter the site (sudo styrigx), sign in to the account (sudo root), or verify again (sudo -v)"
  theme: "open the appearance panel, or set dark / light / auto"
  lock: "lock now, or manage the unlock password and passkeys"
  ask: "ask Gray AI a question"
  find: "search the four sites’ public pages by keyword"
  clear: "clear the screen"
  pwd: "print the current directory"
  open: "open a path: a site, daymark/today or the account card"
  history: "list this session’s commands"
  exit: "leave the current layer, sign out of the account, or close the terminal"
  share: "list, create or revoke share links"
  passwd: "change the account password"
  passkey: "list, add or remove account passkeys"
  device: "list signed-in devices, or sign one out"
  app: "list app access, allow or deny an app"
  profile: "show or change your profile and photo"
  sub: "proxy subscription: status, urls, sources, key and token"
  whoami: "print who you are (v6 identity)"
  su: "switch user: sign in as a user, or become root (wheel)"
  groups: "list a user’s groups"
  who: "list signed-in sessions with their identity path"
  useradd: "create a user (one-time password, shown once)"
  userdel: "delete a user with its sessions, keys and groups"
  usermod: "add a user to groups or remove it from them"
  rescue: "enter the recovery key → a 15-min root rescue session"
# 站内终端 man 页的正文（S9：DESCRIPTION / AUTH / NOTES；= assets/js/shell/term/man/pages.js 的英文底，行数一一对应，tests/space/ui/shell/man-i18n.test.mjs 查两边一致）。
manBody:
  ask:
    desc:
      - "opens the Gray AI window with your question. Gray AI is only for styrigx and root."
  sudo:
    desc:
      - "sudo {admin}: verify with the unlock password or a passkey right here; the terminal closes and the space boots."
      - "sudo -v: verify again for 3 min (as root@account it verifies the account)."
      - "reset: use a recovery key to reset passwords and passkeys."
    notes:
      - "A share-link session (nobody@space:~#) can’t verify again, share or change keys."
  lock:
    desc:
      - "lock: lock this device now (no verification)."
      - "passwd / passkey: the keys that enter the site (not the account ones)."
      - "--all: send every device back to visitor."
    auth: "no verification"
  exit:
    desc:
      - "In reset: leave reset. As root@account: sign out and go back to {admin}@space. Otherwise: close the terminal."
  share:
    desc:
      - "share add: name, page, how long the link lasts, and whether it carries a session."
    auth: "root only; listing and revoking need no reauth"
  passwd:
    auth: "signed in; asks your current password first"
  passkey:
    auth: "signed in"
  device:
    auth: "signed in (sudo {root}); --all needs reauth"
  app:
    desc:
      - "app: every app with its scopes, when and on which device it was allowed."
      - "allow: give an app access again. deny: take it away (asks y/N); the app can still read, it just can’t change anything."
    auth: "root only; allow needs no reauth"
  profile:
    desc:
      - "profile: name, nickname, signature and email (a site default shows when you haven’t set one)."
      - "set: change one field; the whole site follows at once. Name up to 40, nickname up to 32, email checked for format."
      - "avatar: pick a photo and crop it, or remove yours."
    auth: "signed in (sudo {root})"
  sub:
    desc:
      - "sub: the public key (head and tail), the token state and each source: name · airport host or file · nodes · enabled / disabled / error."
      - "show: print the token and every source url (or just one), each with copy; works any time."
      - "add: asks for the airport link (hidden). The same name again changes the link: it is fetched once first and replaces the old one only if that works."
      - "upload: pick a local YAML file; only proxies: is kept. The same name again overwrites it."
      - "mv: rename only, nothing is refreshed; the old path 404s at once. rm: asks y/N, then deletes link, nodes and output."
      - "enable / disable: a disabled source 404s; its link or file and output are kept."
      - "key: paste an age1… X25519 public key; every source is re-encrypted right after."
      - "token reset: makes a new token (asks y/N when one exists); every old url stops working at once."
    auth: "root only; show, key and token reset need no reauth"
    notes:
      - "Urls are https://proxy-rules.styrigx.com/s/<token>/<name>; every output is age-encrypted to your public key."
      - "The server keeps the token sealed with its own key, so sub show can print it again."
      - "Adding, uploading, enabling, disabling, removing or changing the key refreshes once automatically; airports also refresh every 6 hours."
      - "Names use A–Z a–z 0–9 _ - (1–32). At most 20 sources, 2 MB per file. Post-quantum keys (age1pq1…) are not supported yet."
  whoami:
    desc:
      - "Prints the current user; after su root it also shows the path, e.g. root via styrigx."
  su:
    desc:
      - "su <user>: sign in as that user with its password or a passkey; a new user sets a new password on first sign-in."
      - "su root: only members of wheel; asks for root’s credentials; at most 1 h, and 15 min idle in the foreground goes back."
      - "exit leaves one layer; lock signs everything out."
    notes:
      - "root never signs in directly from visitor. While signed in as a user, exit first before su to another user."
  groups:
    auth: "signed in; another user’s groups need root"
  who:
    desc:
      - "Each session’s identity path (root via styrigx) and when it started; you see only your own unless you are root."
  useradd:
    desc:
      - "-e: the account stops working at 00:00 (Beijing time) on that date. -G: groups, comma separated."
      - "Prints a one-time password once (expires in 24 h); the user must change it at first sign-in."
    auth: "root, or sudo useradd (sudoers)"
    notes:
      - "A user with an expiry can’t join wheel, sudoers or the write groups."
  userdel:
    auth: "root, or sudo userdel (sudoers)"
    notes:
      - "root and styrigx can’t be deleted."
  usermod:
    desc:
      - "-aG adds the groups, -rG removes them; the user’s sessions end and it signs in again."
    auth: "root, or sudo usermod (sudoers)"
    notes:
      - "Removing the last member of wheel or sudoers asks first."
  rescue:
    desc:
      - "Only: passwd, passkey, whoami, groups, exit, lock"
      - "A used key can’t be used again; after a rescue, set a new value in Cloudflare"
    notes:
      - "Changing the key isn’t done in the terminal; Gray changes it in the Cloudflare dashboard"

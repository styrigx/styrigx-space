# 2.4.0-G：功能开关统一配置（类似 One UI floating feature）。
# - 语言包化（2026-11-07）：名字 / 说明 / 选项文字不在这里，在字符串表 data/i18n/<语言>.yaml 的 features.<id>.name / desc / opt.<选项 id>（英文为底，缺键回退英文）。
# - build: false → 编译期移除（模板不输出 HTML；JS 用 js.Build define 摇掉代码；设置页不显示）。
# - key 沿用现有 localStorage key，不改名，老用户设置不丢。
# - 用户数据类 key 不在这里，统一走 core 的 storage 封装。
# - 2026-10-23 PR-E：字体大小、减弱动效（跟系统 prefers-reduced-motion）、点击音效、边缘光效、视差壁纸、Good Lock 里的数字健康总开关已删除；
#   旧 localStorage 值（sgx-font-size / sgx-reduced-motion / sgx-gl-sound / sgx-gl-edgeglow / sgx-gl-parallax / sgx-gl-wellbeing）不再被读取，baseof 首屏清掉。
# - P4-2c（2026-11-05）：高级功能分类整个删除——双时钟的日期和时间（tz1-auto / tz1 / tz2 / hour12 / gl-clockstyle）、天气（weather-show / temp-unit）、
#   快捷键（gl-keys）、隐私组的搜索引擎（search-engine）；旧 localStorage 值 baseof 首屏清掉，不再云同步。
# - 2026-11-12 调色板 v4：深浅模式（theme-mode，key sgx-theme-mode）删除，深浅只由调色板决定；旧值 baseof 首屏清掉，不再云同步。
features:
  - id: palette
    build: true
    user: true
    type: enum
    options:
      - {id: cherry}
      - {id: tangerine}
      - {id: terra}
      - {id: amber}
      - {id: matcha}
      - {id: forest}
      - {id: teal}
      - {id: lake}
      - {id: indigo}
      - {id: violet}
      - {id: orchid}
      - {id: berry}
      - {id: rose}
      - {id: graphite}
      - {id: dustyrose}
      - {id: coral}
      - {id: cream}
      - {id: champagne}
      - {id: mustard}
      - {id: lime}
      - {id: sage}
      - {id: aqua}
      - {id: glacier}
      - {id: dustyblue}
      - {id: lilac}
    default: terra
    key: sgx-palette
    section: ""  # 对齐 PR-C：风格页（/theme/）退役，调色板只在顶栏外观弹层，不进搜索索引
    requires: []

  - id: layout
    icon: layout
    iclass: bg-m-primary-container text-m-on-primary-container
    row: layout
    build: true
    user: true
    type: enum
    options:
      - {id: mobile}
      - {id: auto}
      - {id: dex}
    default: auto
    key: sgx-layout
    section: ""  # P4-3 PR-4b：显示页（/display/）删除，开关只在快捷面板，不进搜索索引
    requires: []

  - id: lang
    build: true
    user: true
    type: enum
    options:
      - {id: system}
      - {id: zh}
      - {id: en}
    default: system
    key: sgx-lang
    section: ""  # P4-3 PR-4b：显示页（/display/）删除，开关只在快捷面板，不进搜索索引
    requires: []

  - id: files-view
    build: true
    user: true
    type: json
    default: {layout: list, sort: added}
    key: sgx-files-view
    section: files
    requires: []

  - id: files-home
    build: true
    user: true
    type: json
    default: {cats: true, sites: true, recent: true, storage: true, fav: true}
    key: sgx-files-home
    section: files
    requires: []


  - id: lock-gate
    build: true
    user: false
    type: bool
    default: true
    key: null
    section: ""
    requires: []

# 主站门内子页（单数据源）：子页标题（layouts/_default/sub.html、baseof 页名）、搜索索引（space/scripts/build-search-index.mjs）、
# 数字健康区域（lib/wb-area.js SPACE_SUB_RE，tests/space/ui/build/space-merge.test.mjs 对照检查）共用。
# id 即地址（/<id>/，中文 /zh/<id>/）；名字 / 副标题在字符串表 data/i18n/<语言>.yaml 的 spaceCats.<id>.title / sub。
# 2026-11 对齐 PR-B（设计稿 tb4.html）：主页不再有分类入口（旧 sgx-entries 平铺行删除）——
#   旷野是独立页 /wild/（屏幕时间 / 服务状态 / 关于本站三窗，原 /wellbeing/ /status/ /about/ 在 static/_redirects 301 到它的锚点）；
#   安全由顶栏盾牌进入（进站 v3 L1 起 /security/* 整页删了，盾牌下拉 = 进站命令行，旧地址 301 到 /#sec[=<层>]）；风格页 /theme/ 2026-11 对齐 PR-C 退役（功能在顶栏外观弹层，旧地址 static/_redirects 301 到主页）。
# 字段：icon = partials/icon.html 的图标名；tone = 圆底配色（primary / secondary / tertiary / info）。
cats:
  - id: wild
    icon: pulse
    tone: info

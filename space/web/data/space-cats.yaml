# 旷野页（/）分类入口（单数据源）。旷野页平铺入口（共享组件 partials/sgx-entries.html）、各子页标题（layouts/_default/sub.html、baseof 页名）、
# 搜索索引（space/scripts/build-search-index.mjs）共用。新增入口只加一行：id 即地址（/<id>/，中文 /zh/<id>/；security、status 是独立布局），
# 同时在 content/（英文）与 content/zh/（中文）加页面、lib/wb-area.js SPACE_SUB_RE 加一项（tests/space/ui/build/space-merge.test.mjs 对照检查）。
# 字段：icon = partials/icon.html 的图标名；tone = 圆底配色（primary / secondary / tertiary / info，走共享外壳色彩角色，跟调色板）；
#   zh / en = 名字；sub_zh / sub_en = 一行副标题。编号 01… 按行序自动生成。
# P4-3 PR-4b（Gray 2026-11-07）：显示页（/display/）整页删除（深色 / 跟随系统 / 语言 / 布局都在快捷面板），不做 301；
#   入口改成平铺（无卡片底、编号、圆底图标、名字 + 副标题、细分隔线），原 group / bg / fg 字段删除。
# 副标题与标题带那句话是占位文案（Gray 定稿后替换）。
band:
  # 旷野上方的小标签：英文 SPACE，中文「空间」（Gray 2026-11-07；之前中英同为 SPACE）
  label_en: SPACE
  label_zh: 空间
  zh: 旷野
  en: Space
  sub_zh: 这个站自己的样子、钥匙和作息，都在这里。
  sub_en: How this site looks, its keys and its rhythm — all in one place.
cats:
  - id: theme
    icon: palette
    tone: primary
    zh: 风格
    en: Style
    sub_zh: 调色板与主题色
    sub_en: Palettes and accent colour
  - id: security
    icon: shield
    tone: secondary
    zh: 安全
    en: Security
    sub_zh: 通行密钥、锁屏与临时钥匙
    sub_en: Passkeys, lock screen and temporary keys
  - id: wellbeing
    icon: heart-ring
    tone: tertiary
    zh: 数字健康
    en: Digital wellbeing
    sub_zh: 屏幕时间与作息
    sub_en: Screen time and habits
  - id: status
    icon: pulse
    tone: info
    zh: 服务状态
    en: Service status
    sub_zh: 四站与接口是否在线
    sub_en: Whether the sites and APIs are up
  - id: about
    icon: info
    tone: primary
    zh: 关于本站
    en: About
    sub_zh: 版本、致谢与开源
    sub_en: Version, credits and open source

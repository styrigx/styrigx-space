# 主站门内子页（单数据源）：子页标题（layouts/_default/sub.html、baseof 页名）、搜索索引（space/scripts/build/build-search-index.mjs）共用
# （数字健康区域 lib/wb-area.js v6 P4 随数字健康删除）。
# id 即地址（/<id>/，中文 /zh/<id>/）；名字 / 副标题在字符串表 data/common/i18n/<语言>.yaml 的 spaceCats.<id>.title / sub。
# 2026-11 对齐 PR-B（设计稿 tb4.html）：主页不再有分类入口（旧 sgx-entries 平铺行删除）——
#   状态页 /status/（服务状态窗；2026-11-12 旷野删除，状态从 /wild/#status 搬出单独成页，/wild/ 在 static/_redirects 301 到这里）；
#   安全由顶栏盾牌进入（进站 v3 L1 起 /security/* 整页删了，盾牌下拉 = 进站命令行，旧地址 301 到 /#sec[=<层>]）；风格页 /theme/ 2026-11 对齐 PR-C 退役（功能在顶栏外观弹层，旧地址 static/_redirects 301 到主页）。
# 字段：icon = partials/common/icon.html 的图标名；tone = 圆底配色（primary / secondary / tertiary / info）。
cats:
  - id: status
    icon: pulse
    tone: info

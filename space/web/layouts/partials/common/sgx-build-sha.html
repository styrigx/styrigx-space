{{- /* 构建短 SHA，写在 <html data-sgx-build>（页内切换判断取回来的页面是不是同一次构建）。CI 经 SGX_BUILD_SHA 环境变量注入（github.sha）；
   本地/测试构建默认 "dev"。页脚版权行末尾的「build xxxxxxx」（链到 GitHub 提交，Gray 2026-11-09 加回）也用它，dev 时不显示。 */ -}}
{{- $s := getenv "SGX_BUILD_SHA" | default "dev" -}}
{{- if gt (len $s) 7 }}{{ slicestr $s 0 7 }}{{ else }}{{ $s }}{{ end -}}

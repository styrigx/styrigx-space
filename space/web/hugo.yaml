title: 'Styrigx'
baseURL: 'https://styrigx.com/'
# P4-3 PR-4c（§6.8）：英文是默认语言、不带前缀；中文在 /zh/。中英两版内容都在 content/（英文）和 content/zh/（中文，url 带 /zh/），
# 页面一律在 front matter 固定英文 url，路径段中英相同。旧的 /en/… 删除不 301；不要 Hugo 生成 /en/ → / 的跳转页。
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
disableDefaultLanguageRedirect: true
hasCJKLanguage: true
languages:
  en:
    label: English
    weight: 1
    params:
      ogLocale: en_US
      # 快捷面板语言选项的顺序（小的在前；没写按 weight）。weight 管默认语言 / 翻译排序，选择器顺序单独定：跟随系统 / 中文 / English
      pickerWeight: 2
  zh:
    label: 中文
    weight: 2
    params:
      ogLocale: zh_CN
      pickerWeight: 1
theme: []

build:
  writeStats: true
enableRobotsTXT: true
enableEmoji: true

# P4-3 PR-4c：站点地图只要根上一份 /sitemap.xml（公开页清单，中英两版地址都在里面）。
# Hugo 自带的多语言站点地图会出 /sitemap.xml 索引 + /en/sitemap.xml、/zh/sitemap.xml，/en/… 已经不该存在，所以关掉，改用 sitemappublic（root: true）。
disableKinds:
  - sitemap
outputFormats:
  filesindex:
    mediaType: application/json
    baseName: files-index
    isPlainText: true
    notAlternative: true
  sitemappublic:
    mediaType: application/xml
    baseName: sitemap
    isPlainText: true
    notAlternative: true
    root: true
outputs:
  home:
    - HTML
    - RSS
    - filesindex
    - sitemappublic

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  # 站点描述在字符串表 data/i18n/<语言>.yaml 的 site.description（语言包化 2026-11-07）
  since: 2020
  # 版本号唯一来源：data/version.yaml（ui + sgx），此处不硬编码

# 2.3.12：tdewolff HTML 压缩器与内联 JS 中的 < 冲突，禁用 HTML 压缩（CSS 已由 Tailwind 压缩）
minify:
  disableHTML: true

# Hark：允许模板读取测试用环境变量（CI 专用，生产构建不设置）
security:
  funcs:
    getenv:
      - '^SGX_TEST_'
      - '^HUGO_'
      - '^CI$'
      - '^GITHUB_SHA$'  # 2.6.0：关于本站显示构建 commit 短哈希
      - '^SGX_BUILD_SHA$'  # #1 诊断：构建标记（仅生产构建设置，测试构建显示 dev）

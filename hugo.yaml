title: 'Styrigx'
baseURL: 'https://styrigx.com/'
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
hasCJKLanguage: true
languages:
  zh:
    languageName: 中文
    weight: 1
  en:
    languageName: English
    weight: 2
theme: []

build:
  writeStats: true
enableRobotsTXT: true
enableEmoji: true

outputFormats:
  filesindex:
    mediaType: application/json
    baseName: files-index
    isPlainText: true
    notAlternative: true
outputs:
  home:
    - HTML
    - RSS
    - filesindex

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: 'Sloan Gray 的个人门户'
  since: 2020
  version: '2.3.14.8'

# 2.3.12：tdewolff HTML 压缩器与内联 JS 中的 < 冲突，禁用 HTML 压缩（CSS 已由 Tailwind 压缩）
minify:
  disableHTML: true

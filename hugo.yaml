title: 'Styrigx'
baseURL: 'https://styrigx.com/'
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
hasCJKLanguage: true
languages:
  zh:
    languageName: 中文
    weight: 1
  en:
    languageName: English
    weight: 2
theme: []

build:
  writeStats: true
enableRobotsTXT: true
enableEmoji: true

outputFormats:
  filesindex:
    mediaType: application/json
    baseName: files-index
    isPlainText: true
    notAlternative: true
outputs:
  home:
    - HTML
    - RSS
    - filesindex

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: 'Sloan Gray 的个人门户'
  since: 2020
  version: '2.4.0'
  # 2.4.0 H：Turnstile 站点密钥（公开）
  turnstileSiteKey: '0x4AAAAAAFSBhpWkAwZr1SMA'

# 2.3.12：tdewolff HTML 压缩器与内联 JS 中的 < 冲突，禁用 HTML 压缩（CSS 已由 Tailwind 压缩）
minify:
  disableHTML: true

# Hark：允许模板读取测试用环境变量（CI 专用，生产构建不设置）
security:
  funcs:
    getenv:
      - '^SGX_TEST_'
      - '^HUGO_'
      - '^CI$'

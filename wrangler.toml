# styrigx-space (Cloudflare Pages)
# 由线上配置生成（2026-10-12）：production + preview 的 KV 绑定和明文变量完整镜像。
# Secrets 不进 toml（不受 toml 部署影响，由 dashboard/API 管理）。
# D1 绑定：SGX_D1 用于 2.11 恢复开关的计时/单次标记。
# 注意：一旦 pages_build_output_dir 生效，toml 即为 Pages 唯一配置源；
# 后台的 KV 绑定和明文变量必须与此处一致，否则会被清空。

name = "styrigx-space"
compatibility_date = "2026-10-09"
pages_build_output_dir = "web/public"

# ---- production 明文变量（6 个）----
[vars]
SGX_APP_PUBLIC = "MCowBQYDK2VwAyEALMzibmc7WjzQHau0cEF80pZnXjKl+DBFySISmnVdIbw="
SGX_LOCK_PUBLIC = "MCowBQYDK2VwAyEAtq3DQmTYYJj/lv92roCIALF7pKqfplSJ2pWtq1CvHcc="
SGX_ORIGIN = "https://styrigx.com"
SGX_RP_ID = "styrigx.com"
SGX_SITE = "space"
SGX_STEPUP_PUBLIC = "MCowBQYDK2VwAyEAxtMe8kJcgn03XUeCfNsWXWXTxUnMThnDmusnQXwFGOk="

# ---- production KV 绑定（styrigx-owner）----
[[kv_namespaces]]
binding = "OWNER_KV"
id = "b796097c90104000992b7713f61e16ea"

# ---- D1 绑定（2.11 恢复开关）----
[[d1_databases]]
binding = "SGX_D1"
database_name = "styrigx-sgx"
database_id = "2804d280-1cab-422a-834d-3390cea38976"

# ---- D1 绑定（B2-5 我的文件 › 书籍）：书库库 styrigx-books，只读使用（/api/books 只做 SELECT）----
# preview 不绑：/api/books 未绑定时返回空列表，预览不碰正式书库。
[[d1_databases]]
binding = "BOOKS_D1"
database_name = "styrigx-books"
database_id = "569d8caf-e315-471b-a080-4b9f055de5fa"

# ---- preview 环境 ----
[env.preview.vars]
SGX_LOCK_PUBLIC = "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAxZb8houVYG+lY/Jn4A1zNJzKMb1LdDHHEIQSAjfERPU=\n-----END PUBLIC KEY-----\n"
SGX_ORIGIN = "https://passkey-e2e.styrigx-space.pages.dev"
SGX_RP_ID = "passkey-e2e.styrigx-space.pages.dev"
SGX_SITE = "space"
SGX_STEPUP_PUBLIC = "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEA0B4XJGA9BSblvgF7KOAT7Jbp2zUMFR9PfDxKpUdxqIY=\n-----END PUBLIC KEY-----\n"

# preview KV 绑定（styrigx-owner-test_preview）
[env.preview]
[[env.preview.kv_namespaces]]
binding = "OWNER_KV"
id = "5084ea8ef2444156ba48203220b93df6"

# preview D1 绑定（styrigx-sgx-preview：新建空库，只给预览用；绝不指向正式库 styrigx-sgx）
[[env.preview.d1_databases]]
binding = "SGX_D1"
database_name = "styrigx-sgx-preview"
database_id = "ea34e0a4-f543-4b58-93f8-561ad5bf3ee1"

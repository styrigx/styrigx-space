# 2.4.0-G：功能开关统一配置（类似 One UI floating feature）。
# - build: false → 编译期移除（模板不输出 HTML；JS 用 js.Build define 摇掉代码；设置页不显示）。
# - key 沿用现有 localStorage key，不改名，老用户设置不丢。
# - 用户数据类 key 不在这里，统一走 core 的 storage 封装。
# - 2026-10-23 PR-E：字体大小、减弱动效（跟系统 prefers-reduced-motion）、点击音效、边缘光效、视差壁纸、Good Lock 里的数字健康总开关已删除；
#   旧 localStorage 值（sgx-font-size / sgx-reduced-motion / sgx-gl-sound / sgx-gl-edgeglow / sgx-gl-parallax / sgx-gl-wellbeing）不再被读取，baseof 首屏清掉。
#   section: advanced = 设置 › 高级功能（原 Good Lock + 常规管理里的日期和时间 / 天气）；gl-* 的 id / key 沿用，老用户设置不丢。
features:
  - id: theme-mode
    name: {zh: 主题模式, en: Theme mode}
    build: true
    user: true
    type: enum
    options:
      - {id: system, zh: 跟随系统, en: Follow system}
      - {id: light, zh: 浅色, en: Light}
      - {id: dark, zh: 深色, en: Dark}
    default: system
    key: sgx-theme-mode
    section: display
    requires: []

  - id: palette
    name: {zh: 调色板, en: Color palette}
    build: true
    user: true
    type: enum
    options:
      - {id: lake, zh: 默认, en: Default}
      - {id: forest, zh: 山绿, en: Forest}
      - {id: terra, zh: 陶土, en: Terracotta}
      - {id: violet, zh: 紫, en: Violet}
      - {id: rose, zh: 蔷薇, en: Rose}
      - {id: cherry, zh: 樱桃, en: Cherry}
      - {id: tangerine, zh: 橘子, en: Tangerine}
      - {id: amber, zh: 琥珀, en: Amber}
      - {id: matcha, zh: 抹茶, en: Matcha}
      - {id: teal, zh: 青碧, en: Teal}
      - {id: indigo, zh: 靛蓝, en: Indigo}
      - {id: orchid, zh: 兰紫, en: Orchid}
      - {id: dustyblue, zh: 雾霾蓝, en: Dusty Blue}
      - {id: mustard, zh: 芥末黄, en: Mustard}
      - {id: sage, zh: 鼠尾草绿, en: Sage}
      - {id: dustyrose, zh: 干枯玫瑰, en: Dusty Rose}
      - {id: graphite, zh: 石墨, en: Graphite}
      - {id: xforest, zh: 山绿×橘子, en: Forest × Tangerine}
      - {id: xterra, zh: 陶土×鼠尾草, en: Terracotta × Sage}
      - {id: xviolet, zh: 紫×蔷薇, en: Violet × Rose}
      - {id: xrose, zh: 蔷薇×杏, en: Rose × Apricot}
      - {id: xcherry, zh: 樱桃×嫩叶, en: Cherry × Leaf}
      - {id: xtangerine, zh: 橘子×海蓝, en: Tangerine × Sea Blue}
      - {id: xamber, zh: 琥珀×梅子, en: Amber × Plum}
      - {id: xmatcha, zh: 抹茶×焙茶, en: Matcha × Hojicha}
      - {id: xteal, zh: 青碧×樱桃, en: Teal × Cherry}
      - {id: xindigo, zh: 靛蓝×霓虹粉, en: Indigo × Neon Pink}
      - {id: xorchid, zh: 兰紫×石板灰, en: Orchid × Slate}
      - {id: xdustyblue, zh: 雾霾蓝×芥末黄, en: Dusty Blue × Mustard}
      - {id: xmustard, zh: 芥末黄×雾霾蓝, en: Mustard × Dusty Blue}
      - {id: xsage, zh: 鼠尾草绿×干枯玫瑰, en: Sage × Dusty Rose}
      - {id: xdustyrose, zh: 干枯玫瑰×鼠尾草绿, en: Dusty Rose × Sage}
      - {id: xgraphite, zh: 石墨×湖蓝, en: Graphite × Lake Blue}
    default: lake
    key: sgx-palette
    section: theme
    requires: []

  - id: layout
    name: {zh: 布局, en: Layout}
    desc: {zh: 手动选择会覆盖按视口的自动判断。, en: Manual choice overrides the automatic viewport detection.}
    icon: layout
    iclass: bg-m-primary-container text-m-on-primary-container
    row: layout
    build: true
    user: true
    type: enum
    options:
      - {id: mobile, zh: Mobile, en: Mobile}
      - {id: auto, zh: Auto, en: Auto}
      - {id: dex, zh: DeX, en: DeX}
    default: auto
    key: sgx-layout
    section: display
    requires: []

  - id: lang
    name: {zh: 语言, en: Language}
    build: true
    user: true
    type: enum
    options:
      - {id: system, zh: 跟随系统, en: Follow system}
      - {id: zh, zh: 中文, en: Chinese}
      - {id: en, zh: 英文, en: English}
    default: system
    key: sgx-lang
    section: display
    requires: []

  - id: gl-clockstyle
    icon: clock
    bg: bg-m-secondary-container
    fg: text-m-on-secondary-container
    desc: {zh: 双时钟在数字与指针之间切换, en: Switch dual clock between digital and analog}
    name: {zh: 时钟样式, en: Clock style}
    build: true
    user: true
    type: bool
    default: false
    storage: {on: "1", off: null}
    key: sgx-gl-clockstyle
    section: advanced
    requires: []

  - id: gl-keys
    icon: keyboard
    bg: bg-m-accent-container
    fg: text-m-on-accent-container
    desc: {zh: "桌面端 g h / g l / g b / g s 快速跳转，? 查看列表", en: "Desktop: g h / g l / g b / g s to jump, ? for list"}
    name: {zh: 快捷键, en: Keyboard shortcuts}
    build: true
    user: true
    type: bool
    default: false
    storage: {on: "1", off: null}
    key: sgx-gl-keys
    section: advanced
    requires: []

  - id: weather-show
    name: {zh: 显示天气小组件, en: Show weather widget}
    build: true
    user: true
    type: bool
    default: true
    storage: {on: null, off: "0"}
    key: sgx-weather-show
    section: advanced
    requires: []

  - id: temp-unit
    name: {zh: 温度单位, en: Temperature unit}
    build: true
    user: true
    type: enum
    options:
      - {id: c, zh: 摄氏度, en: Celsius}
      - {id: f, zh: 华氏度, en: Fahrenheit}
    default: c
    key: sgx-temp-unit
    section: advanced
    requires: [weather-show]

  - id: tz1-auto
    name: {zh: 第一时区使用本地时间, en: Use local time for primary timezone}
    build: true
    user: true
    type: bool
    default: true
    storage: {on: null, off: "0"}
    key: sgx-tz1-auto
    section: advanced
    requires: []

  - id: tz1
    name: {zh: 第一时区, en: Primary timezone}
    build: true
    user: true
    type: string
    default: America/Los_Angeles
    key: sgx-tz1
    section: advanced
    requires: []

  - id: tz2
    name: {zh: 第二时区, en: Second timezone}
    build: true
    user: true
    type: string
    default: America/Los_Angeles
    key: sgx-tz2
    section: advanced
    requires: []

  - id: hour12
    name: {zh: 小时制, en: Hour format}
    build: true
    user: true
    type: enum
    options:
      - {id: "24", zh: 24 小时制, en: 24-hour}
      - {id: "12", zh: 12 小时制, en: 12-hour}
    default: "24"
    key: sgx-hour12
    section: advanced
    requires: []

  - id: search-engine
    name: {zh: 搜索引擎, en: Search engine}
    build: true
    user: true
    type: enum
    options:
      - {id: google, zh: Google, en: Google}
      - {id: bing, zh: Bing, en: Bing}
      - {id: duckduckgo, zh: DuckDuckGo, en: DuckDuckGo}
      - {id: yahoo, zh: Yahoo, en: Yahoo}
      - {id: ecosia, zh: Ecosia, en: Ecosia}
    default: google
    key: sgx-search-engine
    section: security
    requires: []

  - id: files-view
    name: {zh: 文件默认视图, en: Files default view}
    build: true
    user: true
    type: json
    default: {layout: list, sort: added}
    key: sgx-files-view
    section: files
    requires: []

  - id: files-home
    name: {zh: 文件主页分组, en: Files home sections}
    build: true
    user: true
    type: json
    default: {cats: true, sites: true, recent: true, storage: true, fav: true}
    key: sgx-files-home
    section: files
    requires: []

  - id: well-tip
    name: {zh: 15 分钟提醒, en: 15-minute reminder}
    desc: {zh: 停留 15 分钟后温和提醒一次, en: A gentle nudge after 15 minutes here}
    icon: ""
    iclass: ""
    row: welltip
    build: true
    user: true
    type: bool
    default: true
    storage: {on: null, off: "0"}
    key: sgx-well-tip
    section: wellbeing
    requires: []

  - id: owner-gate
    name: {zh: 本人验证门禁, en: Owner gate}
    build: true
    user: false
    type: bool
    default: true
    key: null
    section: ""
    requires: []

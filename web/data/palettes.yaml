# 调色板配置（色板列表的单数据源）。两组（2026-10-21）：group: mono = 单色（同一色相的深浅，默认 lake 在这组），group: clash = 撞色（主 / 辅 / 第三色取不同色相族）。
# 加颜色：这里加一项（c = 种子，色块显示），在 web/assets/js/lib/palette-scheme.js 的 PRESETS 加同 id、同 group 的规格，
# 再跑 node scripts/gen-palettes.mjs --roles（重建 web/data/palette-roles.json 并写进 input.css）和 node scripts/gen-shell.mjs；web/data/features.yaml 的 palette 选项同步加。
# settings 风格页（setcat-theme.html，单色 / 撞色两个分页）和快捷面板（baseof.html）共用 site.Data.palettes.palettes。

# 主站顶栏三栏（2026-10-22，只在主站；子站顶栏不变，共享外壳 web/shared/shell/* 不动）。
# 主页 / 聊天 / 设置这三页的长条里不放页名，换成这三个标签（当前页 aria-current="page"，药丸高亮）；左右滑按这个顺序切换。
# 2026-10-24 PR4：第三栏「状态」换成「设置」（设置首页 /settings/）；服务状态挪进账号页「服务状态」一行（/account/status/），旧 /status/ 页删除、不留跳转。
# 其他页（设置子页、账号……）长条照旧只有页名。模板：partials/topbar-tabs.html；样式：input.css「主站顶栏三栏」。
# 2026-10-24 页内切换：三个地址照旧各自直出完整 HTML（直接打开 / 刷新 / 分享 / 没 JS 都照常）；进来以后另外两栏在同一个文档里切换
# （shell/inpage-tabs.js：后台取另外两页的 HTML、只抽 <main> 内容区，pushState / popstate；三页各一个入口 entries/entry-tab-<id>.js，另两栏按需 import entries/lazy-<id>.js）。
# 加一栏：这里加一项 + 新建 entry-tab-<id>.js / lazy-<id>.js（照现有三个写，登记进 baseof 的 js.Batch 入口列表）+ 其余 entry-tab-*.js 里 registerTab() 加一行。
# layout：哪个 Hugo 布局算这一栏（home = 首页 .IsHome）。
tabs:
  - id: home
    zh: 主页
    en: Home
    path: /
    layout: home
  - id: chat
    zh: 聊天
    en: Chat
    path: /chat/
    layout: chat
  - id: settings
    zh: 设置
    en: Settings
    path: /settings/
    layout: settings

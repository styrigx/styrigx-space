title: '奇趣'
# 图志（atlas.styrigx.com）下的子路径：页面、资源、接口都在 /curio/ 下（中文 /curio/，英文 /curio/en/）
baseURL: 'https://atlas.styrigx.com/curio/'
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
hasCJKLanguage: true
languages:
  zh:
    label: 中文
    weight: 1
  en:
    label: English
    weight: 2
theme: []

# robots.txt 只有图志根上的一份 root/robots.txt（Disallow: /，整个 atlas.styrigx.com 共用）。设 true 时 Hugo 内置模板会生成本站子目录里的 robots.txt（爬虫不读，白生成）
enableRobotsTXT: false
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: 'Sloan Gray 的奇趣：在网上偶然遇到、想留下的好东西'
  version: '0.2.0'

disableKinds: ['taxonomy', 'term', 'rss', 'section']

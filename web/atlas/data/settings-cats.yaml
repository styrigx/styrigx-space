# 2.6.0：设置分类定义（单数据源）。设置首页、二级页、双栏导航共用。
# 2026-10-23 PR-E 设置瘦身：只留 6 项，每项单独一张圆角卡片（group 各不相同，卡与卡之间留缝）。
#   常规管理（语言并入显示，日期和时间 / 天气并入高级功能）、辅助功能（减弱动效跟系统 prefers-reduced-motion）已删除。

# 调色板配置（色板列表的单数据源）。2026-10-23 PR-G 七色调色板：22 套，每套 = 1 个背景色（c，7 档深浅 → 光晕）+ 6 个前景撞色；
# 原来的单色 / 撞色两组合并，x* 撞色 id 删除（旧值 x<id> 迁到 <id>）。默认 dustyblue（雾霾蓝）。
# group = 设置风格页的分组（cool 冷调 / nature 自然 / warm 暖调 / floral 花色 / neutral 中性），顺序 = 网格顺序。
# 加颜色：这里加一项，在 web/assets/js/lib/palette-scheme.js 的 THEMES 加同 id、同 group、同背景色的一行（6 个前景从 FG_POOL 里挑），
# 再跑 node scripts/gen-palettes.mjs --roles（重建 web/data/palette-roles.json 并写进 input.css）和 node scripts/gen-shell.mjs；web/data/features.yaml 的 palette 选项同步加。
# settings 风格页（setcat-theme.html）和快捷面板（baseof.html）共用 site.Data.palettes.palettes；色块颜色走 partials/palette-tile-vars.html。
# 单一数据源：颜色值只在 palette-scheme.js 的 THEMES / FG_POOL；这里的 c / zh / en / group 是副本，单测（palette-scheme.test.mjs）逐项核对，不一致就红。
#   色块 / 预览卡的颜色从生成的 data/palette-roles.json 取（palette-tile-vars.html），和页面角色同一份数据。
# 档位用法（硬规则，详见 docs/palette-usage.md）：
#   - 背景 7 档（--sgx-bg-1..7）：每个模式各一条阶梯，只给光晕和页面底（bg-1）；不当大面积内容表面，不放在文字底下。
#   - 前景 tint = 浅底（chip / 标签 / 选中底）；base = 填充（按钮 / 开关 / 进度 / 选中分段，上面的字由引擎自动挑 on-primary-fill）；ink = 文字 / 图标。
#   - 前景 5–6 只给图表和设置页色块 / 预览。
#   - 深色 / 饱和的档位永远不当大面积底色铺在文字下面。
groups:
  - {id: cool, zh: 冷调, en: Cool}
  - {id: nature, zh: 自然, en: Nature}
  - {id: warm, zh: 暖调, en: Warm}
  - {id: floral, zh: 花色, en: Floral}
  - {id: neutral, zh: 中性, en: Neutral}

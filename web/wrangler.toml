# styrigx-space（Cloudflare Pages）：只放静态文件。
#
# 主站的会话检查、接口、数据绑定和密钥全在鉴权网关 workers/auth-gateway（它挂在 styrigx.com 的路由上）。
# 生产部署没有任何变量和绑定；static/_worker.js 只把 *.pages.dev 的访问 301 到 styrigx.com。
#
# 本文件是 Pages 的唯一配置源（pages_build_output_dir 生效时，后台的绑定和明文变量以这里为准）。
# 部署在 web/ 目录下执行：npx wrangler pages deploy public --project-name=styrigx-space
#
# preview 环境只给 passkey-e2e 用：CI 把网关打包成 _worker.js 覆盖进 public/，
# 在 passkey-e2e.styrigx-space.pages.dev 上跑网关的同一份代码，连测试专用 D1 styrigx-test-preview，绝不碰正式数据。
# 预览的私密值（测试密钥）由 CI 每次部署前写入，不进 toml。

name = "styrigx-space"
compatibility_date = "2026-10-09"
pages_build_output_dir = "public"

# ---- preview 环境（passkey-e2e）----
[env.preview.vars]
# 网关缺 SGX_ENV 时按生产处理（只认 styrigx.com）；预览必须显式写 preview 才能在 pages.dev 地址上跑
SGX_ENV = "preview"
SGX_LOCK_PUBLIC = "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAxZb8houVYG+lY/Jn4A1zNJzKMb1LdDHHEIQSAjfERPU=\n-----END PUBLIC KEY-----\n"
SGX_ORIGIN = "https://passkey-e2e.styrigx-space.pages.dev"
SGX_RP_ID = "passkey-e2e.styrigx-space.pages.dev"
SGX_SITE = "space"

# 预览只绑 D1（2026-10-27 起网关不再用 KV）。
# 账号拆分 PR3：预览的 _worker.js 是组合入口 tests/web/e2e/preview-worker.js（网关 + 账号 Worker 两边的代码，网关的 ACCOUNT /
# ACCOUNT_VERIFIER 换成进程内适配器，只给 CI 用）。账号那一半用 D1_ACCOUNT_AUTH（同一个测试库）；预览不绑账号资料库
# （KV_PROFILE / D1_SETTINGS_SYNC / D1_WELLBEING），passkey-e2e 不测它们，/avatar/<尺寸>.webp 落到静态默认图（env.ASSETS）。
[env.preview]
# preview D1 绑定（styrigx-test-preview：所有 Worker 的预览共用的测试专用库，2026-10-29 起；绝不指向正式库 styrigx-auth-gateway）。
# 同库还有账号 Worker、短链 Worker 的预览表（workers/account、workers/share 的 [env.preview]），表名互不重叠；
# 本块用默认迁移记录表 d1_migrations（同正式网关），那两个 Worker 各用自己的 migrations_table。
# 绑定名同正式：D1_LOCK_AUTH（网关）、D1_ACCOUNT_AUTH（账号 Worker），同一个库两个名字；网关迁移文件和网关放在一起
# （workers/auth-gateway/migrations/），migrations_dir 只写在 D1_LOCK_AUTH 这一块。
[[env.preview.d1_databases]]
binding = "D1_LOCK_AUTH"
database_name = "styrigx-test-preview"
database_id = "1339bb0b-f9f8-4e3d-b413-ff07ca28ce69"
migrations_dir = "../workers/auth-gateway/migrations"

[[env.preview.d1_databases]]
binding = "D1_ACCOUNT_AUTH"
database_name = "styrigx-test-preview"
database_id = "1339bb0b-f9f8-4e3d-b413-ff07ca28ce69"

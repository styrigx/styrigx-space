# styrigx-space（Cloudflare Pages）：只放静态文件。
#
# 主站的会话检查、接口、数据绑定和密钥全在鉴权网关 workers/auth-gateway（它挂在 styrigx.com 的路由上）。
# 生产部署没有任何变量和绑定；static/_worker.js 只把 *.pages.dev 的访问 301 到 styrigx.com。
#
# 本文件是 Pages 的唯一配置源（pages_build_output_dir 生效时，后台的绑定和明文变量以这里为准）。
# 部署在 web/ 目录下执行：npx wrangler pages deploy public --project-name=styrigx-space
#
# preview 环境只给 passkey-e2e 用：CI 把网关打包成 _worker.js 覆盖进 public/，
# 在 passkey-e2e.styrigx-space.pages.dev 上跑网关的同一份代码，连预览用的空 D1，绝不碰正式数据。
# 预览的私密值（测试密钥）由 CI 每次部署前写入，不进 toml。

name = "styrigx-space"
compatibility_date = "2026-10-09"
pages_build_output_dir = "public"

# ---- preview 环境（passkey-e2e）----
[env.preview.vars]
# 网关缺 SGX_ENV 时按生产处理（只认 styrigx.com）；预览必须显式写 preview 才能在 pages.dev 地址上跑
SGX_ENV = "preview"
SGX_LOCK_PUBLIC = "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAxZb8houVYG+lY/Jn4A1zNJzKMb1LdDHHEIQSAjfERPU=\n-----END PUBLIC KEY-----\n"
SGX_ORIGIN = "https://passkey-e2e.styrigx-space.pages.dev"
SGX_RP_ID = "passkey-e2e.styrigx-space.pages.dev"
SGX_SITE = "space"

# 预览网关只绑 D1（2026-10-27 起网关不再用 KV；以前的预览 KV namespace 5084ea8e… 不再绑定，namespace 本身没删）。
# 头像 / 云同步 / 数字健康 2026-10-24 搬到账号 Worker styrigx-account（workers/account），预览网关不再绑 styrigx-account-preview；
# 预览里 /api/avatar、/api/prefs、/api/wellbeing 回 404（passkey-e2e 不测它们），/avatar/<尺寸>.webp 是静态默认图。
[env.preview]
# preview D1 绑定（styrigx-auth-gateway-preview：只给预览用的空库；绝不指向正式库 styrigx-auth-gateway）。
# 绑定名同正式（workers/auth-gateway/wrangler.toml）：D1_<域>_AUTH，同一个库三个名字；迁移文件和网关放在一起
# （workers/auth-gateway/migrations/），migrations_dir 只写在 D1_LOCK_AUTH 这一块。
[[env.preview.d1_databases]]
binding = "D1_LOCK_AUTH"
database_name = "styrigx-auth-gateway-preview"
database_id = "d417e421-75bb-4425-bdc8-54856b88578f"
migrations_dir = "../workers/auth-gateway/migrations"

[[env.preview.d1_databases]]
binding = "D1_ACCOUNT_AUTH"
database_name = "styrigx-auth-gateway-preview"
database_id = "d417e421-75bb-4425-bdc8-54856b88578f"

[[env.preview.d1_databases]]
binding = "D1_ROOT_AUTH"
database_name = "styrigx-auth-gateway-preview"
database_id = "d417e421-75bb-4425-bdc8-54856b88578f"
